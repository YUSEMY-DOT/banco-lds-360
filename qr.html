<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - Escanear QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(12, 30, 48, 0.45), rgba(12, 30, 48, 0.45)), 
                        url('assets/banco.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow-x: hidden;
        }

        header {
            background-color: #0c1e30;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .school-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-info img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .school-text h3 {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 800;
        }

        .school-text p {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
            font-style: italic;
        }

        .home-btn {
            background: #152b42;
            border: 2px solid #f1c40f;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #203f61;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .qr-card {
            background: rgba(12, 30, 48, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            border: 3px solid #40c4ff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 100%;
            padding: 24px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-title {
            color: #40c4ff;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        #reader {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #40c4ff;
            background: #000000;
            min-height: 260px;
        }

        /* Oculta textos innecesarios del lector */
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink {
            background: #152b42 !important;
            color: #fff !important;
            border: 1px solid #f1c40f !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
            font-family: 'Poppins', sans-serif !important;
            cursor: pointer;
        }

        footer {
            background-color: #0c1e30;
            text-align: center;
            padding: 12px;
            font-size: 0.82rem;
            color: #ffffff;
            font-weight: 600;
            border-top: 3px solid #f1c40f;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="school-info">
            <img src="assets/insignia.png" alt="Insignia La Salle del Sur">
            <div class="school-text">
                <h3>IEP LA SALLE DEL SUR</h3>
                <p>Formamos personas íntegras</p>
            </div>
        </div>
        <a href="index.html" class="home-btn">🏠 Regresar</a>
    </header>

    <!-- Contenedor del Escáner Directo -->
    <div class="main-container">
        <div class="qr-card">
            <h1 class="qr-title">ESCANEAR CÓDIGO QR</h1>
            <div id="reader"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Lima - Perú | IEP La Salle del Sur — Todos los derechos reservados
    </footer>

    <script>
        let html5QrcodeScanner = null;
        let timeoutTimer = null;

        function volverAInicio() {
            if (timeoutTimer) clearTimeout(timeoutTimer);
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch(e){}
            }
            window.location.href = "index.html";
        }

        function onScanSuccess(decodedText) {
            if (timeoutTimer) clearTimeout(timeoutTimer);
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch(e){}
            }
            localStorage.setItem('codigoEscaneado', decodedText);
            window.location.href = `alumno.html?codigo=${encodeURIComponent(decodedText)}`;
        }

        function iniciarEscaner() {
            try {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    false
                );

                html5QrcodeScanner.render(onScanSuccess, function(err) {});

                // Regresa en 7 segundos si no escanea nada
                timeoutTimer = setTimeout(function() {
                    volverAInicio();
                }, 7000);

            } catch (e) {
                volverAInicio();
            }
        }

        // Se ejecuta automáticamente al ingresar a la pantalla
        window.addEventListener('load', function() {
            iniciarEscaner();
        });
    </script>
</body>
</html>
