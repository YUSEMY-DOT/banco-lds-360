<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCO LDS 360 - Portal Estudiante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="app.js"></script>
</head>
<body class="bg-blue-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

  <header class="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">BANCO LDS 360</h1>
      <p class="text-xs text-blue-200">IEP La Salle del Sur</p>
    </div>
    <a href="index.html" class="text-sm bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded-full transition">← Inicio</a>
  </header>

  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">
    
    <!-- LOGIN ESTUDIANTE -->
    <div id="vistaLogin" class="bg-white p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-center text-lg font-bold text-gray-700">Acceso del Estudiante</h2>
      
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Código de Estudiante</label>
        <input type="text" id="loginCodigo" placeholder="Ej: LDS-EST-001" class="w-full border rounded-xl p-3 uppercase focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Clave (6 dígitos)</label>
        <input type="password" id="loginClave" maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full border rounded-xl p-3 text-center text-xl tracking-widest focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <button onclick="procesarLoginAlumno()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
        Ingresar
      </button>

      <div id="loginError" class="text-red-600 text-sm text-center min-h-[20px]"></div>
    </div>

    <!-- VISTA PRINCIPAL -->
    <div id="vistaPrincipal" class="hidden space-y-4">
      
      <!-- CARD DE SALDO Y FOTO -->
      <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-xs text-blue-200 uppercase font-semibold">Saldo Disponible</p>
            <h3 class="text-3xl font-extrabold mt-1"><span id="saldoLDS">0.00</span> <span class="text-sm font-normal">LDS</span></h3>
          </div>
          <img id="alumnoFoto" src="https://via.placeholder.com/100" alt="Foto del Estudiante" class="w-16 h-16 rounded-full border-2 border-white object-cover shadow" />
        </div>
        <p id="alumnoNombre" class="mt-4 font-medium text-sm text-blue-100">Cargando...</p>
        <p id="alumnoGrado" class="text-xs text-blue-200 mt-1">---</p>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="accionBotonPagar()" class="text-white p-4 rounded-xl font-bold shadow text-center transition text-sm flex items-center justify-center gap-2 hover:scale-[1.02]" style="background-color: #e11d48 !important;">
          💸 PAGAR / GASTOS
        </button>
        <button onclick="accionBotonMovimientos()" class="text-white p-4 rounded-xl font-bold shadow text-center transition text-sm flex items-center justify-center gap-2 hover:scale-[1.02]" style="background-color: #9333ea !important;">
          📋 MOVIMIENTOS
        </button>
      </div>

      <!-- FORMULARIO DE REGISTRO DE GASTO -->
      <div id="seccionOperacion" class="hidden bg-white p-5 rounded-2xl shadow space-y-3">
        <h4 id="tituloOperacion" class="font-bold text-gray-700 text-sm">Registrar Pago o Gasto</h4>
        
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Categoría</label>
          <select id="selectCategoria" onchange="alCambiarCategoria()" class="w-full border rounded-lg p-2 text-sm outline-none">
            <option value="">Seleccione categoría</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Concepto</label>
          <select id="selectConcepto" class="w-full border rounded-lg p-2 text-sm outline-none">
            <option value="">Seleccione concepto</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Monto LDS</label>
          <input type="number" id="inputMonto" min="0" step="0.01" placeholder="0.00" class="w-full border rounded-lg p-2 text-sm outline-none" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Responsable del Registro</label>
          <select id="selectResponsable" class="w-full border rounded-lg p-2 text-sm outline-none">
            <option value="">Seleccione responsable</option>
            <option value="MISS LILY MELO AZAÑERO">MISS LILY MELO AZAÑERO</option>
            <option value="MISS KIARA MORALES ELGUERA">MISS KIARA MORALES ELGUERA</option>
            <option value="MISS ANGHY REYES MELO">MISS ANGHY REYES MELO</option>
            <option value="MISS KARIN MOLERO ROMANI">MISS KARIN MOLERO ROMANI</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Observación</label>
          <textarea id="inputObservacion" rows="2" placeholder="Detalle opcional..." class="w-full border rounded-lg p-2 text-sm outline-none"></textarea>
        </div>

        <button onclick="registrarMovimientoOperacion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-sm transition">
          Confirmar y Registrar Pago
        </button>
        <div id="mensajeOperacion" class="text-xs text-center min-h-[18px]"></div>
      </div>

      <!-- HISTORIAL -->
      <div id="seccionMovimientos" class="bg-white p-4 rounded-2xl shadow space-y-3">
        <h4 class="font-bold text-gray-700 text-sm">Historial de Movimientos</h4>
        <div id="listaMovimientos" class="space-y-2 max-h-48 overflow-y-auto text-sm">
          <p class="text-gray-400 text-center italic py-2">Sin movimientos recientes.</p>
        </div>
      </div>

      <button onclick="cerrarSesionAlumno()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 rounded-xl transition text-sm">
        Cerrar Sesión
      </button>
    </div>

  </main>

  <footer class="text-center py-3 text-xs text-gray-400">
    KIDSWork LS - La Salle del Sur
  </footer>

  <script>
    let catalogoGlobal = {
      "AHORROS_E_INVERSIONES": [
        "Depósito a cuenta de ahorros (Ahorro voluntario)", 
        "Inversión en fondo común del aula", 
        "Retiro de ahorros (Emergencia o meta cumplida)"
      ],
      "PAGOS_Y_GASTOS": [
        "Pago Compra en la tienda escolar / cafetín", 
        "Pago de alquiler / mantenimiento de carpeta", 
        "Pago de servicios del aula: Agua", 
        "Pago de servicios del aula: Energía", 
        "Compra de material escolar de emergencia", 
        "Gasto médico imprevisto menor", 
        "Alquiler de libros de la biblioteca", 
        "Pago por custodia de equipos tecnológicos", 
        "Pago por copias extras", 
        "Comprar stickers", 
        "Pagar para una actividad extra", 
        "Pagar por jugar 10 minutos más"
      ],
      "SANCIONES_Y_MULTAS": [
        "Multa por llevar mal el uniforme o incompleto", 
        "Incumplimiento de tareas o asignaciones a tiempo", 
        "Llegada tarde al aula o formación", 
        "Uso no autorizado de dispositivos electrónicos", 
        "Desorden o indisciplina leve", 
        "Falta de respeto o modales", 
        "No traer el material escolar requerido", 
        "Descuido o daño leve al mobiliario", 
        "Basura fuera de su lugar / No respetar áreas verdes", 
        "Inasistencia injustificada a reuniones", 
        "No ponerse al día en sus pendientes", 
        "Malograr los cuadernos u objetos personales", 
        "Faltar a la verdad", 
        "Llevarse objetos del compañero"
      ],
      "COSTOS_Y_OTROS": [
        "Impuesto escolar mensual por uso de instalaciones", 
        "Cuota extraordinaria de mantenimiento grupal", 
        "Transacción personalizada / Ajuste de caja"
      ]
    };

    let historialMovimientosActual = [];

    function reproducirSonidoExito() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notas = [523.25, 659.25, 783.99, 1046.50];
        notas.forEach((frec, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = frec;
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.25);
        });
      } catch(e) {}
    }

    function hablarTextoVoz(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const textoLimpio = texto.replace(/\./g, ',').replace(/\?/g, '').replace(/!/g, '');
        const utterance = new SpeechSynthesisUtterance(textoLimpio);
        utterance.rate = 1.05;
        utterance.pitch = 1.25;

        const voces = window.speechSynthesis.getVoices();
        let vozIdeal = voces.find(v => v.lang.startsWith('es'));
        if (vozIdeal) utterance.voice = vozIdeal;

        setTimeout(() => { window.speechSynthesis.speak(utterance); }, 100);
      }
    }

    function procesarLoginAlumno() {
      const codigo = document.getElementById('loginCodigo').value.trim().toUpperCase();
      const clave = document.getElementById('loginClave').value.trim();
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = "";

      if (!codigo || !clave) {
        errorDiv.textContent = "Por favor complete todos los campos.";
        hablarTextoVoz("Por favor complete todos los campos.");
        return;
      }

      errorDiv.textContent = "Verificando acceso...";
      ejecutarLoginSistema(codigo, clave, function(res) {
        if (res && (res.success === true || res.ok === true) && res.estudiante) {
          document.getElementById('vistaLogin').classList.add('hidden');
          document.getElementById('vistaPrincipal').classList.remove('hidden');

          const est = res.estudiante;
          const cuenta = res.cuenta || res;
          const nombreCompleto = est.nombreCompleto || est.nombre || 'Estudiante';
          const primerNombre = nombreCompleto.split(' ')[0];

          historialMovimientosActual = res.movimientos || [];

          document.getElementById('alumnoNombre').textContent = nombreCompleto;
          document.getElementById('alumnoGrado').textContent = (est.grado || '') + ' ' + (est.seccion || '');
          document.getElementById('saldoLDS').textContent = Number(cuenta.saldoActual || cuenta.saldo || 0).toFixed(2);
          
          let fotoUrl = est.fotoUrl || est.foto || "";
          if (fotoUrl) document.getElementById('alumnoFoto').src = fotoUrl;

          renderizarMovimientos(historialMovimientosActual);
          reproducirSonidoExito();

          setTimeout(() => {
            hablarTextoVoz(`Hola ${primerNombre}, bienvenida a la banca móvil de La Salle del Sur.`);
          }, 300);

        } else {
          const mensajeError = res.mensaje || res.message || "Código o clave incorrecta.";
          errorDiv.textContent = mensajeError;
          hablarTextoVoz("Acceso denegado. Código o clave incorrecta.");
        }
      });
    }

    function accionBotonPagar() {
      document.getElementById('seccionOperacion').classList.remove('hidden');
      document.getElementById('seccionMovimientos').classList.add('hidden');
      document.getElementById('tituloOperacion').textContent = "💸 Registrar Pago, Gasto o Multa";
      
      const selectCat = document.getElementById('selectCategoria');
      selectCat.innerHTML = '<option value="">Seleccione categoría</option>';

      ["AHORROS_E_INVERSIONES", "PAGOS_Y_GASTOS", "SANCIONES_Y_MULTAS", "COSTOS_Y_OTROS"].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.replace(/_/g, " ");
        selectCat.appendChild(opt);
      });

      document.getElementById('selectConcepto').innerHTML = '<option value="">Seleccione concepto</option>';
      document.getElementById('inputMonto').value = '';
      document.getElementById('selectResponsable').value = '';
      document.getElementById('inputObservacion').value = '';
      document.getElementById('mensajeOperacion').textContent = '';

      hablarTextoVoz("Selecciona la categoría y el concepto de tu pago.");
    }

    function alCambiarCategoria() {
      const cat = document.getElementById('selectCategoria').value;
      const selectCon = document.getElementById('selectConcepto');
      selectCon.innerHTML = '<option value="">Seleccione concepto</option>';

      if (!cat || !catalogoGlobal[cat]) return;

      catalogoGlobal[cat].forEach(con => {
        const opt = document.createElement('option');
        opt.value = con;
        opt.textContent = con;
        selectCon.appendChild(opt);
      });
    }

    function accionBotonMovimientos() {
      document.getElementById('seccionOperacion').classList.add('hidden');
      document.getElementById('seccionMovimientos').classList.remove('hidden');
      hablarTextoVoz("Aquí están tus movimientos recientes.");
    }

    function registrarMovimientoOperacion() {
      const codigo = document.getElementById('loginCodigo').value.trim().toUpperCase();
      const cat = document.getElementById('selectCategoria').value;
      const con = document.getElementById('selectConcepto').value;
      const monto = document.getElementById('inputMonto').value.trim();
      const resp = document.getElementById('selectResponsable').value;
      const obs = document.getElementById('inputObservacion').value.trim();
      const msg = document.getElementById('mensajeOperacion');

      if (!cat || !con || !monto || !resp) {
        msg.className = "text-xs text-red-600 font-bold";
        msg.textContent = "Complete categoría, concepto, monto y responsable.";
        hablarTextoVoz("Por favor completa todos los campos.");
        return;
      }

      msg.className = "text-xs text-blue-600 font-bold";
      msg.textContent = "Registrando pago...";

      registrarTransaccionSistema(codigo, 'EGRESO', monto, con, resp, obs, function(res) {
        if (res && (res.success || res.ok)) {
          msg.className = "text-xs text-emerald-600 font-extrabold";
          msg.textContent = "¡Pago registrado con éxito!";

          reproducirSonidoExito();
          hablarTextoVoz("Pago registrado con éxito.");
          
          if(res.nuevoSaldo !== undefined) {
            document.getElementById('saldoLDS').textContent = Number(res.nuevoSaldo).toFixed(2);
          }
          if(res.movimientos) {
            historialMovimientosActual = res.movimientos;
            renderizarMovimientos(historialMovimientosActual);
          }

          setTimeout(() => {
            document.getElementById('seccionOperacion').classList.add('hidden');
            document.getElementById('seccionMovimientos').classList.remove('hidden');
            msg.textContent = '';
          }, 2500);

        } else {
          msg.className = "text-xs text-red-600 font-bold";
          msg.textContent = res.mensaje || res.message || "Error al registrar la transacción.";
        }
      });
    }

    function renderizarMovimientos(movs) {
      const contenedor = document.getElementById('listaMovimientos');
      contenedor.innerHTML = '';

      if (!movs || movs.length === 0) {
        contenedor.innerHTML = '<p class="text-gray-400 text-center italic py-2">Sin movimientos recientes.</p>';
        return;
      }

      movs.forEach(m => {
        const tipo = String(m.tipo || "").toUpperCase();
        const monto = Number(m.monto || 0);
        const positivo = tipo.includes('INGRESO') || monto >= 0;

        const item = document.createElement('div');
        item.className = "flex justify-between items-center p-2 rounded-lg bg-gray-50 border-l-4 " + 
          (positivo ? 'border-emerald-500' : 'border-rose-500');
        item.innerHTML = `
          <div>
            <p class="font-bold text-xs text-gray-800">${m.concepto || 'Movimiento'}</p>
            <p class="text-[10px] text-gray-400">${m.fecha || m.fechaTexto || ''}</p>
          </div>
          <span class="font-extrabold ${positivo ? 'text-emerald-600' : 'text-rose-600'}">
            ${positivo ? '+' : '-'}${Math.abs(monto).toFixed(2)} LDS
          </span>
        `;
        contenedor.appendChild(item);
      });
    }

    function cerrarSesionAlumno() {
      document.getElementById('vistaPrincipal').classList.add('hidden');
      document.getElementById('vistaLogin').classList.remove('hidden');
      document.getElementById('loginCodigo').value = '';
      document.getElementById('loginClave').value = '';
      document.getElementById('loginError').textContent = '';
    }

    document.getElementById("loginClave").addEventListener("keydown", function(e) {
      if (e.key === "Enter") procesarLoginAlumno();
    });
  </script>
</body>
</html>
