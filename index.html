<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - IEP La Salle del Sur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #e8f5e9 50%, #fffde7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #004d40;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 150, 136, 0.18);
            border: 3px solid #b2dfdb;
        }

        h1 {
            font-size: 2.4rem;
            color: #00796b;
            margin-bottom: 5px;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 1.05rem;
            color: #00897b;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .audio-bar {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #00acc1;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0, 172, 193, 0.35);
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #00838f;
            transform: translateY(-2px);
        }

        /* Cuadrícula de los 5 Botones Fijos */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 15px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .nav-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 1.7rem;
            margin-right: 14px;
            background: rgba(255, 255, 255, 0.75);
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3 Botones Principales Existentes */
        .btn-qr { background: #e0f2fe; color: #0369a1; }
        .btn-codigo { background: #f3e8ff; color: #6b21a8; }
        .btn-tienda { background: #fee2e2; color: #991b1b; }

        /* 2 Botones Nuevos Solicitados (Amarillo fuerte y Verde limón, sin negro) */
        .btn-padres { 
            background: #FFD54F; 
            color: #5d4037; 
        }
        .btn-manual { 
            background: #66BB6A; 
            color: #1b5e20; 
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #00796b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Audio del Himno / Música Institucional -->
    <audio id="bgMusic" loop>
        <source src="himno.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>BANCO LDS 360</h1>
        <p class="subtitle">Sistema Financiero Educativo — IEP La Salle del Sur</p>

        <div class="audio-bar">
            <button class="control-btn" onclick="toggleMusic()">🎵 Reproducer / Pausar Himno</button>
            <button class="control-btn" onclick="iniciarBienvenidaYAudio()">🗣️ Escuchar Bienvenida</button>
        </div>

        <!-- 5 Botones Operativos -->
        <div class="buttons-grid">
            <a href="qr.html" class="nav-btn btn-qr">
                <span class="icon">📷</span>
                <span>Escanear Código QR</span>
            </a>

            <a href="codigo.html" class="nav-btn btn-codigo">
                <span class="icon">#️⃣</span>
                <span>Ingresar Código</span>
            </a>

            <a href="tienda.html" class="nav-btn btn-tienda">
                <span class="icon">🛒</span>
                <span>Tienda Escolar</span>
            </a>

            <!-- Nuevo Botón 4: Padres (Amarillo intenso) -->
            <a href="padres.html" class="nav-btn btn-padres">
                <span class="icon">👨‍👩‍👧</span>
                <span>Escuela de Padres</span>
            </a>

            <!-- Nuevo Botón 5: Manual (Verde limón) -->
            <a href="manual.html" class="nav-btn btn-manual">
                <span class="icon">📖</span>
                <span>Manual del Sistema</span>
            </a>
        </div>

        <footer>Lima - Perú | Formamos personas íntegras</footer>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
            } else {
                music.play().catch(e => console.log("Audio pausado por navegador"));
                isPlaying = true;
            }
        }

        // Voz de bienvenida y posterior reproducción automática del himno
        function iniciarBienvenidaYAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance("¡Bienvenidos al Banco Lasallista 360! Iniciamos nuestro recorrido con alegría.");
                utterance.lang = 'es-ES';
                utterance.rate = 0.95;
                utterance.pitch = 1.1;

                utterance.onend = function() {
                    music.play().then(() => {
                        isPlaying = true;
                    }).catch(e => console.log("Reproducción de himno lista"));
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(iniciarBienvenidaYAudio, 1000);
        });
    </script>
</body>
</html>
