<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEP La Salle del Sur - Banco LDS 360</title>
  <style>
    /* Centrar todo y poner fondo negro a los bordes si sobra espacio */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Contenedor principal con TU IMAGEN de fondo */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9; /* Mantiene la proporción de tu imagen */
      background-image: url('467631ef-34e0-4918-9cf5-7dae2b730116.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Clase para crear zonas donde los niños pueden hacer clic */
    .zona-clic {
      position: absolute;
      cursor: pointer;
      /* border: 2px solid red;  <-- Quita las barras inclinadas y asteriscos de esta línea si quieres ver unos cuadros rojos para ajustar la posición de los botones */
    }

    /* Coordenadas aproximadas de tus botones reales */
    .btn-qr { top: 69%; left: 12%; width: 22%; height: 10%; }
    .btn-codigo { top: 69%; left: 54%; width: 22%; height: 10%; }
    .btn-tienda { top: 83%; left: 12%; width: 18%; height: 10%; }
    .btn-padres { top: 83%; left: 31%; width: 18%; height: 10%; }
    .btn-manual { top: 83%; left: 52%; width: 18%; height: 10%; }
    .btn-admin { top: 2%; left: 81%; width: 16%; height: 6%; }
  </style>
</head>
<body>

  <!-- TU VERDADERA PORTADA -->
  <div class="app-container">
    <!-- Botones transparentes superpuestos sobre tu imagen -->
    <div class="zona-clic btn-qr" onclick="alert('Aquí se abrirá la cámara QR')"></div>
    <div class="zona-clic btn-codigo" onclick="alert('Aquí se abrirá el teclado de código')"></div>
    <div class="zona-clic btn-tienda" onclick="alert('Aquí se abrirá la Tienda escolar')"></div>
    <div class="zona-clic btn-padres" onclick="alert('Aquí se abrirá el área de Padres')"></div>
    <div class="zona-clic btn-manual" onclick="alert('Aquí se abrirá el Manual')"></div>
    <div class="zona-clic btn-admin" onclick="alert('Acceso de Administrador')"></div>
  </div>

  <!-- Aquí abajo puedes pegar el código <script> de la música y voz que te pasé antes -->

</body>
</html>
