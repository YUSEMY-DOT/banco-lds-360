<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco LDS 360 · IEP La Salle del Sur</title>
  <style>
    :root {
      --azul-primario: #142744;
      --azul-oscuro: #0c1d36;
      --dorado: #c99a32;
      --dorado-claro: #e0b84c;
      --rojo-lasalle: #a7192e;
      --blanco: #ffffff;
      --gris-fondo: #f4f5f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1d3557 0%, var(--azul-oscuro) 100%);
      color: var(--blanco);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ENCABEZADO */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 35px;
      border-bottom: 3px solid var(--dorado);
      background: rgba(12, 29, 54, 0.95);
      backdrop-filter: blur(8px);
    }

    .school-brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .school-info h1 {
      font-family: Georgia, serif;
      font-size: 20px;
      color: var(--blanco);
      letter-spacing: 0.5px;
    }

    .school-info span {
      font-size: 13px;
      color: var(--dorado-claro);
      font-style: italic;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--blanco);
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .admin-btn:hover {
      background: var(--dorado);
      color: var(--azul-oscuro);
      border-color: var(--dorado);
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* BANNER O ELEMENTO VISUAL (REEMPLAZO DEL BANCO/NIÑOS) */
    .visual-banner {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(201, 154, 50, 0.3);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .visual-banner h2 {
      font-family: Georgia, serif;
      font-size: 38px;
      color: var(--blanco);
      margin-bottom: 5px;
    }

    .visual-banner h2 span {
      color: var(--rojo-lasalle);
    }

    .visual-banner p {
      color: var(--dorado-claro);
      font-size: 16px;
      font-weight: 500;
    }

    /* BOTONES MÁS COMPACTOS Y ELEGANTES */
    .compact-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 650px;
    }

    .action-btn {
      background: #ffffff;
      color: var(--azul-primario);
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-3px);
      background: var(--dorado-claro);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .action-btn.primary {
      background: var(--rojo-lasalle);
      color: var(--blanco);
    }

    .action-btn.primary:hover {
      background: #b8233a;
    }

    .btn-icon {
      font-size: 20px;
    }

    /* PIE DE PÁGINA */
    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #8a9ba8;
      background: rgba(8, 16, 28, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 650px) {
      .compact-buttons {
        grid-template-columns: 1fr;
      }
      .visual-banner h2 {
        font-size: 28px;
      }
      header {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="school-brand">
      <div class="school-info">
        <h1>IEP LA SALLE DEL SUR</h1>
        <span>Formamos personas íntegras</span>
      </div>
    </div>
    <button class="admin-btn" onclick="abrirAdmin()">🔒 Administrador</button>
  </header>

  <main>
    <!-- Contenedor Visual (Inspirado en la temática del Banco y los estudiantes) -->
    <div class="visual-banner">
      <h2>BANCO LDS <span>360</span></h2>
      <p>Sistema Financiero Educativo y de Economía de Aula</p>
    </div>

    <!-- Botones compactos y elegantes -->
    <div class="compact-buttons">
      <button class="action-btn primary" onclick="abrirScanner()">
        <span class="btn-icon">📷</span> Escanear Código QR
      </button>

      <button class="action-btn" onclick="abrirCodigo()">
        <span class="btn-icon">🔑</span> Ingresar Código
      </button>

      <button class="action-btn" onclick="abrirDocentes()">
        <span class="btn-icon">👩‍🏫</span> Portal Docente
      </button>

      <button class="action-btn" onclick="abrirAyuda()">
        <span class="btn-icon">💡</span> Normativa LDS
      </button>
    </div>
  </main>

  <footer>
    &copy; 2026 IEP La Salle del Sur · Todos los derechos reservados.
  </footer>

  <script>
    function abrirAdmin() {
      window.location.href = 'administrador.html';
    }
    function abrirScanner() {
      alert("Iniciando escáner QR...");
    }
    function abrirCodigo() {
      alert("Abriendo ventana de código...");
    }
    function abrirDocentes() {
      alert("Portal docente enlazado.");
    }
    function abrirAyuda() {
      alert("Información del sistema.");
    }
  </script>

</body>
</html>
