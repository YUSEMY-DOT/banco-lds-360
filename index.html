<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BANCO LDS 360 - IEP La Salle del Sur</title>
    
    <!-- Enlace al manifest para la PWA (Instalación en móviles) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b365d">

    <style>
        /* Estilos generales limpios para respetar tu portada original */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #061a32;
        }

        .contenedor-portada {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-portada img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Banner de instalación colorido, amigable y de una sola vez */
        #banner-instalacion {
            position: fixed;
            bottom: -120px;
            left: 15px;
            right: 15px;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1b365d, #2563eb);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            border: 2px solid #fbbf24;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            font-size: 14px;
        }

        #banner-instalacion.mostrar {
            bottom: 20px;
        }

        .info-app-banner {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-app-banner img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: white;
            padding: 2px;
        }

        #btn-instalar {
            background: #fbbf24;
            border: none;
            color: #1e293b;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            white-space: nowrap;
        }

        #btn-instalar:active {
            transform: scale(0.95);
        }

        #btn-cerrar-banner {
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        /* Contenedor de notificaciones flotantes en pantalla con sonido */
        #contenedor-notificaciones {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
            width: 100%;
        }

        .alerta-movimiento {
            background: #ffffff;
            border-left: 6px solid #10b981;
            padding: 14px 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 13px;
            color: #1e293b;
            animation: entrarAlerta 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes entrarAlerta {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Aquí va tu portada e imagen institucional original -->
    <div class="contenedor-portada">
        <img src="assets/portada.webp" alt="Banco LDS 360 Portada">
        <!-- Puedes mantener tus etiquetas <map> y áreas interactivas originales aquí abajo -->
    </div>

    <!-- Banner colorido de instalación (Aparece una sola vez) -->
    <div id="banner-instalacion">
        <div class="info-app-banner">
            <img src="assets/icon-192.png" alt="Icono">
            <div>
                <strong>¡Banco LDS 360!</strong><br>
                <span style="font-size:12px; color:#e2e8f0;">Instala la app en tu pantalla de inicio</span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button id="btn-instalar">Instalar</button>
            <button id="btn-cerrar-banner">✕</button>
        </div>
    </div>

    <!-- Contenedor para notificaciones con sonido -->
    <div id="contenedor-notificaciones"></div>

    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        // Lógica de PWA con validación estricta de una sola vez (localStorage)
        let deferredPrompt;
        const bannerInstalacion = document.getElementById('banner-instalacion');
        const btnInstalar = document.getElementById('btn-instalar');
        const btnCerrarBanner = document.getElementById('btn-cerrar-banner');

        const appYaInstaladaOOculta = localStorage.getItem('lds_app_instalada_o_cerrada');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Se muestra únicamente si el padre NUNCA antes le ha dado a instalar o cerrar
            if (!appYaInstaladaOOculta) {
                setTimeout(() => {
                    bannerInstalacion.classList.add('mostrar');
                }, 1500);
            }
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Usuario aceptó instalar la app');
                }
                deferredPrompt = null;
            }
            // Marcamos como guardado para que NUNCA más vuelva a salir
            localStorage.setItem('lds_app_instalada_o_cerrada', 'true');
            bannerInstalacion.classList.remove('mostrar');
        });

        btnCerrarBanner.addEventListener('click', () => {
            // Guardamos también para respetar la decisión de cerrar el aviso
            localStorage.setItem('lds_app_instalada_o_cerrada', 'true');
            bannerInstalacion.classList.remove('mostrar');
        });

        // Sistema de Sonido agradable integrado (Web Audio API)
        function reproducirSonidoAlerta() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // Nota A5
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log('Audio no soportado o bloqueado temporalmente', e);
            }
        }

        // Función global para mostrar alertas flotantes con sonido al hacer movimientos
        window.mostrarNotificacionMovimiento = function(mensaje) {
            reproducirSonidoAlerta(); // Suena automáticamente al recibir el aviso

            const contenedor = document.getElementById('contenedor-notificaciones');
            const alerta = document.createElement('div');
            alerta.className = 'alerta-movimiento';
            alerta.innerHTML = `<strong style="color:#059669;">🔔 Nuevo Movimiento</strong><br>${mensaje}`;
            
            contenedor.appendChild(alerta);

            // Desvanece y elimina sola tras 5.5 segundos
            setTimeout(() => {
                alerta.style.transition = 'opacity 0.5s ease';
                alerta.style.opacity = '0';
                setTimeout(() => alerta.remove(), 500);
            }, 5500);
        };
    </script>
</body>
</html>
