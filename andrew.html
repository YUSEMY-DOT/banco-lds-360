   PORTADA ANDREW — FONDO REAL + FOTO TRANSPARENTE
   ========================================================== */
#loginAndrew{
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100vh!important;
  min-height:100vh!important;
  margin:0!important;
  padding:clamp(92px,11vh,125px) clamp(24px,5vw,80px) clamp(20px,3vh,32px)!important;
  display:flex!important;
  flex-direction:row!important;
  align-items:center!important;
  justify-content:center!important;
  gap:clamp(24px,5vw,78px)!important;
  overflow:hidden!important;
  z-index:99999!important;
  background-color:#061b3f!important;
  background-image:none!important;
  background-position:center center!important;
  background-repeat:no-repeat!important;
  background-size:100% 100%!important;
}

#loginAndrew{background-color:#061b3f!important;}
#loginAndrew::before{
  content:"";
  position:absolute;
  inset:0;
  background:transparent!important;
  pointer-events:none!important;
  z-index:0!important;
}

#loginAndrew .login-bg-image{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center center!important;
  display:block!important;
  z-index:0!important;
  pointer-events:none!important;
  user-select:none!important;
}

#loginAndrew .andrew-login-photo{
  position:relative!important;
  z-index:2!important;
  width:min(39vw,540px)!important;
  height:min(76vh,700px)!important;
  flex:0 1 540px!important;
  display:flex!important;
  align-items:flex-end!important;
  justify-content:center!important;
  margin:clamp(25px,5vh,55px) 0 0!important;
  pointer-events:none!important;
}

#loginAndrew .andrew-login-photo img{
  display:block!important;
  color:transparent!important;
  font-size:0!important;
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  object-position:center bottom!important;
  background:transparent!important;
  mix-blend-mode:normal!important;
  border:0!important;
  outline:0!important;
  box-shadow:none!important;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.42));
}

#loginAndrew > .panel{
  position:relative!important;
  z-index:5!important;
  width:min(430px,39vw)!important;
  max-width:430px!important;
  flex:0 1 430px!important;
  margin:clamp(10px,4vh,40px) 0 0!important;
  border:2px solid #f5b400!important;
  border-radius:22px!important;
  overflow:hidden!important;
  background:#fff!important;
  box-shadow:0 22px 55px rgba(0,0,0,.48)!important;
  pointer-events:auto!important;
}

#loginAndrew .panel-head{
  padding:20px 24px!important;
  background:linear-gradient(135deg,#061b3f,#12366f)!important;
  border-bottom:2px solid #f5b400!important;
}
#loginAndrew .panel-head h3{
  margin:0!important;
  color:#fff!important;
  font-size:clamp(1rem,1.45vw,1.25rem)!important;
  line-height:1.35!important;
  font-weight:900!important;
}
#loginAndrew .panel-body{padding:24px!important}
#loginAndrew .panel-body>p{
  margin:0 0 18px!important;
  color:#334155!important;
  font-size:.92rem!important;
  line-height:1.5!important;
  font-weight:800!important;
}
#loginAndrew .small-label{
  display:block!important;
  margin:0 0 7px!important;
  color:#0b2f67!important;
  font-size:.76rem!important;
  font-weight:900!important;
}
#loginAndrew #claveAndrew{
  width:100%!important;
  height:56px!important;
  padding:0 15px!important;
  border:1.5px solid #b9c7d8!important;
  border-radius:12px!important;
  background:#f8fafc!important;
  color:#14213d!important;
  font-size:1rem!important;
  font-weight:700!important;
  outline:none!important;
  pointer-events:auto!important;
}
#loginAndrew #claveAndrew:focus{border-color:#e3a900!important;background:#fff!important}
#loginAndrew .login-action,
#loginAndrew .login-home{
  position:relative!important;
  z-index:20!important;
  pointer-events:auto!important;
  cursor:pointer!important;
  display:flex!important;
  width:100%!important;
  align-items:center!important;
  justify-content:center!important;
  font-weight:900!important;
}
#loginAndrew .login-action{
  min-height:54px!important;
  margin-top:15px!important;
  border:1px solid #fcd34d!important;
  border-radius:12px!important;
  background:linear-gradient(135deg,#ffd23f,#f2a900)!important;
  color:#08214a!important;
}
#loginAndrew .login-home{
  min-height:48px!important;
  margin-top:10px!important;
  background:#fff!important;
  color:#0b2f67!important;
  border:1.5px solid #0b2f67!important;
  border-radius:12px!important;
}
#loginAndrew .login-action:hover{filter:brightness(1.05);transform:translateY(-1px)}
#loginAndrew .login-home:hover{background:#f1f5f9!important}

/* Mientras se solicita la clave, NADA del panel interno puede interferir. */
body.login-screen > #appHeader,
body.login-screen > #andrewApp,
body.login-screen > #appFooter{display:none!important}
body.login-screen #loginAndrew{display:flex!important}
body:not(.login-screen) #loginAndrew{display:none!important;pointer-events:none!important}

/* El resto de la aplicación queda oculto mientras se solicita la clave */
body.login-screen > #appHeader,
body.login-screen > #andrewApp,
body.login-screen > #appFooter{display:none!important}
body:not(.login-screen) > #loginAndrew{display:none!important}
