<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142744">

  <title>Banco LDS 360 · Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --azul:#142744;
      --rojo:#a7192e;
      --texto:#18243b;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:#0d1a30;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(720px,100%);
      background:#fff;
      color:var(--texto);
      border-radius:28px;
      padding:28px;
      box-shadow:0 25px 80px rgba(0,0,0,.35);
    }

    .head{
      text-align:center;
    }

    .head h1{
      margin:0;
      color:var(--azul);
      font-size:32px;
      line-height:1.15;
    }

    .head p{
      color:#667085;
      font-size:17px;
      line-height:1.4;
      margin:12px auto 22px;
      max-width:580px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:20px;
      background:#081427;
      min-height:300px;
    }

    #reader video{
      width:100% !important;
      height:auto !important;
      display:block;
      border-radius:20px;
    }

    #reader__dashboard,
    #reader__dashboard_section,
    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink{
      display:none !important;
    }

    #status{
      text-align:center;
      color:#667085;
      font-size:15px;
      line-height:1.4;
      margin:16px 0 0;
      min-height:24px;
    }

    .error{
      color:var(--rojo) !important;
    }

    .success{
      color:#15803d !important;
      font-weight:700;
    }

    .mini{
      margin-top:18px;
      text-align:center;
      color:#7b8494;
      font-size:13px;
    }

    @media(max-width:600px){

      body{
        padding:12px;
      }

      .card{
        width:100%;
        border-radius:22px;
        padding:20px;
      }

      .head h1{
        font-size:26px;
      }

      .head p{
        font-size:15px;
      }

      #reader{
        min-height:280px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="head">
      <h1>Escanear código QR</h1>

      <p>
        Apunta la cámara al código QR del estudiante.
        Al leerlo, volverás automáticamente a Banco LDS 360 Online.
      </p>
    </div>

    <div id="reader"></div>

    <div id="status">
      Preparando cámara…
    </div>

    <div class="mini">
      Lector QR externo seguro · HTTPS
    </div>

  </div>

<script>

  let scanner = null;
  let procesando = false;


  /*
   * OBTIENE LA DIRECCIÓN DE REGRESO
   * QUE ENVÍA BANCO LDS 360.
   */
  function obtenerDireccionRegreso(){

    const parametros =
      new URLSearchParams(window.location.search);

    const retorno =
      parametros.get("return");

    if(!retorno){
      return "";
    }

    return retorno;

  }


  /*
   * LIMPIA EL CÓDIGO QR.
   */
  function limpiarCodigo(valor){

    const texto =
      String(valor || "").trim();

    if(!texto){
      return "";
    }

    const encontrado =
      texto.match(/LDS[-_ ]EST[-_ ]\d+/i);

    if(encontrado){

      return encontrado[0]
        .replace(/_/g,"-")
        .replace(/ /g,"-")
        .toUpperCase();

    }

    return texto.toUpperCase();

  }


  /*
   * CAMBIA EL MENSAJE.
   */
  function mensaje(texto, clase=""){

    const elemento =
      document.getElementById("status");

    elemento.textContent = texto;
    elemento.className = clase;

  }


  /*
   * DETIENE LA CÁMARA.
   */
  async function detenerCamara(){

    if(!scanner){
      return;
    }

    try{
      await scanner.stop();
    }catch(e){}

    try{
      await scanner.clear();
    }catch(e){}

    scanner = null;

  }


  /*
   * REGRESA A BANCO LDS 360
   * CON EL CÓDIGO DEL ESTUDIANTE.
   */
  async function regresarAlBanco(codigo){

    if(procesando){
      return;
    }

    procesando = true;


    const banco =
      obtenerDireccionRegreso();


    if(!banco){

      mensaje(
        "Código leído: " + codigo,
        "success"
      );

      await detenerCamara();

      return;

    }


    let destino = banco;


    const separador =
      destino.includes("?")
        ? "&"
        : "?";


    destino =
      destino +
      separador +
      "codigo=" +
      encodeURIComponent(codigo);


    mensaje(
      "Código leído. Regresando al sistema…",
      "success"
    );


    await detenerCamara();


    setTimeout(function(){

      window.location.href = destino;

    },700);

  }


  /*
   * INICIA LA CÁMARA.
   */
  function iniciarCamara(){

    if(typeof Html5Qrcode === "undefined"){

      mensaje(
        "No se pudo cargar el lector QR.",
        "error"
      );

      return;

    }


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1.0,

        disableFlip:false
      },

      function(decodedText){

        const codigo =
          limpiarCodigo(decodedText);


        if(codigo){

          regresarAlBanco(codigo);

        }

      },

      function(errorMessage){

        /*
         * Errores normales mientras
         * busca un código QR.
         */

      }

    )
    .then(function(){

      mensaje(
        "Cámara activa. Apunta al código QR."
      );

    })
    .catch(function(error){

      console.error(
        "ERROR DE CÁMARA:",
        error
      );

      mensaje(
        "No se pudo abrir la cámara. Verifica el permiso del navegador.",
        "error"
      );

    });

  }


  window.addEventListener(
    "load",
    function(){

      iniciarCamara();

    }
  );

</script>

</body>
</html>
