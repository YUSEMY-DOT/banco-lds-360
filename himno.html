<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEP La Salle del Sur - Himno Institucional</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-950 via-slate-900 to-indigo-950 text-white min-h-screen flex flex-col justify-between p-6 font-sans select-none">

  <!-- ENCABEZADO INSTITUCIONAL -->
  <header class="text-center py-6">
    <div class="inline-block bg-amber-400/20 border border-amber-400/40 text-amber-300 text-xs px-4 py-1.5 rounded-full font-bold uppercase tracking-widest mb-2 shadow">
      IEP La Salle del Sur
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-amber-300 uppercase tracking-wider drop-shadow-lg">
      Portal Escolar
    </h1>
    <p class="text-xs sm:text-sm text-sky-200 mt-1 font-medium">"Enseñanza, Disciplina y Lealtad"</p>
  </header>

  <!-- VISTA PRINCIPAL AL ESCANEAR -->
  <main class="max-w-md mx-auto w-full bg-slate-800/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-amber-400/30 space-y-6 my-auto text-center">
    
    <div class="w-28 h-28 mx-auto bg-gradient-to-tr from-amber-400 via-yellow-400 to-sky-500 rounded-full p-1 shadow-2xl flex items-center justify-center">
      <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-5xl shadow-inner animate-pulse">
        🔔
      </div>
    </div>

    <div class="space-y-2">
      <h2 class="text-2xl font-black text-amber-300">¡Bienvenidos!</h2>
      <p class="text-sm text-slate-200 font-medium">
        Escuchando la voz e himno institucional...
      </p>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-500">
    © IEP La Salle del Sur — "Enseñanza, Disciplina y Lealtad"
  </footer>

  <!-- SCRIPT DE MÚSICA Y LOCUCIÓN DE VOZ AUTOMÁTICA -->
  <script>
    let audioCtx = null;
    let iniciado = false;

    // FRECUENCIAS LIRA (DO MAYOR)
    const FREQS = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
      "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
    };

    const notasMelodia = [
      { n: "C4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.7 },
      { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.7 }, { n: "C4", d: 0.7 },
      { n: "D4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "A4", d: 0.7 }, { n: "A4", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 }, { n: "D4", d: 0.7 },
      { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "C5", d: 0.7 }, { n: "C5", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },
      { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.7 },
      { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "C4", d: 1.5 }
    ];

    // LIRA
    function sonarLira(ctx, freq, t, dur) {
      if (!freq) return;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 2, t);
      gain.gain.setValueAtTime(0.20, t); // Volumen suave para no tapar la voz
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 1.0);
      osc2.stop(t + 1.0);
    }

    // TAMBOR MARCIAL DE FONDO
    function sonarTambor(ctx, t) {
      const bufferSize = ctx.sampleRate * 0.04;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
    }

    // VOZ HABLADA (TEXT-TO-SPEECH)
    function hablarTexto() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Limpiar llamadas previas
        const texto = "¡Bienvenidos a la Institución Educativa Privada La Salle del Sur! Aprendiendo con metas y valores, cual nos diste tú mi gran maestro. Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad.";
        const mensaje = new SpeechSynthesisUtterance(texto);
        mensaje.lang = 'es-PE'; // Español Perú
        mensaje.rate = 0.9;     // Velocidad natural de marcha
        mensaje.pitch = 1.0;
        window.speechSynthesis.speak(mensaje);
      }
    }

    async function arrancarAudioYVoz() {
      if (iniciado) return;
      iniciado = true;

      // 1. Iniciar voz parlante
      hablarTexto();

      // 2. Iniciar melodía de liras de fondo
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        let t = audioCtx.currentTime + 0.1;
        notasMelodia.forEach(item => {
          const f = FREQS[item.n] || 261.63;
          sonarLira(audioCtx, f, t, item.d);
          sonarTambor(audioCtx, t);
          t += item.d;
        });
      } catch (e) {
        console.log(e);
      }
    }

    // Ejecución automática inmediata
    window.addEventListener('load', arrancarAudioYVoz);
    document.addEventListener('touchstart', arrancarAudioYVoz, { once: true });
    document.addEventListener('click', arrancarAudioYVoz, { once: true });
    document.addEventListener('pointerdown', arrancarAudioYVoz, { once: true });
  </script>
</body>
</html>
