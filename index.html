<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BANCO LDS 360</title>

  <!-- Lector QR gratuito -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #1f2937;
    }

    .encabezado {
      background: #123c69;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .encabezado h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .encabezado p {
      font-size: 14px;
    }

    .contenedor {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .titulo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #123c69;
    }

    #lectorQR {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 15px;
    }

    .botones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-principal {
      background: #123c69;
      color: white;
    }

    .btn-ingreso {
      background: #198754;
      color: white;
    }

    .btn-egreso {
      background: #dc3545;
      color: white;
    }

    .btn-saldo {
      background: #123c69;
      color: white;
    }



    .btn-secundario {
      background: #6c757d;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .mensaje {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .mensaje.ok {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .mensaje.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .estudiante {
      display: none;
    }

    .foto-estudiante-contenedor {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .foto-estudiante {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #123c69;
      background: #f8f9fa;
      display: none;
    }

    .datos-estudiante {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .dato {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
    }

    .dato strong {
      display: block;
      color: #123c69;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .saldo {
      background: #e7f1ff;
      border-radius: 10px;
      padding: 18px;
      margin-top: 15px;
      text-align: center;
    }

    .saldo span {
      display: block;
      font-size: 13px;
      color: #555;
    }

    .saldo strong {
      display: block;
      font-size: 30px;
      color: #123c69;
      margin-top: 5px;
    }

    .operacion {
      display: none;
    }

    .tipo-operacion {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tipo-operacion button {
      flex: 1;
    }

    .tipo-activo {
      outline: 3px solid rgba(18,60,105,0.25);
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      border: 1px solid #ced4da;
      border-radius: 7px;
      padding: 11px;
      font-size: 14px;
      background: white;
    }

    .campo textarea {
      min-height: 90px;
      resize: vertical;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 700px;
    }

    th,
    td {
      border-bottom: 1px solid #dee2e6;
      padding: 10px;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #123c69;
      color: white;
    }

    .ingreso {
      color: #198754;
      font-weight: bold;
    }

    .egreso {
      color: #dc3545;
      font-weight: bold;
    }

    .oculto {
      display: none !important;
    }

    .cargando {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    @media (max-width: 600px) {
      .encabezado h1 {
        font-size: 22px;
      }

      .tipo-operacion {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <header class="encabezado">
    <h1>BANCO LDS 360</h1>
    <p>IEP LA SALLE DEL SUR</p>
    <p>Nuevo Sol Lasallista (LDS)</p>
  </header>

  <main class="contenedor">

    <!-- LECTOR QR -->
    <section class="tarjeta">

      <div class="titulo">Identificación del estudiante</div>

      <div id="lectorQR"></div>

      <div class="botones">
        <button
          type="button"
          class="btn-principal"
          onclick="iniciarQR()">
          📷 Escanear QR
        </button>

        <button
          type="button"
          class="btn-secundario"
          onclick="ingresarCodigoManual()">
          ⌨️ Ingresar código manualmente
        </button>
      </div>

      <div id="mensaje" class="mensaje"></div>

    </section>


    <!-- DATOS DEL ESTUDIANTE -->
    <section id="seccionEstudiante" class="tarjeta estudiante">

      <div class="titulo">Datos del estudiante</div>

      <div class="foto-estudiante-contenedor">
        <img id="datoFoto" class="foto-estudiante" src="" alt="Foto del estudiante">
      </div>

      <div class="datos-estudiante">

        <div class="dato">
          <strong>Código</strong>
          <span id="datoCodigo">-</span>
        </div>

        <div class="dato">
          <strong>Estudiante</strong>
          <span id="datoNombre">-</span>
        </div>

        <div class="dato">
          <strong>Grado</strong>
          <span id="datoGrado">-</span>
        </div>

        <div class="dato">
          <strong>Sección</strong>
          <span id="datoSeccion">-</span>
        </div>

        <div class="dato">
          <strong>Docente</strong>
          <span id="datoDocente">-</span>
        </div>

        <div class="dato">
          <strong>Monto base</strong>
          <span id="datoBase">0.00 LDS</span>
        </div>

      </div>

      <div class="saldo">
        <span>Saldo actual</span>
        <strong id="datoSaldo">0.00 LDS</strong>
      </div>

    </section>


    <!-- OPERACIÓN -->
    <section id="seccionOperacion" class="tarjeta operacion">

      <div class="titulo">Operación</div>

      <div class="tipo-operacion">

        <button
          type="button"
          id="btnCobrar"
          class="btn-ingreso"
          onclick="seleccionarOperacion('INGRESO')">
          COBRAR
        </button>

        <button
          type="button"
          id="btnPagar"
          class="btn-egreso"
          onclick="seleccionarOperacion('EGRESO')">
          PAGAR
        </button>

        <button
          type="button"
          id="btnSaldo"
          class="btn-saldo"
          onclick="mostrarSaldo()">
          SALDO
        </button>

      </div>

      <div id="panelOperacion" class="oculto">

      <!-- OPCIONES DE LA OPERACIÓN -->
      <div id="opcionesOperacion">

        <div class="campo">
          <label for="categoria">Categoría</label>

          <select id="categoria" onchange="cargarConceptos()">
            <option value="">Seleccione una categoría</option>
          </select>
        </div>

        <div class="campo">
          <label for="concepto">Concepto</label>

          <select id="concepto">
            <option value="">Seleccione un concepto</option>
          </select>
        </div>

      </div>

      <div class="campo">
        <label for="monto">Monto LDS</label>

        <input
          type="number"
          id="monto"
          min="0"
          step="0.01"
          placeholder="Ingrese el monto">
      </div>

      <div class="campo">
        <label for="responsable">Responsable</label>

        <select id="responsable">
          <option value="">Seleccione responsable</option>
        </select>
      </div>

      <div class="campo">
        <label for="observacion">Observación</label>

        <textarea
          id="observacion"
          placeholder="Ingrese observación"></textarea>
      </div>

      <div class="botones">

        <button
          type="button"
          class="btn-principal"
          onclick="registrarMovimiento()">
          Registrar movimiento
        </button>

        <button
          type="button"
          class="btn-secundario"
          onclick="limpiarOperacion()">
          Limpiar
        </button>

      </div>

      <div id="mensajeOperacion" class="mensaje"></div>

      </div>

    </section>


    <!-- MOVIMIENTOS -->
    <section id="seccionMovimientos" class="tarjeta estudiante">

      <div class="titulo">Movimientos del estudiante</div>

      <div class="tabla-contenedor">

        <table>

          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Concepto</th>
              <th>Monto LDS</th>
              <th>Responsable</th>
              <th>Observación</th>
            </tr>
          </thead>

          <tbody id="tablaMovimientos">

          </tbody>

        </table>

      </div>

    </section>

  </main>


<script>

  /* =========================================================
     CONFIGURACIÓN
     ========================================================= */

  const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnYxKgOh3xPibLHQIsLoCM9JYDj48hnY9OQVT0499MzZbZ1G34XfpPfsT29ieVAhFK/exec";

  const SISTEMA = "BANCO LDS 360";

  const MONEDA = "LDS";


  /* =========================================================
     VARIABLES
     ========================================================= */

  let estudianteActual = null;

  let tipoOperacion = "";

  let lector = null;

  let categorias = {};

  let conceptosCatalogo = {};


  /* =========================================================
     UTILIDADES
     ========================================================= */

  function mostrarMensaje(id, texto, tipo) {

    const elemento = document.getElementById(id);

    elemento.textContent = texto;

    elemento.className = "mensaje " + tipo;

  }


  function ocultarMensaje(id) {

    const elemento = document.getElementById(id);

    elemento.className = "mensaje";

    elemento.textContent = "";

  }


  function generarRequestId() {

    return "LDS-" +
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 10);

  }


  function numero(valor) {

    const n = Number(valor);

    return Number.isFinite(n) ? n : 0;

  }


  /* =========================================================
     JSONP
     ========================================================= */

  function llamarAPI(parametros, callback) {

    if (
      !APP_SCRIPT_URL ||
      APP_SCRIPT_URL === "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT"
    ) {

      mostrarMensaje(
        "mensaje",
        "Falta colocar la URL de Apps Script.",
        "error"
      );

      return;
    }


    const nombreCallback =
      "callbackLDS_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    parametros.callback = nombreCallback;


    const query = Object.keys(parametros)
      .map(function(clave) {

        return encodeURIComponent(clave) +
          "=" +
          encodeURIComponent(parametros[clave]);

      })
      .join("&");


    const script = document.createElement("script");

    script.src = APP_SCRIPT_URL + "?" + query;


    window[nombreCallback] = function(respuesta) {

      try {

        callback(respuesta);

      } finally {

        delete window[nombreCallback];

        script.remove();

      }

    };


    script.onerror = function() {

      delete window[nombreCallback];

      script.remove();

      mostrarMensaje(
        "mensaje",
        "No se pudo conectar con BANCO LDS 360.",
        "error"
      );

    };


    document.body.appendChild(script);

  }


  /* =========================================================
     QR
     ========================================================= */

  function iniciarQR() {

    ocultarMensaje("mensaje");


    if (lector) {

      try {

        lector.stop();

      } catch (e) {}

      lector = null;

    }


    lector = new Html5Qrcode("lectorQR");


    const configuracion = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    };


    lector.start(

      {
        facingMode: "environment"
      },

      configuracion,

      function(codigoQR) {

        detenerQR();

        buscarEstudiante(codigoQR);

      },

      function(error) {

        // Errores normales de lectura:
        // no se muestran para no interrumpir el escaneo.

      }

    ).catch(function(error) {

      mostrarMensaje(
        "mensaje",
        "No fue posible iniciar la cámara. Use el botón de ingreso manual.",
        "error"
      );

    });

  }


  function detenerQR() {

    if (!lector) {
      return;
    }


    lector.stop()
      .then(function() {

        lector.clear();

        lector = null;

      })
      .catch(function() {

        lector = null;

      });

  }


  /* =========================================================
     INGRESO MANUAL
     ========================================================= */

  function ingresarCodigoManual() {

    const codigo = prompt(
      "Ingrese el código del estudiante:"
    );


    if (!codigo) {
      return;
    }


    buscarEstudiante(codigo.trim());

  }


  /* =========================================================
     CONSULTAR ESTUDIANTE
     ========================================================= */

  function buscarEstudiante(codigo) {

    if (!codigo) {

      mostrarMensaje(
        "mensaje",
        "Ingrese un código válido.",
        "error"
      );

      return;

    }


    mostrarMensaje(
      "mensaje",
      "Consultando estudiante...",
      "ok"
    );


    llamarAPI(

      {
        accion: "estudiante",
        codigo: codigo
      },

      function(respuesta) {

        if (
          !respuesta ||
          respuesta.ok === false ||
          !respuesta.estudiante
        ) {

          mostrarMensaje(
            "mensaje",
            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "Estudiante no encontrado.",
            "error"
          );

          return;

        }


        estudianteActual = respuesta.estudiante;


        const estudianteMostrado = Object.assign(
          {},
          respuesta.estudiante,
          {
            saldoActual:
              respuesta.cuenta
                ? respuesta.cuenta.saldoActual
                : 0
          }
        );

        mostrarEstudiante(
          estudianteMostrado
        );


        cargarMovimientos(
          respuesta.estudiante.codigo
        );


        cargarOpciones();
        cargarResponsables();

        ocultarMensaje("mensaje");

      }

    );

  }


  /* =========================================================
     MOSTRAR ESTUDIANTE
     ========================================================= */

  function mostrarEstudiante(estudiante) {

    estudianteActual = estudiante;

    document.getElementById("datoCodigo").textContent =
      estudiante.codigo || "-";


    document.getElementById("datoNombre").textContent =
      estudiante.nombreCompleto ||
      estudiante.nombre ||
      "-";


    document.getElementById("datoGrado").textContent =
      estudiante.grado || "-";


    document.getElementById("datoSeccion").textContent =
      estudiante.seccion || "-";


    document.getElementById("datoDocente").textContent =
      estudiante.docente || "-";


    document.getElementById("datoBase").textContent =
      numero(estudiante.montoBase).toFixed(2) +
      " " +
      MONEDA;


    document.getElementById("datoSaldo").textContent =
      numero(estudiante.saldoActual).toFixed(2) +
      " " +
      MONEDA;

    const foto =
      document.getElementById("datoFoto");

    const fotoURL =
      estudiante.fotoUrl ||
      estudiante.foto ||
      "";

    if (fotoURL) {
      foto.src = fotoURL;
      foto.style.display = "block";
    } else {
      foto.removeAttribute("src");
      foto.style.display = "none";
    }

    document.getElementById("panelOperacion").classList.add("oculto");
    document.getElementById("btnCobrar").classList.remove("tipo-activo");
    document.getElementById("btnPagar").classList.remove("tipo-activo");

    document
      .getElementById("seccionEstudiante")
      .style.display = "block";


    document
      .getElementById("seccionOperacion")
      .style.display = "block";


    document
      .getElementById("seccionMovimientos")
      .style.display = "none";

  }


  /* =========================================================
     CATEGORÍAS Y CONCEPTOS
     ========================================================= */

  function cargarOpciones() {

    llamarAPI(

      {
        accion: "opciones"
      },

      function(respuesta) {

        if (!respuesta || respuesta.ok === false) {

          mostrarMensaje(
            "mensajeOperacion",
            "No se pudieron cargar las opciones.",
            "error"
          );

          return;

        }

        /*
         * CONFIG_OPCIONES tiene la estructura REAL:
         * A = INGRESOS_Y_SUELDOS
         * B = PREMIOS_Y_BONIFICACIONES
         * C = AHORROS_E_INVERSIONES
         * D = PAGOS_Y_GASTOS
         * E = SANCIONES_Y_MULTAS
         * F = COSTOS_Y_OTROS
         *
         * Apps Script devuelve esa misma estructura en
         * respuesta.opcionesPorCategoria.
         */
        const opciones =
          respuesta.opcionesPorCategoria &&
          typeof respuesta.opcionesPorCategoria === "object"
            ? respuesta.opcionesPorCategoria
            : {};

        categorias = {};
        conceptosCatalogo = {};

        Object.keys(opciones).forEach(function(categoria) {

          const lista =
            Array.isArray(opciones[categoria])
              ? opciones[categoria]
              : [];

          categorias[categoria] = [];

          lista.forEach(function(concepto) {

            const texto =
              String(concepto || "").trim();

            if (!texto) {
              return;
            }

            if (categorias[categoria].indexOf(texto) === -1) {
              categorias[categoria].push(texto);
            }

          });

        });

        document
          .getElementById("opcionesOperacion")
          .classList.add("oculto");

      }

    );

  }

  function cargarResponsables() {

    llamarAPI(

      {
        accion: "responsables"
      },

      function(respuesta) {

        const select =
          document.getElementById("responsable");

        select.innerHTML =
          '<option value="">Seleccione responsable</option>';

        if (!respuesta || respuesta.ok === false) {
          return;
        }

        const responsables =
          Array.isArray(respuesta.responsables)
            ? respuesta.responsables
            : [];

        responsables.forEach(function(responsable) {

          const nombre =
            String(responsable || "").trim();

          if (!nombre) {
            return;
          }

          const option =
            document.createElement("option");

          option.value = nombre;
          option.textContent = nombre;

          select.appendChild(option);

        });

      }

    );

  }


  function normalizarCategoria(categoria) {

    return String(categoria || "")
      .trim()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "");

  }


  function cargarCategorias() {

    const select =
      document.getElementById("categoria");

    select.innerHTML =
      '<option value="">Seleccione una categoría</option>';

    if (!tipoOperacion) {
      return;
    }

    Object.keys(categorias).forEach(function(categoria) {

      const clave = normalizarCategoria(categoria);
      let mostrar = false;

      if (tipoOperacion === "INGRESO") {

        mostrar =
          clave === "INGRESOS_Y_SUELDOS" ||
          clave === "PREMIOS_Y_BONIFICACIONES" ||
          clave === "AHORROS_E_INVERSIONES";

      }

      if (tipoOperacion === "EGRESO") {

        mostrar =
          clave === "PAGOS_Y_GASTOS" ||
          clave === "SANCIONES_Y_MULTAS" ||
          clave === "COSTOS_Y_OTROS";

      }

      if (!mostrar) {
        return;
      }

      const option =
        document.createElement("option");

      option.value = categoria;

      option.textContent =
        obtenerNombreCategoria(categoria);

      select.appendChild(option);

    });

    cargarConceptos();

  }


  function obtenerNombreCategoria(categoria) {

    const nombres = {

      INGRESOS_Y_SUELDOS:
        "Ingresos y Sueldos",

      PREMIOS_Y_BONIFICACIONES:
        "Premios y Bonificaciones",

      AHORROS_E_INVERSIONES:
        "Ahorros e Inversiones",

      PAGOS_Y_GASTOS:
        "Pagos y Gastos",

      SANCIONES_Y_MULTAS:
        "Sanciones y Multas",

      COSTOS_Y_OTROS:
        "Costos y Otros"

    };


    return nombres[categoria] || categoria;

  }


  function cargarConceptos() {

    const categoria =
      document.getElementById("categoria").value;


    const select =
      document.getElementById("concepto");


    select.innerHTML =
      '<option value="">Seleccione un concepto</option>';


    if (!categoria) {
      return;
    }


    let lista = [];


    if (Array.isArray(categorias[categoria])) {

      lista = categorias[categoria];

    } else if (
      Array.isArray(conceptosCatalogo[categoria])
    ) {

      lista = conceptosCatalogo[categoria];

    }


    lista.forEach(function(concepto) {

      const option =
        document.createElement("option");


      option.value = concepto;

      option.textContent = concepto;


      select.appendChild(option);

    });

  }


  /* =========================================================
     TIPO DE OPERACIÓN
     ========================================================= */

  function seleccionarOperacion(tipo) {

    tipoOperacion = tipo;


    const btnCobrar =
      document.getElementById("btnCobrar");

    const btnPagar =
      document.getElementById("btnPagar");

    const opciones =
      document.getElementById("opcionesOperacion");

    const panelOperacion =
      document.getElementById("panelOperacion");


    btnCobrar.classList.remove("tipo-activo");

    btnPagar.classList.remove("tipo-activo");


    if (tipo === "INGRESO") {
      btnCobrar.classList.add("tipo-activo");
    }


    if (tipo === "EGRESO") {
      btnPagar.classList.add("tipo-activo");
    }


    panelOperacion.classList.remove("oculto");


    document.getElementById("categoria").value = "";

    document.getElementById("concepto").innerHTML =
      '<option value="">Seleccione un concepto</option>';


    cargarCategorias();


    ocultarMensaje("mensajeOperacion");

  }

  function mostrarSaldo() {

    tipoOperacion = "";

    document.getElementById("btnCobrar").classList.remove("tipo-activo");
    document.getElementById("btnPagar").classList.remove("tipo-activo");
    document.getElementById("panelOperacion").classList.add("oculto");

    if (estudianteActual) {
      document.getElementById("datoSaldo").textContent =
        numero(estudianteActual.saldoActual).toFixed(2) +
        " " +
        MONEDA;
    }

    ocultarMensaje("mensajeOperacion");

  }


  /* =========================================================
     REGISTRAR MOVIMIENTO
     ========================================================= */

  function registrarMovimiento() {

    ocultarMensaje("mensajeOperacion");


    if (!estudianteActual) {

      mostrarMensaje(
        "mensajeOperacion",
        "Primero debe seleccionar un estudiante.",
        "error"
      );

      return;

    }


    if (!tipoOperacion) {

      mostrarMensaje(
        "mensajeOperacion",
        "Seleccione COBRAR o PAGAR.",
        "error"
      );

      return;

    }


    const categoria =
      document.getElementById("categoria").value;


    const concepto =
      document.getElementById("concepto").value;


    const monto =
      numero(
        document.getElementById("monto").value
      );


    const responsable =
      document.getElementById("responsable").value.trim();


    const observacion =
      document.getElementById("observacion").value.trim();


    if (!categoria) {

      mostrarMensaje(
        "mensajeOperacion",
        "Seleccione una categoría.",
        "error"
      );

      return;

    }


    if (!concepto) {

      mostrarMensaje(
        "mensajeOperacion",
        "Seleccione un concepto.",
        "error"
      );

      return;

    }


    if (monto <= 0) {

      mostrarMensaje(
        "mensajeOperacion",
        "Ingrese un monto mayor que 0.",
        "error"
      );

      return;

    }


    if (!responsable) {

      mostrarMensaje(
        "mensajeOperacion",
        "Ingrese el responsable.",
        "error"
      );

      return;

    }


    if (
      tipoOperacion === "EGRESO" &&
      monto > numero(estudianteActual.saldoActual)
    ) {

      mostrarMensaje(
        "mensajeOperacion",
        "El saldo disponible no permite realizar este pago.",
        "error"
      );

      return;

    }


    const datos = {

      accion: "registrar",

      codigo: estudianteActual.codigo,

      tipo: tipoOperacion,

      categoria: categoria,

      concepto: concepto,

      monto: monto,

      responsable: responsable,

      observacion: observacion,

      requestId: generarRequestId()

    };


    mostrarMensaje(
      "mensajeOperacion",
      "Registrando movimiento...",
      "ok"
    );


    llamarAPI(

      datos,

      function(respuesta) {

        if (!respuesta || respuesta.ok === false) {

          mostrarMensaje(
            "mensajeOperacion",
            respuesta && respuesta.mensaje
              ? respuesta.mensaje
              : "No se pudo registrar el movimiento.",
            "error"
          );

          return;

        }


        mostrarMensaje(
          "mensajeOperacion",
          "Movimiento registrado correctamente.",
          "ok"
        );


        if (respuesta.saldoActual !== undefined) {

          estudianteActual.saldoActual =
            numero(respuesta.saldoActual);


          document.getElementById("datoSaldo").textContent =
            numero(respuesta.saldoActual).toFixed(2) +
            " " +
            MONEDA;

        }


        limpiarCamposOperacion();


        cargarMovimientos(
          estudianteActual.codigo
        );

      }

    );

  }


  /* =========================================================
     MOVIMIENTOS
     ========================================================= */

  function cargarMovimientos(codigo) {

    llamarAPI(

      {
        accion: "movimientos",
        codigo: codigo
      },

      function(respuesta) {

        const tabla =
          document.getElementById("tablaMovimientos");


        tabla.innerHTML = "";


        if (
          !respuesta ||
          respuesta.ok === false ||
          !Array.isArray(respuesta.movimientos)
        ) {

          return;

        }


        respuesta.movimientos.forEach(function(movimiento) {

          const fila =
            document.createElement("tr");


          const fecha =
            movimiento.fecha ||
            movimiento.timestamp ||
            "";


          const tipo =
            movimiento.tipo ||
            movimiento.tipoMovimiento ||
            "";


          const concepto =
            movimiento.concepto || "";


          const monto =
            numero(
              movimiento.monto ||
              movimiento.montoLDS
            );


          const responsable =
            movimiento.responsable || "";


          const observacion =
            movimiento.observacion || "";


          fila.innerHTML =

            "<td>" +
              escaparHTML(fecha) +
            "</td>" +

            "<td class='" +
              (tipo === "INGRESO"
                ? "ingreso"
                : "egreso") +
            "'>" +
              escaparHTML(tipo) +
            "</td>" +

            "<td>" +
              escaparHTML(concepto) +
            "</td>" +

            "<td>" +
              monto.toFixed(2) +
              " " +
              MONEDA +
            "</td>" +

            "<td>" +
              escaparHTML(responsable) +
            "</td>" +

            "<td>" +
              escaparHTML(observacion) +
            "</td>";


          tabla.appendChild(fila);

        });

      }

    );

  }


  function escaparHTML(valor) {

    return String(valor)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     LIMPIAR
     ========================================================= */

  function limpiarCamposOperacion() {

    document.getElementById("categoria").value = "";

    document.getElementById("concepto").innerHTML =
      '<option value="">Seleccione un concepto</option>';

    document.getElementById("monto").value = "";

    document.getElementById("responsable").value = "";

    document.getElementById("observacion").value = "";

  }


  function limpiarOperacion() {

    tipoOperacion = "";

    document
      .getElementById("btnCobrar")
      .classList.remove("tipo-activo");

    document
      .getElementById("btnPagar")
      .classList.remove("tipo-activo");


    limpiarCamposOperacion();

    document.getElementById("panelOperacion").classList.add("oculto");

    ocultarMensaje("mensajeOperacion");

  }


</script>
