<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BANCO LDS 360 — Caja Andrew / Gerencia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #0c1e30;
  --azul-claro: #1e3a8a;
  --dorado: #f59e0b;
  --fondo: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 50%, #0f172a 100%);
  --blanco: #ffffff;
  --texto: #1e293b;
  --muted: #64748b;
  --borde: #cbd5e1;
  --verde: #059669;
  --rojo: #e11d48;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  text-transform: uppercase;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
  font-size: 13px;
  line-height: 1.4;
  padding: 15px;
}

header {
  background: #08121e;
  color: #fff;
  padding: 10px 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  border-bottom: 4px solid var(--dorado);
  border-radius: 12px;
  margin-bottom: 15px;
}

.header-inner {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.brand h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 800;
  color: #ffffff;
}

.brand p {
  margin: 0;
  color: var(--dorado);
  font-size: 0.65rem;
  font-weight: 700;
}

.btn {
  border: 0;
  border-radius: 20px;
  padding: 6px 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 0.8rem;
  transition: all 0.2s ease;
  min-height: 34px;
}

.btn-light {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--dorado);
  color: #ffffff;
}

.btn-gold {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  border: 1px solid #fcd34d;
}

.btn-blue {
  background: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 100%);
  color: #ffffff;
  border: 1px solid var(--dorado);
}

.btn-outline {
  background: #ffffff;
  border: 1.5px solid var(--borde);
  color: var(--azul);
}

.layout-main {
  max-width: 1600px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
}

@media (min-width: 1100px) {
  .layout-main {
    grid-template-columns: minmax(0, 1.45fr) minmax(340px, 0.75fr);
  }
}

.left-stack, .right-stack {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
}

.profile-banner {
  background: #ffffff;
  border: 2px solid var(--dorado);
  border-radius: 14px;
  padding: 15px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.profile-info {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar-wrap {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 3px solid var(--dorado);
  overflow: hidden;
  background: #ffffff;
  flex-shrink: 0;
}

.avatar-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-text h3 {
  font-size: 1.4rem;
  color: var(--azul);
  font-weight: 900;
  margin: 0;
}

.profile-text p {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  margin-top: 2px;
}

.stats-grid {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.stat-pill {
  border-radius: 12px;
  padding: 10px 16px;
  text-align: center;
  min-width: 130px;
}

.stat-pill span {
  display: block;
  font-size: 0.68rem;
  font-weight: 800;
  margin-bottom: 2px;
}

.stat-pill strong {
  font-size: 1.5rem;
  font-weight: 900;
  display: block;
}

.pill-inicial {
  background: linear-gradient(135deg, #eff6ff, #dbeafe);
  border: 2px solid #3b82f6;
  color: #1e40af;
}

.pill-actual {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  border: 2px solid #10b981;
  color: #065f46;
}

.pill-actual strong { color: #047857; }

.pill-mov {
  background: #f8fafc;
  border: 1.5px solid var(--borde);
  color: var(--azul);
}

.alert-status {
  background: #ecfdf5;
  border: 1.5px solid #a7f3d0;
  color: #047857;
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.8rem;
}

.mises-panel {
  background: #ffffff;
  border: 2px solid var(--dorado);
  border-radius: 14px;
  padding: 15px;
}

.mises-panel h3 {
  color: var(--azul);
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 12px;
}

.mises-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}

.mise-card {
  border: 1.5px solid var(--dorado);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fffdf7;
  display: flex;
  align-items: center;
  gap: 10px;
}

.mise-card img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--dorado);
  object-fit: cover;
}

.mise-card-info strong {
  display: block;
  font-size: 0.72rem;
  color: var(--azul);
  font-weight: 900;
}

.mise-card-info span {
  display: block;
  font-size: 0.65rem;
  color: var(--muted);
  font-weight: 700;
}

.mise-card-info p {
  font-size: 1rem;
  color: #047857;
  font-weight: 900;
  margin-top: 2px;
}
