<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANCO LDS 360 - IEP La Salle del Sur</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#071a31;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
.banco{position:relative;width:100%;max-width:1700px;line-height:0}
.portada{display:block;width:100%;height:auto}
.zona{position:absolute;display:block;border:0;background:transparent;cursor:pointer;z-index:5}
.zona:hover{background:rgba(255,255,255,.04);border-radius:25px}
.admin{right:2.0%;top:0.8%;width:15.5%;height:8.0%}
.qr{left:12.5%;top:70.0%;width:21.8%;height:13.0%}
.codigo{left:55.5%;top:70.0%;width:16.2%;height:13.0%}
.tienda{left:12.5%;top:84.0%;width:19.0%;height:15.0%}
.padres{left:32.0%;top:84.0%;width:20.8%;height:15.0%}
.manual{left:52.8%;top:84.0%;width:18.7%;height:15.0%}

#qrModal{
display:none;position:fixed;inset:0;background:rgba(4,16,31,.94);
z-index:100;align-items:center;justify-content:center;padding:20px
}
.qrBox{
width:min(92vw,430px);background:#0c1e30;border:3px solid #f1c40f;
border-radius:22px;padding:20px;color:white;text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.5)
}
.qrBox h2{font-size:20px;color:#f1c40f;margin-bottom:8px;line-height:1.2}
.qrBox p{font-size:14px;line-height:1.4;margin-bottom:14px}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000}
.cerrar{
margin-top:14px;width:100%;padding:11px;border:0;border-radius:12px;
background:#e11d48;color:white;font-weight:700;cursor:pointer;font-size:15px
}
@media(max-width:700px){
.admin{right:2%;top:.8%;width:24%;height:9%}
.qr{left:11%;top:70%;width:25%;height:14%}
.codigo{left:54%;top:70%;width:20%;height:14%}
.tienda{left:11%;top:84%;width:23%;height:15%}
.padres{left:34%;top:84%;width:21%;height:15%}
.manual{left:55%;top:84%;width:20%;height:15%}
}
</style>
</head>
<body>

<main class="banco">
  <img class="portada" src="assets/portada.png"
       alt="BANCO LDS 360 - IEP La Salle del Sur">

  <!-- Zonas transparentes sobre los botones de la imagen -->
  <a class="zona admin" href="administrador.html" aria-label="Administrador"></a>

  <button class="zona qr" type="button" onclick="abrirQR()" aria-label="Escanea QR"></button>

  <a class="zona codigo" href="alumno.html" aria-label="Ingresa código"></a>

  <a class="zona tienda" href="tienda.html" aria-label="Tienda escolar"></a>
  <a class="zona padres" href="padres.html" aria-label="Padres"></a>
  <a class="zona manual" href="manual.html" aria-label="Manual del sistema"></a>
</main>

<div id="qrModal">
  <div class="qrBox">
    <h2>Escanea el código QR</h2>
    <p>Se identificará al alumno para continuar con su acceso.</p>
    <div id="reader"></div>
    <button class="cerrar" type="button" onclick="cerrarQR()">✕ Cancelar</button>
  </div>
</div>

<script>
let lectorQR=null;

function abrirQR(){
  const modal=document.getElementById("qrModal");
  modal.style.display="flex";

  if(!lectorQR) lectorQR=new Html5Qrcode("reader");

  lectorQR.start(
    {facingMode:"environment"},
    {fps:10,qrbox:{width:230,height:230}},
    (texto)=>{
      let codigo=texto;
      try{
        if(texto.includes("?")){
          const u=new URL(texto);
          codigo=u.searchParams.get("codigo") || texto;
        }
      }catch(e){}
      cerrarQR();
      window.location.href="alumno.html?codigo="+encodeURIComponent(codigo.trim().toUpperCase());
    },
    ()=>{}
  ).catch(()=>{
    alert("No se pudo iniciar la cámara. Verifique los permisos.");
    cerrarQR();
  });
}

function cerrarQR(){
  document.getElementById("qrModal").style.display="none";
  if(lectorQR && lectorQR.isScanning){
    lectorQR.stop().catch(()=>{});
  }
}
</script>

</body>
</html>
