<script>
const ALUMNOS_API_URL = "https://script.google.com/macros/s/AKfycbxZ3ZYzBGAfFUdyJpDpMlAAVOBVrDocj3E3jJ1GTZIWTPjlSv1LjfMECbMmDWVU-H-prQ/exec";
const MONEDA = "LDS";

let lector = null;
let codigoPendiente = "";
let saltPendiente = "";
let noncePendiente = "";
let retoEnCurso = false;
let tokenAlumno = "";
let estudianteActual = null;
let tipoOperacion = "";
let categorias = {};


function mostrarMensaje(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto || "";
  el.className = "mensaje " + (tipo || "");
}

function ocultarMensaje(id) {
  const el = document.getElementById(id);
  el.textContent = "";
  el.className = "mensaje";
}

function normalizarCodigo(codigo) {
  return String(codigo == null ? "" : codigo)
    .trim()
    .toUpperCase()
    .replace(/[._\s]+/g, "-")
    .replace(/-+/g, "-");
}

function numero(valor) {
  const n = Number(valor);
  return Number.isFinite(n) ? n : 0;
}

function generarRequestId() {
  return "LDS-ALUMNO-" +
    Date.now() + "-" +
    Math.random().toString(36).substring(2,10);
}

function escaparHTML(valor) {
  return String(valor == null ? "" : valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function sha256(texto) {
  const datos = new TextEncoder().encode(texto);
  const hash = await crypto.subtle.digest("SHA-256", datos);

  return Array.from(new Uint8Array(hash))
    .map(byte => byte.toString(16).padStart(2,"0"))
    .join("");
}


function llamarAPI(parametros) {
  return new Promise(function(resolve, reject) {

    const callback =
      "callbackAlumnoLDS_" +
      Date.now() + "_" +
      Math.floor(Math.random()*100000);

    const query = Object.keys(parametros)
      .map(function(clave) {
        return encodeURIComponent(clave) + "=" +
          encodeURIComponent(parametros[clave]);
      })
      .join("&");

    const script = document.createElement("script");

    script.src =
      ALUMNOS_API_URL +
      "?" + query +
      "&callback=" + encodeURIComponent(callback);

    let terminado = false;

    const limpiar = function() {
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callback];
      } catch (e) {
        window[callback] = undefined;
      }
    };

    const temporizador = setTimeout(function() {
      if (terminado) return;

      terminado = true;
      limpiar();

      reject(new Error("El servicio no respondió a tiempo."));
    },15000);

    window[callback] = function(respuesta) {
      if (terminado) return;

      terminado = true;
      clearTimeout(temporizador);
      limpiar();
      resolve(respuesta);
    };

    script.onerror = function() {
      if (terminado) return;

      terminado = true;
      clearTimeout(temporizador);
      limpiar();

      reject(new Error("No se pudo conectar con BANCO LDS 360."));
    };

    document.body.appendChild(script);
  });
}


function detenerQR() {
  if (!lector) return;

  try {
    lector.stop();
  } catch (e) {}

  lector = null;
}

function iniciarQR() {

  ocultarMensaje("mensaje");

  if (lector) {
    try { lector.stop(); } catch(e) {}
    lector = null;
  }

  try {
    lector = new Html5Qrcode("lectorQR");
  } catch(error) {
    mostrarMensaje(
      "mensaje",
      "No fue posible iniciar el lector QR.",
      "error"
    );
    return;
  }

  lector.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width:250, height:250 }
    },

    function(codigoQR) {
      detenerQR();
      prepararCodigo(codigoQR);
    },

    function(error) {
      // Errores normales del escaneo.
    }

  ).catch(function(error) {

    mostrarMensaje(
      "mensaje",
      "No fue posible iniciar la cámara. Use el código manual.",
      "error"
    );

  });
}


function ingresarCodigoManual() {
  const codigo = prompt("Ingrese el código del estudiante:");
  if (!codigo) return;

  prepararCodigo(codigo);
}


async function prepararCodigo(codigo) {

  codigoPendiente =
    normalizarCodigo(codigo);

  if (!codigoPendiente) {
    mostrarMensaje(
      "mensaje",
      "Ingrese un código válido.",
      "error"
    );
    return;
  }

  saltPendiente = "";
  noncePendiente = "";

  document.getElementById(
    "accesoClave"
  ).classList.add("activo");

  document.getElementById(
    "codigoSeleccionado"
  ).textContent =
    "Código identificado: " +
    codigoPendiente +
    ". Ingrese su clave personal.";

  document.getElementById(
    "claveAlumno"
  ).value = "";


  mostrarMensaje(
    "mensaje",
    "Preparando el acceso...",
    "ok"
  );

  await solicitarReto();
}


async function solicitarReto() {

  if (!codigoPendiente) return false;

  retoEnCurso = true;
  saltPendiente = "";
  noncePendiente = "";

  const boton = document.getElementById("btnIngresarAlumno");
  if (boton) boton.disabled = true;

  mostrarMensaje(
    "mensaje",
    "Preparando el acceso...",
    "ok"
  );

  try {

    const respuesta =
      await llamarAPI({
        accion:"preloginAlumno",
        codigo:codigoPendiente
      });

    if (!respuesta || respuesta.ok !== true) {
      throw new Error(
        respuesta && respuesta.mensaje
          ? respuesta.mensaje
          : "Credenciales inválidas."
      );
    }

    saltPendiente = respuesta.salt || "";
    noncePendiente = respuesta.nonce || "";

    if (!saltPendiente || !noncePendiente) {
      throw new Error("No se pudo preparar el acceso.");
    }

    mostrarMensaje(
      "mensaje",
      "Código identificado. Ya puede ingresar su clave.",
      "ok"
    );

    if (boton) boton.disabled = false;
    document.getElementById("claveAlumno").focus();
    return true;

  } catch(error) {

    saltPendiente = "";
    noncePendiente = "";

    mostrarMensaje(
      "mensaje",
      error.message || "No fue posible preparar el acceso.",
      "error"
    );

    return false;

  } finally {
    retoEnCurso = false;
  }
}

async function confirmarAcceso() {

  const clave =
    document.getElementById("claveAlumno").value;

  if (!codigoPendiente) {
    mostrarMensaje(
      "mensaje",
      "Primero identifique el estudiante.",
      "error"
    );
    return;
  }

  if (!clave) {
    mostrarMensaje(
      "mensaje",
      "Ingrese su clave personal.",
      "error"
    );
    return;
  }

  if (retoEnCurso) {
    mostrarMensaje(
      "mensaje",
      "Espere un momento mientras se prepara el acceso.",
      "ok"
    );
    return;
  }

  if (!saltPendiente || !noncePendiente) {
    const preparado = await solicitarReto();
    if (!preparado) return;
  }

  try {

    const boton = document.getElementById("btnIngresarAlumno");
    if (boton) boton.disabled = true;

    mostrarMensaje(
      "mensaje",
      "Verificando acceso...",
      "ok"
    );

    const hashClave =
      await sha256(
        clave + "|" + saltPendiente
      );

    const prueba =
      await sha256(
        hashClave + "|" + noncePendiente
      );

    const respuesta =
      await llamarAPI({
        accion:"loginAlumno",
        codigo:codigoPendiente,
        nonce:noncePendiente,
        prueba:prueba
      });

    if (!respuesta || respuesta.ok !== true) {
      throw new Error(
        respuesta && respuesta.mensaje
          ? respuesta.mensaje
          : "Credenciales inválidas."
      );
    }

    tokenAlumno = respuesta.token || "";
    estudianteActual = respuesta.estudiante || null;

    mostrarFichaEstudiante(respuesta);
    await cargarOpciones();

    document.getElementById(
      "accesoClave"
    ).classList.remove("activo");

    mostrarMensaje(
      "mensaje",
      "Acceso correcto.",
      "ok"
    );

  } catch(error) {

    mostrarMensaje(
      "mensaje",
      error.message || "No fue posible ingresar.",
      "error"
    );

    const boton = document.getElementById("btnIngresarAlumno");
    if (boton) boton.disabled = false;
  }
}

function mostrarFichaEstudiante(datos) {

  const estudiante =
    datos.estudiante || {};

  const cuenta =
    datos.cuenta || {};

  document.getElementById(
    "datoCodigo"
  ).textContent =
    estudiante.codigo || "-";

  document.getElementById(
    "datoNombre"
  ).textContent =
    estudiante.nombreCompleto || "-";

  document.getElementById(
    "datoGrado"
  ).textContent =
    estudiante.grado || "-";

  document.getElementById(
    "datoSeccion"
  ).textContent =
    estudiante.seccion || "-";

  document.getElementById(
    "datoDocente"
  ).textContent =
    estudiante.docente || "-";

  document.getElementById(
    "datoBase"
  ).textContent =
    numero(estudiante.montoBase).toFixed(2) +
    " LDS";

  document.getElementById(
    "datoSaldo"
  ).textContent =
    numero(cuenta.saldoActual).toFixed(2) +
    " LDS";

  document.getElementById(
    "seccionEstudiante"
  ).style.display = "grid";

  document.getElementById(
    "seccionOperacion"
  ).style.display = "block";

  cargarFoto(
    estudiante.fotoUrl ||
    estudiante.foto ||
    ""
  );

  cargarMovimientosDesdeRespuesta(
    datos.movimientos || []
  );
}


async function cargarOpciones() {

  if (!tokenAlumno) return;

  try {

    const respuesta =
      await llamarAPI({
        accion:"opcionesAlumno",
        token:tokenAlumno
      });

    if (!respuesta || respuesta.ok !== true) {
      return;
    }

    categorias =
      respuesta.opcionesPorCategoria || {};

    const select =
      document.getElementById("responsable");

    select.innerHTML =
      '<option value="">Seleccione responsable</option>';

    (respuesta.responsables || [])
      .forEach(function(nombre) {

        const option =
          document.createElement("option");

        option.value = nombre;
        option.textContent = nombre;

        select.appendChild(option);
      });

  } catch(error) {

    console.error(
      "Error cargando opciones:",
      error
    );
  }
}


function determinarDireccion(
  concepto,
  categoria
) {

  const c =
    String(concepto || "")
      .trim()
      .toUpperCase();

  const cat =
    String(categoria || "")
      .trim()
      .toUpperCase();

  if (
    cat === "INGRESOS_Y_SUELDOS" ||
    cat === "PREMIOS_Y_BONIFICACIONES"
  ) return "INGRESO";

  if (
    cat === "PAGOS_Y_GASTOS" ||
    cat === "SANCIONES_Y_MULTAS"
  ) return "EGRESO";

  if (
    cat === "AHORROS_E_INVERSIONES"
  ) {
    return c.indexOf("RETIRO DE AHORROS") === 0
      ? "EGRESO"
      : "INGRESO";
  }

  return "AMBOS";
}


function cargarCategorias() {

  const select =
    document.getElementById(
      "categoria"
    );

  select.innerHTML =
    '<option value="">Seleccione una categoría</option>';

  Object.keys(categorias)
    .forEach(function(categoria) {

      const option =
        document.createElement("option");

      option.value = categoria;
      option.textContent =
        categoria.replace(/_/g," ");

      select.appendChild(option);
    });
}


function cargarConceptos() {

  const categoria =
    document.getElementById(
      "categoria"
    ).value;

  const select =
    document.getElementById(
      "concepto"
    );

  select.innerHTML =
    '<option value="">Seleccione un concepto</option>';

  if (!categoria) return;

  const lista =
    Array.isArray(categorias[categoria])
      ? categorias[categoria]
      : [];

  lista.forEach(function(concepto) {

    const direccion =
      determinarDireccion(
        concepto,
        categoria
      );

    if (
      direccion !== "AMBOS" &&
      direccion !== tipoOperacion
    ) {
      return;
    }

    const option =
      document.createElement("option");

    option.value = concepto;
    option.textContent = concepto;

    select.appendChild(option);
  });
}


function seleccionarOperacion(tipo) {

  if (!tokenAlumno) return;

  tipoOperacion = tipo;

  document.getElementById(
    "btnCobrar"
  ).classList.remove("tipo-activo");

  document.getElementById(
    "btnPagar"
  ).classList.remove("tipo-activo");

  if (tipo === "INGRESO") {
    document.getElementById(
      "btnCobrar"
    ).classList.add("tipo-activo");
  }

  if (tipo === "EGRESO") {
    document.getElementById(
      "btnPagar"
    ).classList.add("tipo-activo");
  }

  document.getElementById(
    "panelOperacion"
  ).classList.remove("oculto");

  document.getElementById(
    "seccionMovimientos"
  ).style.display = "none";

  cargarCategorias();
  limpiarCamposOperacion();
  ocultarMensaje("mensajeOperacion");
}


function mostrarMovimientos() {

  if (!tokenAlumno) return;

  document.getElementById(
    "panelOperacion"
  ).classList.add("oculto");

  document.getElementById(
    "seccionMovimientos"
  ).style.display = "block";

  cargarMovimientos();
}


async function cargarMovimientos() {

  if (!tokenAlumno) return;

  try {

    const respuesta =
      await llamarAPI({
        accion:"perfilAlumno",
        token:tokenAlumno
      });

    if (!respuesta || respuesta.ok !== true) {
      throw new Error(
        respuesta && respuesta.mensaje
          ? respuesta.mensaje
          : "Sesión expirada."
      );
    }

    estudianteActual =
      respuesta.estudiante;

    document.getElementById(
      "datoSaldo"
    ).textContent =
      numero(
        respuesta.cuenta.saldoActual
      ).toFixed(2) + " LDS";

    cargarMovimientosDesdeRespuesta(
      respuesta.movimientos || []
    );

  } catch(error) {

    mostrarMensaje(
      "mensaje",
      error.message ||
        "No se pudieron cargar los movimientos.",
      "error"
    );
  }
}


function cargarMovimientosDesdeRespuesta(
  movimientos
) {

  const tabla =
    document.getElementById(
      "tablaMovimientos"
    );

  tabla.innerHTML = "";

  if (!movimientos.length) {
    tabla.innerHTML =
      '<tr><td colspan="6" style="text-align:center">Sin movimientos registrados.</td></tr>';
    return;
  }

  movimientos.forEach(function(movimiento) {

    const fila =
      document.createElement("tr");

    const tipo =
      movimiento.tipo || "";

    const clase =
      tipo === "INGRESO"
        ? "ingreso"
        : tipo === "EGRESO"
          ? "egreso"
          : "";

    fila.innerHTML =
      "<td>" +
        escaparHTML(
          movimiento.fechaTexto ||
          movimiento.fecha ||
          ""
        ) +
      "</td>" +

      "<td class='" +
        clase +
      "'>" +
        escaparHTML(tipo) +
      "</td>" +

      "<td>" +
        escaparHTML(
          movimiento.concepto || ""
        ) +
      "</td>" +

      "<td>" +
        numero(
          movimiento.monto
        ).toFixed(2) +
        " LDS" +
      "</td>" +

      "<td>" +
        escaparHTML(
          movimiento.responsable || ""
        ) +
      "</td>" +

      "<td>" +
        escaparHTML(
          movimiento.observacion || ""
        ) +
      "</td>";

    tabla.appendChild(fila);
  });
}


async function registrarMovimiento() {

  ocultarMensaje(
    "mensajeOperacion"
  );

  if (!tokenAlumno) {
    mostrarMensaje(
      "mensajeOperacion",
      "Sesión expirada. Inicie sesión nuevamente.",
      "error"
    );
    return;
  }

  if (!tipoOperacion) {
    mostrarMensaje(
      "mensajeOperacion",
      "Seleccione COBRAR o PAGAR.",
      "error"
    );
    return;
  }

  const categoria =
    document.getElementById(
      "categoria"
    ).value;

  const concepto =
    document.getElementById(
      "concepto"
    ).value;

  const monto =
    numero(
      document.getElementById(
        "monto"
      ).value
    );

  const responsable =
    document.getElementById(
      "responsable"
    ).value;

  const observacion =
    document.getElementById(
      "observacion"
    ).value.trim();

  if (!categoria) {
    mostrarMensaje(
      "mensajeOperacion",
      "Seleccione una categoría.",
      "error"
    );
    return;
  }

  if (!concepto) {
    mostrarMensaje(
      "mensajeOperacion",
      "Seleccione un concepto.",
      "error"
    );
    return;
  }

  if (monto <= 0) {
    mostrarMensaje(
      "mensajeOperacion",
      "Ingrese un monto mayor que 0.",
      "error"
    );
    return;
  }

  if (!responsable) {
    mostrarMensaje(
      "mensajeOperacion",
      "Seleccione responsable.",
      "error"
    );
    return;
  }

  try {

    mostrarMensaje(
      "mensajeOperacion",
      "Registrando movimiento...",
      "ok"
    );

    const respuesta =
      await llamarAPI({
        accion:"registrarMovimientoAlumno",
        token:tokenAlumno,
        tipo:tipoOperacion,
        categoria:categoria,
        concepto:concepto,
        monto:monto,
        responsable:responsable,
        observacion:observacion,
        requestId:generarRequestId()
      });

    if (!respuesta || respuesta.ok !== true) {
      throw new Error(
        respuesta && respuesta.mensaje
          ? respuesta.mensaje
          : "No se pudo registrar el movimiento."
      );
    }

    document.getElementById(
      "datoSaldo"
    ).textContent =
      numero(
        respuesta.saldoActual
      ).toFixed(2) +
      " LDS";

    mostrarMensaje(
      "mensajeOperacion",
      "Movimiento registrado correctamente.",
      "ok"
    );

    limpiarCamposOperacion();

    await cargarMovimientos();

  } catch(error) {

    mostrarMensaje(
      "mensajeOperacion",
      error.message ||
        "No se pudo registrar el movimiento.",
      "error"
    );
  }
}


function limpiarCamposOperacion() {

  document.getElementById(
    "categoria"
  ).value = "";

  document.getElementById(
    "concepto"
  ).innerHTML =
    '<option value="">Seleccione un concepto</option>';

  document.getElementById(
    "monto"
  ).value = "";

  document.getElementById(
    "responsable"
  ).value = "";

  document.getElementById(
    "observacion"
  ).value = "";
}


function limpiarOperacion() {

  tipoOperacion = "";

  document.getElementById(
    "btnCobrar"
  ).classList.remove("tipo-activo");

  document.getElementById(
    "btnPagar"
  ).classList.remove("tipo-activo");

  document.getElementById(
    "panelOperacion"
  ).classList.add("oculto");

  limpiarCamposOperacion();

  ocultarMensaje(
    "mensajeOperacion"
  );
}


async function cerrarSesion() {

  try {

    if (tokenAlumno) {
      await llamarAPI({
        accion:"logoutAlumno",
        token:tokenAlumno
      });
    }

  } catch(error) {}

  detenerQR();

  tokenAlumno = "";
  codigoPendiente = "";
  saltPendiente = "";
  noncePendiente = "";
  estudianteActual = null;
  tipoOperacion = "";
  categorias = {};

  document.getElementById(
    "claveAlumno"
  ).value = "";

  document.getElementById(
    "accesoClave"
  ).classList.remove("activo");
  const botonIngreso = document.getElementById("btnIngresarAlumno");
  if (botonIngreso) botonIngreso.disabled = true;

  document.getElementById(
    "codigoSeleccionado"
  ).textContent = "";

  document.getElementById(
    "seccionEstudiante"
  ).style.display = "none";

  document.getElementById(
    "seccionOperacion"
  ).style.display = "none";

  document.getElementById(
    "seccionMovimientos"
  ).style.display = "none";

  document.getElementById(
    "datoFoto"
  ).style.display = "none";

  document.getElementById(
    "datoFoto"
  ).removeAttribute("src");

  ocultarMensaje("mensaje");
  ocultarMensaje("mensajeOperacion");
}


document.getElementById(
  "claveAlumno"
).addEventListener(
  "keydown",
  function(e) {
    if (e.key === "Enter") {
      confirmarAcceso();
    }
  }
);
</script>
