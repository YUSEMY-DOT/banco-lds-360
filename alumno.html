<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCO LDS 360 - IEP LA SALLE DEL SUR</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; text-transform: uppercase; }
    body {
      background: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }
    header {
      background: #08121e;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #f59e0b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .school-info { display: flex; align-items: center; gap: 14px; }
    .school-info img { width: 45px; height: 45px; object-fit: contain; }
    .school-title h1 { font-size: 1.1rem; color: #ffffff; font-weight: 800; letter-spacing: 0.8px; }
    .school-title p { font-size: 0.78rem; color: #f59e0b; font-weight: 700; }
    .inicio-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #f59e0b;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .inicio-btn:hover { background: #f59e0b; color: #0c1e30; }
    
    main { 
      max-width: 1250px; 
      width: 96%; 
      margin: auto; 
      padding: 30px 15px; 
      flex: 1; 
      display: flex; 
      align-items: center;
    }

    .hidden { display: none !important; }

    /* CONTENEDOR PRINCIPAL COMPARTIDO (PROPORCIONADO) */
    .dashboard-container {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 30px;
      width: 100%;
      align-items: stretch;
    }

    @media (max-width: 950px) {
      .dashboard-container { grid-template-columns: 1fr; }
    }

    /* COLUMNA IZQUIERDA: CUADRO AZUL PROPORCIONADO */
    .saldo-card {
      background: linear-gradient(135deg, #111827 0%, #1e3a8a 100%);
      color: #ffffff;
      border-radius: 28px;
      padding: 34px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 3px solid #f59e0b;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .saldo-top { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .saldo-title { font-size: 0.8rem; color: #f59e0b; font-weight: 800; letter-spacing: 1.2px; }
    .saldo-amount { font-size: 2.6rem; font-weight: 800; margin-top: 8px; color: #ffffff; }
    .avatar-img { 
      width: 140px; 
      height: 140px; 
      border-radius: 50%; 
      border: 4px solid #f59e0b; 
      object-fit: cover; 
      background: #ffffff; 
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }
    .alumno-info-box { margin-top: 24px; }
    .alumno-nombre { font-size: 1.25rem; font-weight: 800; color: #ffffff; line-height: 1.35; }
    .alumno-grado { font-size: 0.9rem; color: #cbd5e1; font-weight: 700; margin-top: 6px; }
    
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; }
    .action-btn { 
      padding: 16px 12px; border-radius: 18px; font-weight: 800; color: #ffffff; border: none; cursor: pointer; text-align: center; font-size: 0.9rem; 
      box-shadow: 0 6px 18px rgba(0,0,0,0.25); transition: transform 0.2s, box-shadow 0.2s; 
    }
    .action-btn:hover { transform: translateY(-2px); }
    .btn-pagar { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); border: 2px solid #fb7185; }
    .btn-movs { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); border: 2px solid #c084fc; }

    /* COLUMNA DERECHA: PANELES (REGISTRO / HISTORIAL) */
    .sub-card { 
      background: #ffffff; color: #1e293b; border-radius: 28px; padding: 34px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); border: 3px solid #f59e0b; text-align: left; 
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sub-card h4 { font-size: 1.15rem; color: #0c1e30; font-weight: 800; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    
    .form-scroll-area { max-height: 380px; overflow-y: auto; padding-right: 6px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; color: #334155; font-size: 0.8rem; font-weight: 800; margin-bottom: 6px; }
    .input-field { 
      width: 100%; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 14px; font-size: 0.9rem; outline: none; color: #0c1e30; background: #f8fafc; font-weight: 700;
    }
    .input-field:focus { border-color: #0284c7; background: #fff; }
    
    .lista-movs { min-height: 280px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .btn-primary {
      width: 100%; height: 52px; background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff; border: none; border-radius: 16px; font-size: 1rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35); margin-top: 16px; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.95; }
    
    footer { 
      text-align: center; padding: 14px; font-size: 0.78rem; color: #ffffff; background-color: #08121e; 
      border-top: 3px solid #f59e0b; font-weight: 700; letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="school-info">
      <img src="assets/insignia.png" alt="Insignia La Salle del Sur">
      <div class="school-title">
        <h1>BANCO LDS 360</h1>
        <p>I.E.P. LA SALLE DEL SUR</p>
      </div>
    </div>
    <a href="index.html" class="inicio-btn">← INICIO</a>
  </header>

  <main>
    <div class="dashboard-container">
      
      <!-- LADO IZQUIERDO: TARJETA DEL ESTUDIANTE (SINCRONIZADA) -->
      <div class="saldo-card">
        <div>
          <div class="saldo-top">
            <div>
              <p class="saldo-title">SALDO DISPONIBLE</p>
              <h3 class="saldo-amount"><span id="saldoLDS">0.00</span> <span style="font-size: 1rem; font-weight: 600;">LDS</span></h3>
            </div>
            <img id="alumnoFoto" src="https://via.placeholder.com/150" alt="Foto del Estudiante" class="avatar-img" />
          </div>
          <div class="alumno-info-box">
            <p id="alumnoNombre" class="alumno-nombre">CARGANDO DATOS...</p>
            <p id="alumnoGrado" class="alumno-grado">---</p>
          </div>
        </div>

        <div class="actions-grid">
          <button onclick="accionBotonPagar()" class="action-btn btn-pagar">💸 PAGAR / GASTOS</button>
          <button onclick="accionBotonMovimientos()" class="action-btn btn-movs">📋 MOVIMIENTOS</button>
        </div>
      </div>

      <!-- LADO DERECHO: PANELES COMPARTIDOS -->
      <div>
        <!-- FORMULARIO DE REGISTRO DE PAGO O GASTO -->
        <div id="seccionOperacion" class="sub-card hidden">
          <h4 id="tituloOperacion">REGISTRAR PAGO O GASTO</h4>
          
          <div class="form-scroll-area">
            <div class="form-group">
              <label>CATEGORÍA</label>
              <select id="selectCategoria" onchange="alCambiarCategoria()" class="input-field">
                <option value="">SELECCIONE CATEGORÍA</option>
              </select>
            </div>

            <div class="form-group">
              <label>CONCEPTO</label>
              <select id="selectConcepto" class="input-field">
                <option value="">SELECCIONE CONCEPTO</option>
              </select>
            </div>

            <div class="form-group">
              <label>MONTO LDS</label>
              <input type="number" id="inputMonto" min="0" step="0.01" placeholder="0.00" class="input-field" />
            </div>

            <div class="form-group">
              <label>CAJERO / CAJERA</label>
              <select id="selectResponsable" class="input-field">
                <option value="">SELECCIONE CAJERO(A)</option>
                <option value="MISS LILY MELO AZAÑERO">MISS LILY MELO AZAÑERO</option>
                <option value="MISS KIARA MORALES ELGUERA">MISS KIARA MORALES ELGUERA</option>
                <option value="MISS ANGHY REYES MELO">MISS ANGHY REYES MELO</option>
                <option value="MISS KARIN MOLERO ROMANI">MISS KARIN MOLERO ROMANI</option>
              </select>
            </div>

            <div class="form-group">
              <label>OBSERVACIÓN (OPCIONAL)</label>
              <textarea id="inputObservacion" rows="2" placeholder="DETALLE..." class="input-field" style="resize: none;"></textarea>
            </div>
          </div>

          <div>
            <button onclick="registrarMovimientoOperacion()" class="btn-primary">
              CONFIRMAR Y REGISTRAR PAGO
            </button>
            <div id="mensajeOperacion" style="font-size: 0.82rem; text-align: center; margin-top: 8px; min-height: 18px; font-weight: 800;"></div>
          </div>
        </div>

        <!-- HISTORIAL DE MOVIMIENTOS -->
        <div id="seccionMovimientos" class="sub-card">
          <h4>HISTORIAL DE MOVIMIENTOS</h4>
          <div id="listaMovimientos" class="lista-movs">
            <p style="color: #64748b; text-align: center; font-style: italic; padding: 30px; font-size: 0.88rem;">SIN MOVIMIENTOS RECIENTES.</p>
          </div>
        </div>

      </div>

    </div>
  </main>

  <footer>
    KIDSWork LS - I.E.P. LA SALLE DEL SUR — TODOS LOS DERECHOS RESERVADOS
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHpJOXgHX-_uqZxlI5Pm87I9XmlRBJQ2VY2MJ5F3qQeYA2CIaG2HEOOKZUz4nLJLQLZg/exec";
    let codigoEstudianteActual = "";

    function hacerPeticionJSONP(parametros, callback) {
      const nombreCallback = 'jsonp_callback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      let respuestaEnviada = false;

      const timeoutSeguridad = setTimeout(() => {
        if (!respuestaEnviada) {
          respuestaEnviada = true;
          delete window[nombreCallback];
          if (script && script.parentNode) document.body.removeChild(script);
          callback({ success: false, ok: false, mensaje: "EL SERVIDOR TARDÓ DEMASIADO." });
        }
      }, 12000);

      window[nombreCallback] = function(data) {
        if (respuestaEnviada) return;
        respuestaEnviada = true;
        clearTimeout(timeoutSeguridad);
        delete window[nombreCallback];
        if (script && script.parentNode) document.body.removeChild(script);
        callback(data);
      };

      let url = SCRIPT_URL + '?callback=' + nombreCallback;
      for (let clave in parametros) {
        if (parametros[clave] !== undefined && parametros[clave] !== null) {
          url += '&' + encodeURIComponent(clave) + '=' + encodeURIComponent(parametros[clave]);
        }
      }

      const script = document.createElement('script');
      script.src = url;
      script.onerror = function() {
        if (respuestaEnviada) return;
        respuestaEnviada = true;
        clearTimeout(timeoutSeguridad);
        delete window[nombreCallback];
        if (script && script.parentNode) document.body.removeChild(script);
        callback({ success: false, ok: false, mensaje: "ERROR DE CONEXIÓN." });
      };
      document.body.appendChild(script);
    }

    let catalogoGlobal = {
      "AHORROS_E_INVERSIONES": [
        "Depósito a cuenta de ahorros (Ahorro voluntario)", 
        "Inversión en fondo común del aula / cooperativa", 
        "Retiro de ahorros (Emergencia o meta cumplida)"
      ],
      "PAGOS_Y_GASTOS": [
        "Pago Compra en la tienda escolar / cafetín", 
        "Pago de alquiler / mantenimiento de carpeta o espacio de trabajo", 
        "Pago de servicios del aula: Agua", 
        "Pago de servicios del aula: Energía", 
        "Compra de material escolar de emergencia", 
        "Gasto médico imprevisto menor", 
        "Alquiler de libros de la biblioteca", 
        "Pago por custodia de equipos tecnológicos", 
        "Pago por copias extras", 
        "Comprar stickers", 
        "Pagar para una actividad extra", 
        "Pagar por jugar 10 minutos más"
      ],
      "SANCIONES_Y_MULTAS": [
        "Multa por llevar mal el uniforme o incompleto", 
        "Incumplimiento de tareas o asignaciones a tiempo", 
        "Llegada tarde al aula o formación", 
        "Uso no autorizado de dispositivos electrónicos", 
        "Desorden o indisciplina leve", 
        "Falta de respeto o modales", 
        "No traer el material escolar requerido", 
        "Descuido o daño leve al mobiliario", 
        "Basura fuera de su lugar / No respetar áreas verdes", 
        "Inasistencia injustificada a reuniones", 
        "No ponerse al día en sus pendientes", 
        "Malograr los cuadernos u objetos personales", 
        "Faltar a la verdad", 
        "Llevarse objetos del compañero"
      ],
      "COSTOS_Y_OTROS": [
        "Impuesto escolar mensual por uso de instalaciones", 
        "Cuota extraordinaria de mantenimiento grupal", 
        "Transacción personalizada / Ajuste de caja"
      ]
    };

    window.addEventListener('DOMContentLoaded', () => {
      const parametros = new URLSearchParams(window.location.search);
      const codigoRecibido = parametros.get('codigo') || 'LDS-EST-001';
      codigoEstudianteActual = codigoRecibido.trim().toUpperCase();
      consultarDatosEstudiante(codigoEstudianteActual);
    });

    function calcularSaldoDesdeMovimientos(movs) {
      let ingresos = 0;
      let egresos = 0;
      (movs || []).forEach(function(m) {
        const tipo = String(m.tipo || m.tipoMovimiento || m['Tipo de Movimiento'] || '').trim().toUpperCase();
        const monto = Number(m.monto ?? m.montoLDS ?? m['Monto LDS'] ?? 0);
        if (!Number.isFinite(monto)) return;
        if (tipo === 'INGRESO' || tipo.includes('BONIF')) ingresos += monto;
        else if (tipo === 'EGRESO' || tipo === 'GASTO') egresos += monto;
      });
      return ingresos - egresos;
    }

    function consultarDatosEstudiante(codigo) {
      hacerPeticionJSONP({ accion: 'CONSULTAR', codigo: codigo }, function(res) {
        const datos = (res && res.data) ? res.data : ((res && res.resultado) ? res.resultado : res);
        const est = (datos && (datos.estudiante || datos.alumno)) || {};

        const encontrado = !!(est && (est.codigo || est.nombreCompleto || est.nombre || (datos && datos.encontrado === true)));

        if (encontrado) {
          const nombreCompleto = est.nombreCompleto || [est.nombre, est.apellido].filter(Boolean).join(' ') || codigo;
          document.getElementById('alumnoNombre').textContent = nombreCompleto;
          document.getElementById('alumnoGrado').textContent = [est.grado, est.seccion].filter(Boolean).join(' ');

          const cuenta = (datos && datos.cuenta) || {};
          const movimientos = (datos && Array.isArray(datos.movimientos) ? datos.movimientos : []) || [];
          const saldoBackend = Number((datos && datos.saldoActual !== undefined ? datos.saldoActual : undefined) ?? cuenta.saldoActual ?? 0);
          const saldo = movimientos.length > 0 ? calcularSaldoDesdeMovimientos(movimientos) : saldoBackend;
          
          document.getElementById('saldoLDS').textContent = (Number.isFinite(saldo) ? saldo : 0).toFixed(2);

          const fotoUrl = est.fotoUrl || est.foto || '';
          document.getElementById('alumnoFoto').src = fotoUrl.trim() !== '' ? fotoUrl.trim() : 'https://via.placeholder.com/150';

          renderizarMovimientos(movimientos);
          return;
        }

        document.getElementById('alumnoNombre').textContent = "ESTUDIANTE NO ENCONTRADO";
      });
    }

    function accionBotonPagar() {
      document.getElementById('seccionOperacion').classList.remove('hidden');
      document.getElementById('seccionMovimientos').classList.add('hidden');
      document.getElementById('tituloOperacion').textContent = "💸 REGISTRAR PAGO O GASTO";
      
      const selectCat = document.getElementById('selectCategoria');
      selectCat.innerHTML = '<option value="">SELECCIONE CATEGORÍA</option>';

      Object.keys(catalogoGlobal).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.replace(/_/g, " ");
        selectCat.appendChild(opt);
      });

      document.getElementById('selectConcepto').innerHTML = '<option value="">SELECCIONE CONCEPTO</option>';
      document.getElementById('inputMonto').value = '';
      document.getElementById('selectResponsable').value = '';
      document.getElementById('inputObservacion').value = '';
      document.getElementById('mensajeOperacion').textContent = '';
    }

    function alCambiarCategoria() {
      const cat = document.getElementById('selectCategoria').value;
      const selectCon = document.getElementById('selectConcepto');
      selectCon.innerHTML = '<option value="">SELECCIONE CONCEPTO</option>';
      if (!cat || !catalogoGlobal[cat]) return;

      catalogoGlobal[cat].forEach(con => {
        const opt = document.createElement('option');
        opt.value = con;
        opt.textContent = con;
        selectCon.appendChild(opt);
      });
    }

    function accionBotonMovimientos() {
      document.getElementById('seccionOperacion').classList.add('hidden');
      document.getElementById('seccionMovimientos').classList.remove('hidden');
    }

    function registrarMovimientoOperacion() {
      const cat = document.getElementById('selectCategoria').value;
      const con = document.getElementById('selectConcepto').value;
      const monto = document.getElementById('inputMonto').value.trim();
      const resp = document.getElementById('selectResponsable').value;
      const obs = document.getElementById('inputObservacion').value.trim();
      const msg = document.getElementById('mensajeOperacion');

      if (!cat || !con || !monto || !resp) {
        msg.style.color = "#dc2626";
        msg.textContent = "COMPLETE TODOS LOS CAMPOS OBLIGATORIOS.";
        return;
      }

      msg.style.color = "#2563eb";
      msg.textContent = "REGISTRANDO...";

      hacerPeticionJSONP({
        accion: 'REGISTRAR_TRANSACCION',
        codigo: codigoEstudianteActual,
        tipo: 'EGRESO',
        monto: monto,
        concepto: con,
        responsable: resp,
        observacion: obs
      }, function(res) {
        if (res && (res.success || res.ok)) {
          msg.style.color = "#059669";
          msg.textContent = "¡REGISTRADO CON ÉXITO!";

          hacerPeticionJSONP({ accion: 'CONSULTAR', codigo: codigoEstudianteActual }, function(data) {
            if (data) {
              const saldo = Number(data.saldoActual || data.saldo || 0);
              document.getElementById('saldoLDS').textContent = saldo.toFixed(2);
              if (data.movimientos) renderizarMovimientos(data.movimientos);
            }
          });

          setTimeout(() => {
            accionBotonMovimientos();
            msg.textContent = '';
          }, 2000);
        } else {
          msg.style.color = "#dc2626";
          msg.textContent = res.mensaje || "ERROR AL REGISTRAR.";
        }
      });
    }

    function renderizarMovimientos(movimientos) {
      const contenedor = document.getElementById('listaMovimientos');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      if (!Array.isArray(movimientos) || movimientos.length === 0) {
        contenedor.innerHTML = '<div style="color: #64748b; text-align: center; font-style: italic; padding: 40px; font-size: 0.88rem;">SIN MOVIMIENTOS RECIENTES.</div>';
        return;
      }

      movimientos.forEach(function(mov) {
        const tipo = String(mov.tipo || mov.tipoMovimiento || mov['Tipo de Movimiento'] || '').toUpperCase();
        const concepto = mov.concepto || mov.descripcion || 'MOVIMIENTO';
        const monto = Number(mov.monto ?? mov.montoLDS ?? mov['Monto LDS'] ?? 0);
        const fecha = mov.fecha || mov.timestamp || '';

        const fila = document.createElement('div');
        fila.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem;";

        const signo = tipo === 'EGRESO' || tipo === 'GASTO' ? '-' : '+';
        fila.innerHTML = `
          <div style="display: flex; flex-direction: column;">
            <strong style="color: #0c1e30;">${concepto}</strong>
            <span style="color: #64748b; font-size: 0.75rem;">${fecha}</span>
          </div>
          <div style="font-weight: 800; color: ${signo === '-' ? '#e11d48' : '#059669'};">
            ${signo} ${Math.abs(monto).toFixed(2)} LDS
          </div>
        `;
        contenedor.appendChild(fila);
      });
    }
  </script>
</body>
</html>
