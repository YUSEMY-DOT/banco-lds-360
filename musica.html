<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <audio id="audioFondo" loop autoplay>
        <source src="tu-cancion.mp3" type="audio/mpeg">
    </audio>
    <script>
        // Inicia el audio apenas el usuario haga cualquier clic o toque inicial en la pantalla
        window.addEventListener('pointerdown', () => {
            const audio = document.getElementById('audioFondo');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
</body>
</html>
