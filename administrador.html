<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BANCO LDS 360 — Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
:root {
  --azul: #0c1e30;
  --azul-claro: #1e3a8a;
  --dorado: #f59e0b;
  --fondo: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 50%, #0f172a 100%);
  --blanco: #ffffff;
  --texto: #1e293b;
  --muted: #64748b;
  --borde: #cbd5e1;
  --verde: #059669;
  --rojo: #e11d48;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  text-transform: uppercase;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
  font-size: 13px;
  line-height: 1.4;
}

header {
  background: #08121e;
  color: #fff;
  padding: 10px 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  border-bottom: 4px solid var(--dorado);
  width: 100%;
}

.header-inner {
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.brand h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 800;
  color: #ffffff;
}

.brand p {
  margin: 0;
  color: var(--dorado);
  font-size: 0.65rem;
  font-weight: 700;
}

.btn {
  border: 0;
  border-radius: 20px;
  padding: 6px 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 0.8rem;
  transition: all 0.2s ease;
  min-height: 34px;
}

.btn-light {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--dorado);
  color: #ffffff;
}

.btn-gold {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  border: 1px solid #fcd34d;
}

.btn-outline {
  background: #ffffff;
  border: 1.5px solid var(--borde);
  color: var(--azul);
}

.login-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 60px);
  padding: 15px;
  width: 100%;
}

.login-card {
  max-width: 450px;
  width: 100%;
  background: #ffffff;
  border-radius: 16px;
  padding: 25px 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  text-align: center;
  border-top: 6px solid var(--dorado);
}

.card-insignia-container {
  width: 65px;
  height: 65px;
  margin: 0 auto 12px;
  background: #ffffff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2.5px solid var(--dorado);
  overflow: hidden;
  padding: 3px;
}

.card-insignia { width: 100%; height: 100%; object-fit: contain; }

.login-card h2 {
  color: var(--azul);
  font-size: 1.2rem;
  margin-bottom: 4px;
  font-weight: 800;
}

.login-card p {
  color: var(--muted);
  font-size: 0.75rem;
  margin-bottom: 15px;
  font-weight: 600;
}

.form-group {
  text-align: left;
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--azul);
  margin-bottom: 4px;
}

.input-field, input, textarea, select {
  width: 100%;
  height: 42px;
  border: 1.5px solid #cbd5e1;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 0.85rem;
  outline: none;
  background: #f8fafc;
  color: var(--texto);
  font-family: inherit;
  font-weight: 700;
}

textarea { height: auto; padding: 10px 12px; }

.input-field:focus, input:focus, textarea:focus, select:focus {
  border-color: #0284c7;
  background: #ffffff;
}

.primary-btn {
  width: 100%;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 100%);
  color: #fff;
  font-size: 0.85rem;
  font-weight: 800;
  margin-top: 8px;
  cursor: pointer;
}

.error-msg {
  color: var(--rojo);
  font-size: 0.75rem;
  min-height: 16px;
  font-weight: 800;
  margin-top: 6px;
}

main {
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
  padding: 15px;
  display: none;
}

.admin-profile-banner {
  background: linear-gradient(145deg, #091628 0%, #050d18 100%);
  border: 2px solid var(--dorado);
  border-radius: 12px;
  padding: 12px 18px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  width: 100%;
}

.admin-profile-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.admin-avatar-wrap {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 2.5px solid var(--dorado);
  overflow: hidden;
  background: #ffffff;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.admin-avatar-img { width: 100%; height: 100%; object-fit: cover; display: none; }
.admin-avatar-placeholder { font-size: 22px; color: var(--azul); }

.admin-text-details { min-width: 0; flex: 1; }
.admin-text-details h3 { font-size: 1.05rem; color: #ffffff; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-text-details p { color: #fde68a; font-size: 0.65rem; font-weight: 700; margin: 0; }

.admin-stats-box {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

.stat-pill {
  background: rgba(3, 8, 15, 0.85);
  border: 1px solid rgba(245, 158, 11, 0.4);
  border-radius: 8px;
  padding: 7px 12px;
  text-align: center;
  min-width: 90px;
}

.stat-pill:first-child {
  min-width: 165px;
  padding: 8px 16px;
}

.stat-pill:first-child span { font-size: 0.62rem; }
.stat-pill:first-child strong { font-size: 1.35rem; line-height: 1.15; }

.stat-pill span { display: block; font-size: 0.55rem; color: #cbd5e1; font-weight: 700; }
.stat-pill strong { font-size: 0.9rem; color: #ffffff; font-weight: 800; }

.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  width: 100%;
  align-items: start;
}

.right-stack {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  min-width: 0;
  align-self: start;
}

@media(min-width: 1100px) {
  .layout {
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.75fr);
  }
}

.panel {
  background: #ffffff;
  border: 2px solid var(--dorado);
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  overflow: hidden;
  margin-bottom: 15px;
  width: 100%;
}

.panel-head {
  padding: 12px 18px;
  border-bottom: 1.5px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #f8fafc;
  user-select: none;
  flex-wrap: wrap;
  width: 100%;
}

.panel-head.clickable { cursor: pointer; }
.panel-head.clickable:hover { background: #f1f5f9; }

.panel-head h3 {
  margin: 0;
  color: var(--azul);
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
}

.toggle-icon {
  font-size: 0.75rem;
  color: var(--muted);
  transition: transform 0.2s ease;
  display: inline-block;
}

.panel.collapsed .panel-body { display: none; }
.panel.collapsed .toggle-icon { transform: rotate(-90deg); }
.panel.collapsed .panel-head { border-bottom: none; }

.stat-abono{border-color:#fbbf24 !important;background:linear-gradient(135deg,#3b2f12,#111827) !important;}
.stat-abono strong{color:#fde68a !important;font-size:1.45rem !important;}
.stat-abono span{color:#fef3c7 !important;}
.stat-disponible{border-color:#22c55e !important;background:linear-gradient(135deg,#052e16,#0f172a) !important;}
.stat-disponible strong{color:#86efac !important;font-size:1.45rem !important;}
.stat-disponible span{color:#bbf7d0 !important;}

.header-dropdown-list{
  margin:0 16px 12px;
  border:1.5px solid #f59e0b;
  border-radius:10px;
  background:#fff;
  box-shadow:0 6px 18px rgba(15,23,42,.12);
  overflow:hidden;
}

.header-dropdown-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 14px; background:#f8fafc; border-bottom:1px solid #e2e8f0;
}
.header-dropdown-head strong{font-size:.82rem;color:#0f172a;font-weight:900;}

.direct-list-head {
  background: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 100%);
  color: #f59e0b;
  padding: 10px 14px;
  font-weight: 800;
  font-size: 0.8rem;
  border-radius: 6px;
  margin-bottom: 6px;
}

.header-list-items{max-height:450px;overflow-y:auto;padding:6px;}
.header-list-row{
  display:grid; grid-template-columns:36px 105px 1fr 120px 90px; gap:8px; align-items:center;
  padding:9px 10px; border-bottom:1px solid #edf2f7; cursor:pointer; font-size:.72rem;
}
.header-list-row:hover{background:#eff6ff;}
.header-list-row:last-child{border-bottom:0;}
.header-list-row .code{font-weight:900;color:#1d4ed8;}
.header-list-row .name{font-weight:800;color:#0f172a;}
.header-list-row .meta{font-weight:700;color:#64748b;}

.pago-alumno-card{display:flex;align-items:center;gap:16px;margin:8px 0 12px;padding:10px;border:1.5px solid #bae6fd;border-radius:10px;background:#f0f9ff;}
.pago-alumno-foto{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #0ea5e9;background:#fff;}
.pago-alumno-datos{display:flex;flex-direction:column;gap:3px;min-width:0;}
.pago-alumno-datos strong{font-size:0.95rem;color:#0f172a;}
.pago-alumno-datos span{font-size:.75rem;color:#475569;font-weight:700;}
.pago-alumno-datos b{font-size:.82rem;color:#15803d;}

.header-actions-group {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: nowrap;
}

.panel-body { 
  padding: 18px;
  width: 100%;
}

.search-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.small-label {
  display: block;
  font-size: 0.75rem;
  color: var(--azul);
  margin: 8px 0 4px;
  font-weight: 800;
}

.message {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  display: none;
  font-size: 0.8rem;
  font-weight: 700;
  width: 100%;
}
.message.ok { display: block; background: #ecfdf3; color: var(--verde); border: 1px solid #a7f3d0; }
.message.error { display: block; background: #fef2f2; color: var(--rojo); border: 1px solid #fecaca; }

.table-wrap {
  width: 100%;
  max-height: 480px;
  overflow-y: auto;
  overflow-x: auto;
  margin-top: 12px;
  border: 1.5px solid var(--borde);
  border-radius: 10px;
  background: #ffffff;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  min-width: 700px;
}

th, td {
  padding: 8px 10px;
  border-bottom: 1px solid #e5eaf0;
  text-align: left;
  font-size: 0.78rem;
  vertical-align: middle;
  font-weight: 600;
  word-break: break-word;
}

th {
  background: #f1f5f9;
  color: var(--azul);
  font-size: 0.75rem;
  font-weight: 800;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 10;
}

.badge-ingreso { color: #047857; background: #ecfdf5; padding: 2px 6px; border-radius: 4px; font-weight: 800; border: 1px solid #a7f3d0; display: inline-block; }
.badge-egreso { color: #b91c1c; background: #fef2f2; padding: 2px 6px; border-radius: 4px; font-weight: 800; border: 1px solid #fecaca; display: inline-block; }
.empty { text-align: center; color: var(--muted); padding: 20px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }

.incident-list { display: grid; gap: 6px; margin-top: 8px; width: 100%; }
.incident { border: 1.5px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fafcff; width: 100%; }
.incident-top { display: flex; justify-content: space-between; gap: 6px; font-size: 0.78rem; margin-bottom: 3px; font-weight: 800; }
.badge { padding: 1px 6px; border-radius: 999px; background: #fff7df; color: #7a5d00; border: 1px solid #ead28a; font-size: 0.6rem; font-weight: 800; }

.qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(12, 30, 48, 0.88); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
.qr-modal-content { background: #ffffff; padding: 20px 15px; border-radius: 14px; max-width: 360px; width: 100%; text-align: center; border-top: 5px solid var(--dorado); }
.qr-modal-content h3 { color: var(--azul); font-size: 0.95rem; margin-bottom: 10px; font-weight: 800; }
#reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 220px; border: 1.5px solid var(--dorado); }
.close-qr-btn { margin-top: 12px; background: var(--rojo); color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 0.8rem; }

footer {
  text-align: center;
  color: #cbd5e1;
  padding: 12px;
  font-size: 0.7rem;
  font-weight: 700;
  width: 100%;
}

.mises-fotos-grid{
  display:grid;
  grid-template
