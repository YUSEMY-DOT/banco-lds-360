<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso Administrativo - Maestras · IEP La Salle del Sur</title>

  <style>
    :root {
      --azul-oscuro: #0d1b2a;
      --oro: #c99a32;
      --blanco: #ffffff;
      --gris-fondo: #f0f2f5;
      --gris-texto: #667085;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--azul-oscuro);
      background: var(--gris-fondo);
      overflow-x: hidden;
    }

    /* =========================================================
       ENCABEZADO
       ========================================================= */
    .header {
      background: var(--azul-oscuro);
      border-bottom: 4px solid var(--oro);
      color: var(--blanco);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
    }

    .back-home-btn {
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--blanco);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .back-home-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* =========================================================
       CONTENEDOR PRINCIPAL CENTRADO
       ========================================================= */
    .main-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: 80px;
      width: 100%;
      padding-left: 20px;
      padding-right: 20px;
    }

    /* =========================================================
       TARJETA DE INICIO DE SESIÓN
       ========================================================= */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--blanco);
      border-radius: 24px;
      padding: 36px 32px 28px;
      box-shadow: 0 15px 40px rgba(20, 39, 68, 0.12);
      text-align: center;
      border-top: 5px solid var(--oro);
    }

    .login-card h2 {
      color: var(--azul-oscuro);
      font-size: 24px;
      margin-bottom: 8px;
      font-family: Georgia, serif;
    }

    .login-card p {
      color: var(--gris-texto);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--azul-oscuro);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      height: 48px;
      border: 1px solid #ccd2da;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fafbfc;
      color: var(--azul-oscuro);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--azul-oscuro);
      background: var(--blanco);
      box-shadow: 0 0 0 3px rgba(20, 39, 68, 0.1);
    }

    select.input-field:invalid {
      color: var(--gris-texto);
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: var(--azul-oscuro);
      color: var(--blanco);
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      box-shadow: 0 4px 12px rgba(20, 39, 68, 0.2);
    }

    .primary-btn:hover {
      background: #1a3258;
      transform: translateY(-1px);
    }

    .error-msg {
      color: #a7192e;
      font-size: 13px;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>IEP La Salle del Sur · Panel de Administración</h1>
    <a href="index.html" class="back-home-btn" onclick="hablarTextoVoz('Volviendo al inicio')">← Volver al Inicio</a>
  </div>

  <main class="main-wrapper">
    <div class="login-card">
      <h2>Acceso Administrativo - Maestras</h2>
      <p>Seleccione su nombre institucional para iniciar turno.</p>
      
      <div class="form-group">
        <label for="docenteSelect">Docente / Maestra</label>
        <select id="docenteSelect" class="input-field" required>
          <option value="" disabled selected hidden>Seleccione su nombre</option>
          <option value="LILY">Miss Lily Melo Azañero</option>
          <option value="KIARA">Miss Kiara Morales Elguera</option>
          <option value="ANGHY">Miss Anghy Reyes Melo</option>
          <option value="KARIN">Miss Molero Romani Karin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="claveDocente">Clave de Acceso Docente</label>
        <input id="claveDocente" type="password" class="input-field" placeholder="••••••" autocomplete="off">
      </div>

      <button class="primary-btn" onclick="validarAccesoDocente()">Ingresar al Panel</button>
      <div id="adminError" class="error-msg"></div>
    </div>
  </main>

  <script>
    /* =========================================================
       SISTEMA DE VOZ INTERACTIVA (TEXT-TO-SPEECH)
       ========================================================= */
    function hablarTextoVoz(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.rate = 1.05;
        utterance.pitch = 1.25;

        const voces = window.speechSynthesis.getVoices();
        let vozIdeal = voces.find(v => 
          v.lang.startsWith('es') && (
            v.name.toLowerCase().includes('female') ||
            v.name.toLowerCase().includes('google español') ||
            v.name.toLowerCase().includes('lucia') ||
            v.name.toLowerCase().includes('monica')
          )
        );
        if (!vozIdeal) vozIdeal = voces.find(v => v.lang.startsWith('es'));
        if (vozIdeal) utterance.voice = vozIdeal;

        window.speechSynthesis.speak(utterance);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        hablarTextoVoz("Acceso administrativo de maestras. Seleccione su nombre e ingrese su clave.");
      }, 700);
    });

    // ATENCIÓN: Si tu archivo de panel tiene otro nombre, cámbialo aquí.
    // Si te sale error 404 es porque este archivo aún no existe en tu repositorio de GitHub.
    const PAGINA_PANEL = "administrador_panel.html"; 

    function validarAccesoDocente(){
      const docente = document.getElementById("docenteSelect").value;
      const clave = document.getElementById("claveDocente").value.trim();
      const error = document.getElementById("adminError");
      error.textContent = "";

      if(!docente){
        error.textContent = "Por favor, seleccione su nombre de la lista.";
        hablarTextoVoz("Por favor seleccione su nombre.");
        return;
      }
      if(!clave){
        error.textContent = "Por favor, ingrese su clave de acceso docente.";
        hablarTextoVoz("Por favor ingrese su clave.");
        return;
      }

      if(clave === "360LDS" || clave === "2026"){
        localStorage.setItem("maestraActiva", docente);
        hablarTextoVoz("Clave correcta. Redirigiendo al panel.");
        setTimeout(() => {
          window.location.href = PAGINA_PANEL;
        }, 1200);
      } else {
        error.textContent = "Clave de acceso incorrecta. Intente nuevamente.";
        hablarTextoVoz("Clave incorrecta. Intente nuevamente.");
      }
    }

    document.getElementById("claveDocente").addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        validarAccesoDocente();
      }
    });
  </script>

</body>
</html>
