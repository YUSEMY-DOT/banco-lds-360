<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Banco LDS 360 | IEP La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #071d3a;
      min-height: 100vh;
    }

    /* ENCABEZADO */
    .header {
      height: 130px;
      background: #071d3a;
      border-bottom: 4px solid #f4c400;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 4%;
      color: white;
    }

    .institution {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .shield {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }

    .institution h1 {
      font-family: Georgia, serif;
      font-size: clamp(24px, 3vw, 42px);
      line-height: 1;
    }

    .institution p {
      color: #f4c400;
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: bold;
      margin-top: 8px;
      font-size: clamp(14px, 1.5vw, 21px);
    }

    .admin {
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50px;
      padding: 16px 30px;
      font-size: 20px;
      font-weight: bold;
      background: rgba(255,255,255,.05);
      white-space: nowrap;
    }

    /* CONTENIDO */
    .main {
      min-height: calc(100vh - 130px);
      display: grid;
      grid-template-columns: 52% 48%;
    }

    .left {
      padding: 55px 7%;
      text-align: center;
      background:
        radial-gradient(#d9dfe7 1px, transparent 1px);
      background-size: 15px 15px;
    }

    .bank-title {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 35px;
    }

    .bank-building {
      width: min(220px, 30vw);
      max-height: 170px;
      object-fit: contain;
    }

    .bank-name {
      text-align: left;
      font-family: Georgia, serif;
      font-weight: bold;
      line-height: .9;
    }

    .bank-name .bank {
      display: block;
      color: #071d3a;
      font-size: clamp(48px, 5vw, 78px);
    }

    .bank-name .lds {
      display: block;
      color: #cf142b;
      font-size: clamp(48px, 5vw, 78px);
    }

    .bank-name .online {
      display: block;
      color: #071d3a;
      font-size: 18px;
      letter-spacing: 11px;
      text-align: center;
      margin-top: 15px;
    }

    .subtitle {
      font-size: clamp(20px, 2vw, 28px);
      margin: 35px auto 20px;
      max-width: 700px;
    }

    .description {
      font-size: clamp(18px, 1.6vw, 23px);
      font-weight: bold;
      line-height: 1.5;
      max-width: 700px;
      margin: auto;
    }

    /* BOTONES */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 45px;
    }

    .button {
      border-radius: 28px;
      overflow: hidden;
      background: white;
      box-shadow: 0 7px 20px rgba(0,0,0,.12);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      border: none;
      min-height: 165px;
      position: relative;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0,0,0,.18);
    }

    .button-content {
      padding: 22px;
      min-height: 115px;
    }

    .button-title {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
    }

    .button-text {
      font-size: 15px;
      text-align: left;
      line-height: 1.3;
    }

    .qr .button-title {
      color: #cf142b;
    }

    .code .button-title {
      color: #071d3a;
    }

    .button-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr .button-bottom {
      background: #cf142b;
    }

    .code .button-bottom {
      background: #071d3a;
    }

    .arrow {
      width: 50px;
      height: 50px;
      border: 4px solid white;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      line-height: 1;
    }

    /* PERSONAJES */
    .right {
      background: #092b52;
      position: relative;
      min-height: 650px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .characters {
      width: 90%;
      height: 90%;
      object-fit: contain;
      object-position: bottom center;
    }

    .security {
      position: absolute;
      bottom: 22px;
      left: 30px;
      right: 30px;
      background: rgba(255,255,255,.92);
      border-radius: 30px;
      padding: 15px 20px;
      text-align: center;
      font-weight: bold;
      color: #071d3a;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .header {
        height: auto;
        min-height: 100px;
      }

      .admin {
        padding: 12px 18px;
        font-size: 16px;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .right {
        min-height: 500px;
        order: -1;
      }

      .left {
        padding: 40px 5%;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .shield {
        width: 50px;
        height: 50px;
      }

      .institution h1 {
        font-size: 20px;
      }

      .institution p {
        font-size: 12px;
      }

      .admin {
        font-size: 13px;
        padding: 10px 13px;
      }

      .bank-title {
        flex-direction: column;
      }

      .bank-name {
        text-align: center;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .right {
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <header class="header">

    <div class="institution">

      <img
        class="shield"
        src="assets/escudo.png"
        alt="Escudo IEP La Salle del Sur"
      >

      <div>
        <h1>IEP LA SALLE DEL SUR</h1>
        <p>Formamos personas íntegras</p>
      </div>

    </div>

    <div class="admin">
      🔐 &nbsp;Administrador
    </div>

  </header>


  <!-- CONTENIDO PRINCIPAL -->
  <main class="main">

    <section class="left">

      <div class="bank-title">

        <img
          class="bank-building"
          src="assets/banco.png"
          alt="Banco LDS 360"
        >

        <div class="bank-name">
          <span class="bank">BANCO</span>
          <span class="lds">LDS 360</span>
          <span class="online">ONLINE</span>
        </div>

      </div>

      <p class="subtitle">
        Sistema financiero educativo
      </p>

      <p class="description">
        Consulta de forma rápida y segura
        <br>
        la información financiera del estudiante.
      </p>


      <!-- BOTONES -->
      <div class="buttons">

        <button class="button qr" onclick="abrirEscaner()">

          <div class="button-content">

            <div class="button-title">
              📷<br>
              ESCANEAR<br>
              CÓDIGO QR
            </div>

            <div class="button-text">
              Escanea el código del estudiante para consultar su información.
            </div>

          </div>

          <div class="button-bottom">
            <div class="arrow">›</div>
          </div>

        </button>


        <button class="button code" onclick="ingresarCodigo()">

          <div class="button-content">

            <div class="button-title">
              🔢<br>
              INGRESAR<br>
              CÓDIGO
            </div>

            <div class="button-text">
              Ingresa el código del estudiante para consultar su información.
            </div>

          </div>

          <div class="button-bottom">
            <div class="arrow">›</div>
          </div>

        </button>

      </div>

    </section>


    <!-- PERSONAJES -->
    <section class="right">

      <img
        class="characters"
        src="assets/personajes.png"
        alt="Estudiantes La Salle"
      >

      <div class="security">
        🛡️ Sistema seguro, confiable y diseñado para el bienestar financiero de nuestros estudiantes.
      </div>

    </section>

  </main>


  <script>

    function abrirEscaner() {
      alert("Aquí conectaremos el escáner QR automático 📷");
    }

    function ingresarCodigo() {
      const codigo = prompt("Ingrese el código del estudiante:");

      if (codigo) {
        alert("Código recibido: " + codigo);
      }
    }

  </script>

</body>
</html>
