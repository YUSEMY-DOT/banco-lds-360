<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCO LDS 360 - Portal Estudiante</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/html5-qrcode"></script>
  <script defer src="app.js"></script>
</head>
<body class="bg-blue-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

  <header class="bg-blue-800 text-white p-4 shadow-md text-center">
    <h1 class="text-xl font-bold">BANCO LDS 360</h1>
    <p class="text-xs text-blue-200">IEP La Salle del Sur</p>
  </header>

  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">
    
    <div id="vistaLogin" class="bg-white p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-center text-lg font-bold text-gray-700">Acceso del Estudiante</h2>
      
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Código de Estudiante</label>
        <input 
          type="text" 
          id="loginCodigo" 
          placeholder="LDS-EST-001" 
          class="w-full border rounded-xl p-3 uppercase focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Clave de Acceso</label>
        <input 
          type="password" 
          id="loginClave" 
          placeholder="••••" 
          class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>

      <button 
        onclick="procesarLoginAlumno()" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg"
      >
        Ingresar
      </button>
    </div>

    <div id="vistaPrincipal" class="hidden space-y-4">
      
      <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-xs text-blue-200 uppercase font-semibold">Saldo Disponible</p>
            <h3 class="text-3xl font-extrabold mt-1"><span id="saldoLDS">0.00</span> <span class="text-sm font-normal">LDS</span></h3>
          </div>
          <img 
            id="alumnoFoto" 
            src="https://via.placeholder.com/100" 
            alt="Foto" 
            class="w-16 h-16 rounded-full border-2 border-white object-cover shadow"
          />
        </div>
        <p id="alumnoNombre" class="mt-4 font-medium text-sm text-blue-100">Cargando...</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="prepararTransaccion('PAGAR')" class="bg-rose-500 hover:bg-rose-600 text-white p-3 rounded-xl font-bold shadow text-center transition">
          💸 Pagar
        </button>
        <button onclick="prepararTransaccion('COBRAR')" class="bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl font-bold shadow text-center transition">
          🪙 Cobrar
        </button>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow space-y-3">
        <h4 class="font-bold text-gray-700 text-sm">Últimos Movimientos</h4>
        <div id="listaMovimientos" class="space-y-2 max-h-48 overflow-y-auto text-sm">
          <p class="text-gray-400 text-center italic py-2">Sin movimientos recientes.</p>
        </div>
      </div>

      <button onclick="cerrarSesionAlumno()" class="w-full text-center text-xs text-gray-500 underline py-2">
        Cerrar Sesión
      </button>
    </div>

  </main>

  <footer class="text-center py-3 text-xs text-gray-400">
    KIDSWork LS - Todos los derechos reservados
  </footer>

  <script>
    function procesarLoginAlumno() {
      const codigo = document.getElementById('loginCodigo').value.trim();
      const clave = document.getElementById('loginClave').value.trim();

      if (!codigo || !clave) return alert("Por favor complete todos los campos.");

      // Se envía la clave exacta, sin encriptar, tal como está en tu base de datos
      if (typeof ejecutarLoginSistema === 'function') {
        ejecutarLoginSistema(codigo, clave, funcionRespuestaLogin);
      }
    }

    function funcionRespuestaLogin(res) {
      if (res && res.success) {
        document.getElementById('vistaLogin').classList.add('hidden');
        document.getElementById('vistaPrincipal').classList.remove('hidden');

        document.getElementById('alumnoNombre').textContent = res.nombre || 'Estudiante';
        document.getElementById('saldoLDS').textContent = res.saldo || '0.00';

        if (res.foto) {
          document.getElementById('alumnoFoto').src = res.foto.includes('googleusercontent.com') 
            ? res.foto.split('=')[0] + '=s150' 
            : res.foto;
        }

        renderizarMovimientos(res.movimientos || []);
      } else {
        alert(res.message || "Credenciales incorrectas.");
      }
    }

    function renderizarMovimientos(movs) {
      const contenedor = document.getElementById('listaMovimientos');
      contenedor.innerHTML = '';

      if (movs.length === 0) {
        contenedor.innerHTML = '<p class="text-gray-400 text-center italic py-2">Sin movimientos recientes.</p>';
        return;
      }

      movs.forEach(m => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center p-2 rounded-lg bg-gray-50 border-l-4 " + 
          (m.tipo === 'COBRAR' ? 'border-emerald-500' : 'border-rose-500');
        item.innerHTML = `
          <div>
            <p class="font-bold text-xs text-gray-800">${m.concepto}</p>
            <p class="text-[10px] text-gray-400">${m.fecha}</p>
          </div>
          <span class="font-extrabold ${m.tipo === 'COBRAR' ? 'text-emerald-600' : 'text-rose-600'}">
            ${m.tipo === 'COBRAR' ? '+' : '-'}${m.monto} LDS
          </span>
        `;
        contenedor.appendChild(item);
      });
    }

    function prepararTransaccion(tipo) {
      const monto = prompt(`Ingrese el monto a ${tipo}:`);
      if (!monto || isNaN(monto)) return;

      const concepto = prompt("Concepto o motivo:");
      const codigo = document.getElementById('loginCodigo').value.trim();

      if (typeof registrarTransaccionSistema === 'function') {
        registrarTransaccionSistema(codigo, tipo, monto, concepto, function(res) {
          if (res.success) {
            alert("Operación realizada con éxito.");
            document.getElementById('saldoLDS').textContent = res.nuevoSaldo;
          } else {
            alert("Error al procesar operación.");
          }
        });
      }
    }

    function cerrarSesionAlumno() {
      document.getElementById('vistaPrincipal').classList.add('hidden');
      document.getElementById('vistaLogin').classList.remove('hidden');
      document.getElementById('loginClave').value = '';
    }
  </script>
</body>
</html>
