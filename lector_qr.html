<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142744">

  <title>Banco LDS 360 · Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    :root{
      --azul:#142744;
      --rojo:#a7192e;
      --oro:#c99a32;
      --gris:#eef1f5;
      --texto:#18243b;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:#0d1a30;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(720px,100%);
      background:#fff;
      color:var(--texto);
      border-radius:28px;
      padding:28px;
      box-shadow:0 25px 80px rgba(0,0,0,.35);
    }

    .head{
      text-align:center;
    }

    .head h1{
      margin:0;
      color:var(--azul);
      font-size:32px;
    }

    .head p{
      color:#667085;
      font-size:17px;
      line-height:1.4;
      margin:10px auto 22px;
      max-width:580px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:20px;
      background:#081427;
    }

    #status{
      text-align:center;
      color:#667085;
      font-size:15px;
      line-height:1.4;
      margin:16px 0 0;
      min-height:24px;
    }

    .error{
      color:var(--rojo)!important;
    }

    .success{
      color:#15803d!important;
      font-weight:700;
    }

    .fallback{
      margin-top:18px;
      padding:18px;
      border-radius:18px;
      background:var(--gris);
      text-align:center;
      display:none;
    }

    .fallback p{
      margin:0 0 12px;
      color:#667085;
    }

    .btn{
      border:0;
      border-radius:12px;
      background:var(--azul);
      color:#fff;
      padding:13px 20px;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
    }

    .btn.secondary{
      background:#fff;
      color:var(--azul);
      border:1px solid #cbd5e1;
    }

    .row{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    input{
      width:min(420px,100%);
      height:50px;
      border:1px solid #ccd2da;
      border-radius:12px;
      padding:0 14px;
      font-size:17px;
    }

    .mini{
      margin-top:18px;
      text-align:center;
      color:#7b8494;
      font-size:13px;
    }

    /* Ajuste para celulares */
    @media (max-width:600px){
      body{
        padding:12px;
      }

      .card{
        width:100%;
        border-radius:22px;
        padding:20px;
      }

      .head h1{
        font-size:26px;
      }

      .head p{
        font-size:15px;
      }

      #reader{
        min-height:280px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="head">
      <h1>Escanear código QR</h1>

      <p>
        Apunta la cámara al código QR del estudiante.
        Al leerlo, volverás automáticamente a Banco LDS 360 Online.
      </p>
    </div>

    <div id="reader"></div>

    <div id="status">
      Preparando cámara…
    </div>

    <div id="fallback" class="fallback">

      <p>
        Si tu dispositivo no permite abrir la cámara,
        también puedes ingresar el código manualmente.
      </p>

      <div class="row">

        <input
          id="manualCode"
          placeholder="Ejemplo: LDS-EST-001"
          autocomplete="off"
        >

        <button
          class="btn"
          onclick="enviarCodigoManual()"
        >
          Continuar
        </button>

      </div>

    </div>

    <div class="mini">
      Lector QR externo seguro · HTTPS
    </div>

  </div>


<script>

  let scanner = null;
  let started = false;


  /*
   * Obtiene la dirección de Banco LDS 360
   * a la que debemos regresar después de leer el QR.
   */
  function getReturnUrl(){

    const params = new URLSearchParams(location.search);

    const r = params.get('return');

    if(r){

      try{
        return decodeURIComponent(r);
      }catch(e){
        return r;
      }

    }

    return '';
  }


  /*
   * Limpia y normaliza el código QR.
   */
  function extractCode(raw){

    const text = String(raw || '').trim();

    const match = text.match(
      /LDS[-_ ]EST[-_ ]\d+/i
    );

    if(match){

      return match[0]
        .replace(/_/g,'-')
        .replace(/ /g,'-')
        .toUpperCase();

    }

    return text.toUpperCase();
  }


  /*
   * Envía el código leído
   * nuevamente a Banco LDS 360.
   */
  function sendCode(raw){

    const code = extractCode(raw);

    if(!code){
      return;
    }

    const returnUrl = getReturnUrl();


    /*
     * Si no existe una dirección de regreso,
     * solamente mostramos el código.
     */
    if(!returnUrl){

      document.getElementById('status').textContent =
        'Código leído: ' + code;

      document.getElementById('status').className =
        'success';

      return;
    }


    let target = returnUrl;

    const join =
      target.includes('?') ? '&' : '?';

    target +=
      join +
      'codigo=' +
      encodeURIComponent(code);


    document.getElementById('status').textContent =
      'Código leído. Regresando al sistema…';

    document.getElementById('status').className =
      'success';


    stopScanner();


    setTimeout(() => {

      location.replace(target);

    },450);

  }


  /*
   * Cambia el mensaje debajo del lector.
   */
  function setStatus(text, cls=''){

    const s =
      document.getElementById('status');

    s.textContent = text;

    s.className = cls;
  }


  /*
   * Detiene la cámara.
   */
  function stopScanner(){

    try{

      if(scanner){

        scanner.clear().catch(() => {});

      }

    }catch(e){}

    started = false;
  }


  /*
   * INICIO DEL LECTOR QR
   *
   * IMPORTANTE:
   * Usamos facingMode: "environment"
   * para solicitar directamente la cámara
   * trasera del teléfono.
   */
  function startScanner(){

    if(started){
      return;
    }


    /*
     * Comprobamos que la librería
     * html5-qrcode haya cargado.
     */
    if(typeof Html5Qrcode === 'undefined'){

      setStatus(
        'No se pudo cargar el lector QR. Recarga esta página.',
        'error'
      );

      document.getElementById('fallback')
        .style.display = 'block';

      return;
    }


    /*
     * Creamos el lector.
     */
    scanner = new Html5Qrcode('reader');

    started = true;


    /*
     * SOLICITAMOS DIRECTAMENTE
     * LA CÁMARA TRASERA.
     */
    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0
      },


      /*
       * Cuando encuentra un QR.
       */
      decodedText => {

        sendCode(decodedText);

      },


      /*
       * Mientras busca el QR.
       * No mostramos errores de lectura
       * continuamente.
       */
      () => {}

    )

    .then(() => {

      setStatus(
        'Cámara activa. Apunta al código QR.'
      );

    })

    .catch(err => {

      console.error(
        'ERROR DE CÁMARA:',
        err
      );

      started = false;

      setStatus(
        'No se pudo abrir la cámara. Verifica el permiso del navegador.',
        'error'
      );

      document.getElementById('fallback')
        .style.display = 'block';

    });

  }


  /*
   * Entrada manual del código.
   */
  function enviarCodigoManual(){

    const code =
      document
        .getElementById('manualCode')
        .value
        .trim();


    if(!code){

      setStatus(
        'Ingresa un código.',
        'error'
      );

      return;
    }


    sendCode(code);

  }


  /*
   * Arrancamos automáticamente
   * cuando la página termina de cargar.
   */
  window.addEventListener(
    'load',
    () => {

      setTimeout(
        startScanner,
        350
      );

    }
  );

</script>

</body>
</html>
