      <!-- ICONO / ILUSTRACIÓN CENTRAL -->
      <div class="w-32 h-32 mx-auto bg-gradient-to-tr from-amber-400 via-yellow-400 to-sky-500 rounded-full p-1 shadow-2xl flex items-center justify-center">
        <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-6xl shadow-inner animate-pulse">

        </div>
      </div>

      <!-- PANEL DE BOTONES ORIGINALES -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-4">
        
        <!-- Botón 1: Escanea QR -->
        <button onclick="ejecutarAccion('qr')" class="bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 p-4 rounded-2xl shadow-lg border border-sky-400/30 flex items-center justify-between text-left transition transform active:scale-95 group">

              <h3 class="font-black text-white text-sm">Escanea QR</h3>
              <p class="text-[11px] text-sky-200">Presiona aquí para leer tu código</p>

          </div>

        <!-- Botón 2: Ingresa código -->
        <button onclick="ejecutarAccion('codigo')" class="bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 p-4 rounded-2xl shadow-lg border border-purple-400/30 flex items-center justify-between text-left transition transform active:scale-95 group">

            </div>
            <div>
              <h3 class="font-black text-white text-sm">Ingresa código</h3>
              <p class="text-[11px] text-purple-200">Si no puedes escanear digital</p>
            </div>
          </div>
          <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center font-bold">›</span>

        <!-- Botón 3: Tienda escolar -->
        <button onclick="ejecutarAccion('tienda')" class="bg-gradient-to-r from-rose-600 to-pink-700 hover:from-rose-500 hover:to-pink-600 p-4 rounded-2xl shadow-lg border border-rose-400/30 flex items-center justify-between text-left transition transform active:scale-95 group">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition">
              🛍️
            </div>
            <div>
              <h3 class="font-black text-white text-sm">Tienda escolar</h3>
              <p class="text-[11px] text-rose-200">Canjea tus LDS Coins</p>
            </div>
          </div>
          <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center font-bold">›</span>
        </button>

        <!-- Botón 4: Padres -->
        <button onclick="ejecutarAccion('padres')" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 p-4 rounded-2xl shadow-lg border border-amber-400/30 flex items-center justify-between text-left transition transform active:scale-95 group">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition">

        <!-- Botón 5: Manual de sistema -->
        <button onclick="ejecutarAccion('manual')" class="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 p-4 rounded-2xl shadow-lg border border-emerald-400/30 flex items-center justify-between text-left transition transform active:scale-95 group sm:col-span-2 lg:col-span-1">

              📖

            <div>
              <h3 class="font-black text-white text-sm">Manual de sistema</h3>
              <p class="text-[11px] text-emerald-200">Guía de uso del banco</p>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="text-center py-4 text-xs text-slate-500 bg-slate-900/50 border-t border-slate-800">
    © IEP La Salle del Sur — Banco LDS 360
  </footer>

  <!-- SCRIPT INTEGRADO: MÚSICA LIRA/TAMBOR + VOZ INSTITUCIONAL -->
  <script>
    let audioCtx = null;
    let iniciado = false;

    const FREQS = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
      "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
    };

    const llamadaAtencion = [
      { n: "C4", d: 0.3 }, { n: "E4", d: 0.3 }, { n: "G4", d: 0.5 }, { n: "C5", d: 0.8 }
    ];

    const himnoMelodia = [
      { n: "C4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.7 },
      { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.7 }, { n: "C4", d: 0.7 },
      { n: "D4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "A4", d: 0.7 }, { n: "A4", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 }, { n: "D4", d: 0.7 },
      { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "C5", d: 0.7 }, { n: "C5", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },
      { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.7 },
      { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "C4", d: 1.5 }
    ];

    function sonarLira(ctx, freq, t, dur) {
      if (!freq) return;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 2, t);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.5);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + dur * 1.5);
      osc2.stop(t + dur * 1.5);
    }

    function sonarTambor(ctx, t) {
      const bufferSize = ctx.sampleRate * 0.04;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
    }

    function reproducirMusicaCompleta(ctx) {
      let t = ctx.currentTime + 0.1;
      llamadaAtencion.forEach(item => {
        const f = FREQS[item.n] || 261.63;
        sonarLira(ctx, f, t, item.d);
        sonarTambor(ctx, t);
        t += item.d;
      });
      t += 0.2;
      himnoMelodia.forEach(item => {
        const f = FREQS[item.n] || 261.63;
        sonarLira(ctx, f, t, item.d);
        sonarTambor(ctx, t);
        t += item.d;
      });
    }

    async function iniciarSecuenciaInstitucional() {
      if (iniciado) return;
      iniciado = true;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      reproducirMusicaCompleta(audioCtx);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const textoCompleto = "Bienvenidos a tu entidad financiera LDS 360, La Salle del Sur. Sencillez, responsabilidad y honor. Aprendiendo con metas y valores, cual nos diste tú mi gran maestro. Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad. Como siempre un paso adelante.";
        
        const vozInstitucional = new SpeechSynthesisUtterance(textoCompleto);
        vozInstitucional.lang = 'es-PE';
        vozInstitucional.rate = 0.88;
        vozInstitucional.pitch = 0.95;
        window.speechSynthesis.speak(vozInstitucional);
      }
    }

    function ejecutarAccion(tipo) {
      iniciarSecuenciaInstitucional();
      // Aquí puedes enlazar la lógica de navegación de tus botones originales
      console.log("Acción ejecutada:", tipo);
    }

    function abrirAdministrador() {
      iniciarSecuenciaInstitucional();
      // Lógica del panel de administración
      console.log("Abriendo administrador...");
    }

    // Activar audio al primer toque o clic en cualquier parte de la pantalla
    document.addEventListener('touchstart', iniciarSecuenciaInstitucional, { once: true });
    document.addEventListener('click', iniciarSecuenciaInstitucional, { once: true });
  </script>
</body>
