<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - IEP La Salle del Sur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* 1. Fondo de toda la página con la imagen del Banco */
        body {
            background: linear-gradient(rgba(12, 30, 48, 0.40), rgba(12, 30, 48, 0.40)), 
                        url('assets/banco.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333333;
            overflow-x: hidden;
        }

        /* Barra Superior Institucional */
        header {
            background-color: #0c1e30;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .school-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-info img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .school-text h3 {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .school-text p {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
            font-style: italic;
        }

        .admin-btn {
            background: #152b42;
            border: 2px solid #f1c40f;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #203f61;
        }

        /* Contenedor Principal (Alineado al filo inferior) */
        .main-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Alineación perfecta al filo inferior */
            padding: 10px 20px 0px 20px;
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            gap: 0px;
            z-index: 2;
        }

        /* Tarjeta Amarillo Claro Traslúcida sentada al filo */
        .portal-card {
            background: rgba(254, 249, 231, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px 18px 24px 18px;
            border-radius: 26px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
            border: 3px solid rgba(255, 235, 116, 0.9);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px; /* Bajado al filo */
        }

        .bank-title {
            font-size: 1.85rem;
            color: #00796b;
            font-weight: 800;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .bank-subtitle {
            font-size: 0.82rem;
            color: #00897b;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Fila Superior: Botón QR | Niña Dinero | Botón Ingreso */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            margin-bottom: 16px;
        }

        .img-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            flex: 1;
            width: 100%;
        }

        /* Botones de QR y Código en TAMAÑO MÁS GRANDE */
        .top-row .img-btn img {
            width: 100%;
            height: 76px; /* Altura aumentada para hacerlos más grandes */
            object-fit: contain;
            display: block;
        }

        .img-btn:hover {
            transform: scale(1.04);
            filter: brightness(1.04);
        }

        .center-girl-img {
            width: 165px;
            height: auto;
            flex-shrink: 0;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.22));
        }

        /* Fila Inferior: Botón Tienda | Botón Padres | Botón Manual */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            align-items: stretch;
        }

        .bottom-row .img-btn img {
            width: 100%;
            height: 52px;
            object-fit: fill;
            border-radius: 12px;
        }

        /* Ilustración de la derecha (Profesora y Alumna asentadas al filo) */
        .right-illustration {
            max-width: 360px;
            width: 100%;
            height: auto;
            object-fit: contain;
            margin-bottom: 0px; /* Bajada al filo */
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.3));
        }

        /* Pie de página */
        footer {
            background-color: #0c1e30;
            text-align: center;
            padding: 12px;
            font-size: 0.82rem;
            color: #ffffff;
            font-weight: 600;
            border-top: 3px solid #f1c40f;
            z-index: 10;
        }

        @media (max-width: 950px) {
            .main-container {
                flex-direction: column;
                padding: 20px 15px 0px 15px;
                gap: 20px;
                align-items: center;
            }
            .portal-card {
                margin-bottom: 0;
            }
            .right-illustration {
                max-width: 280px;
            }
        }

        @media (max-width: 600px) {
            .top-row {
                flex-direction: column;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
            .top-row .img-btn img {
                height: 65px;
            }
            .center-girl-img {
                width: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- Audio del Himno Institucional (M4A integrado para inicio automático) -->
    <audio id="bgMusic" autoplay loop preload="auto">
        <source src="himno.m4a" type="audio/mp4">
        <source src="assets/himno.m4a" type="audio/mp4">
        <source src="assets/himno.mp3" type="audio/mpeg">
    </audio>

    <!-- Header con Insignia Oficial y Administrador -->
    <header>
        <div class="school-info">
            <img src="assets/insignia.png" alt="Insignia La Salle del Sur">
            <div class="school-text">
                <h3>IEP LA SALLE DEL SUR</h3>
                <p>Formamos personas íntegras</p>
            </div>
        </div>
        <a href="admin.html" class="admin-btn">
            🔒 Administrador
        </a>
    </header>

    <!-- Contenedor Principal -->
    <div class="main-container">
        
        <!-- Cuadro Amarillo Claro Traslúcido del Banco (Sentado al filo) -->
        <div class="portal-card">
            <h1 class="bank-title">BANCO LDS 360</h1>
            <p class="bank-subtitle">Sistema Financiero Educativo y de Convivencia Escolar</p>

            <!-- Fila Superior: Botón QR (Más Grande) | Niña Dinero | Botón Ingreso (Más Grande) -->
            <div class="top-row">
                <a href="qr.html" class="img-btn">
                    <img src="assets/qr.png" alt="Escanea QR">
                </a>

                <img src="assets/dinero.png" alt="Niña Banco LDS" class="center-girl-img">

                <a href="codigo.html" class="img-btn">
                    <img src="assets/ingreso.png" alt="Ingresa código">
                </a>
            </div>

            <!-- Fila Inferior: Botón Tienda | Botón Padres | Botón Manual -->
            <div class="bottom-row">
                <a href="tienda.html" class="img-btn">
                    <img src="assets/tienda.png" alt="Tienda escolar">
                </a>

                <a href="padres.html" class="img-btn">
                    <img src="assets/padres.png" alt="Padres">
                </a>

                <a href="manual.html" class="img-btn">
                    <img src="assets/manual.png" alt="Manual de sistema">
                </a>
            </div>
        </div>

        <!-- Ilustración de la Derecha (Profesora y Alumna asentadas al filo) -->
        <img src="assets/observando.png" alt="Profesora y Alumna La Salle del Sur" class="right-illustration">

    </div>

    <!-- Footer -->
    <footer>
        Lima - Perú | IEP La Salle del Sur — Todos los derechos reservados
    </footer>

    <!-- Script de Reproducción Automática de Audio y Lectura del Himno -->
    <script>
        const music = document.getElementById('bgMusic');

        function iniciarAudio() {
            if (music) {
                music.play().catch(e => console.log("Esperando interacción para audio"));
            }
        }

        window.addEventListener('load', () => {
            iniciarAudio();

            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    window.speechSynthesis.cancel();
                    
                    const textoHimno = "¡Bienvenidos al Banco Lasallista 360! Aprendiendo con metas y valores, cual nos diste tú mi gran maestro. Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad. Sencillez, responsabilidad y honor es el lema que tú nos enseñaste.";
                    const utterance = new SpeechSynthesisUtterance(textoHimno);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.95;
                    utterance.pitch = 1.05;

                    const voices = window.speechSynthesis.getVoices();
                    const vozEspanol = voices.find(v => v.lang.includes('es') && (v.name.includes('Elena') || v.name.includes('Monica') || v.name.includes('Lucia') || v.name.includes('Google') || v.name.includes('Sabrina')));
                    if (vozEspanol) {
                        utterance.voice = vozEspanol;
                    }

                    utterance.onend = function() {
                        iniciarAudio();
                    };

                    window.speechSynthesis.speak(utterance);
                }, 600);
            }
        });

        document.addEventListener('click', iniciarAudio, { once: true });
        document.addEventListener('touchstart', iniciarAudio, { once: true });
    </script>
</body>
</html>
