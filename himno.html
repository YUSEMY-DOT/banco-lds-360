<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himno Instrumental - IEP La Salle del Sur</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-950 via-slate-900 to-indigo-950 text-white min-h-screen flex flex-col justify-between p-4 font-sans select-none">

  <!-- ENCABEZADO -->
  <header class="text-center py-6">
    <div class="inline-block bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-4 py-1 rounded-full font-bold uppercase tracking-widest mb-2">
      Edición Instrumental & Banda Escolar
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-amber-400 uppercase tracking-wider drop-shadow-md">
      IEP La Salle del Sur
    </h1>
    <p class="text-xs sm:text-sm text-slate-300 mt-1 font-medium">Guía Melódica de Marcha Institucional</p>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL REPRODUCTOR -->
  <main class="max-w-md mx-auto w-full bg-slate-800/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-slate-700/80 space-y-8 my-auto text-center">
    
    <div class="w-28 h-28 mx-auto bg-gradient-to-tr from-amber-500 to-indigo-600 rounded-full p-1 shadow-xl flex items-center justify-center">
      <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-4xl shadow-inner">
        🎺
      </div>
    </div>

    <!-- BOTONES DE CONTROL -->
    <div class="space-y-3 pt-2">
      <button 
        id="btnPlay" 
        onclick="iniciarReproduccion()" 
        class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center gap-3"
      >
        <span class="text-2xl">▶</span> Reproducir Melodía del Himno
      </button>

      <button 
        id="btnStop" 
        onclick="detenerReproduccion()" 
        class="w-full bg-gradient-to-r from-rose-600 to-red-700 hover:from-rose-500 hover:to-red-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-base hidden flex items-center justify-center gap-2"
      >
        <span>⏹</span> Detener Música
      </button>
    </div>

    <p id="estadoAudio" class="text-xs text-amber-300 font-medium">
      Haz clic en el botón verde para escuchar la música.
    </p>

  </main>

  <footer class="text-center py-4 text-xs text-slate-500">
    © IEP La Salle del Sur — Panel de Música Institucional
  </footer>

  <!-- SINTETIZADOR DIRECTO DE AUDIO -->
  <script>
    let audioCtx = null;
    let timerID = null;
    let sonando = false;

    async function iniciarReproduccion() {
      if (sonando) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Activación de permisos de audio para móviles y navegadores
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        sonando = true;
        document.getElementById('btnPlay').classList.add('hidden');
        document.getElementById('btnStop').classList.remove('hidden');
        document.getElementById('estadoAudio').textContent = "🎵 Reproduciendo marcha escolar...";

        // Frecuencias exactas en Hz (Sol Mayor)
        const G4 = 392.00, A4 = 440.00, B4 = 493.88, C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99;
        const G2 = 98.00, D3 = 146.83, C3 = 130.81;

        // Partitura: [Frecuencia Melodía, Frecuencia Bajo, Duración]
        const secuencia = [
          // Fanfarria alegre
          [G5, G2, 0.3], [G5, G2, 0.3], [G5, G2, 0.3], [A4, D3, 0.3], [B4, G2, 0.6],
          
          // Melodía principal
          [G4, G2, 0.4], [G4, G2, 0.4], [G4, G2, 0.4], [A4, D3, 0.4], [B4, G2, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.8],
          [B4, G2, 0.4], [C5, C3, 0.4], [D5, D3, 0.4], [D5, D3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.8],
          [C5, C3, 0.4], [C5, C3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.4], [A4, D3, 0.4], [B4, G2, 0.4], [C5, C3, 0.4], [D5, D3, 0.8],
          [D5, D3, 0.4], [E5, C3, 0.4], [D5, D3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 1.0],

          // Estrofa
          [C5, C3, 0.4], [C5, C3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.4], [A4, D3, 0.4], [B4, G2, 0.4],
          [B4, G2, 0.4], [C5, C3, 0.4], [D5, D3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.8],
          [G4, G2, 0.4], [A4, D3, 0.4], [B4, G2, 0.4], [C5, C3, 0.4], [D5, D3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.8],

          // Cierre
          [C5, C3, 0.4], [C5, C3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 0.4], [A4, D3, 0.4], [B4, G2, 0.4], [C5, C3, 0.4], [D5, D3, 0.8],
          [D5, D3, 0.4], [E5, C3, 0.4], [D5, D3, 0.4], [C5, C3, 0.4], [B4, G2, 0.4], [A4, D3, 0.4], [G4, G2, 1.2]
        ];

        let t = audioCtx.currentTime + 0.1;

        secuencia.forEach(([mFreq, bFreq, dur]) => {
          // Sonido de Lira / Vientos
          sonarOscilador(audioCtx, mFreq, t, dur, 'triangle', 0.4);
          // Sonido de Acompañamiento Bajo
          sonarOscilador(audioCtx, bFreq, t, dur, 'sine', 0.3);

          t += dur;
        });

        const tiempoTotal = (t - audioCtx.currentTime) * 1000;
        timerID = setTimeout(() => {
          detenerReproduccion();
        }, tiempoTotal);

      } catch (e) {
        alert("Error al iniciar el audio: " + e.message);
      }
    }

    function sonarOscilador(ctx, freq, inicio, duracion, tipo, vol) {
      if (!freq) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = tipo;
      osc.frequency.setValueAtTime(freq, inicio);

      gain.gain.setValueAtTime(vol, inicio);
      gain.gain.exponentialRampToValueAtTime(0.0001, inicio + duracion - 0.02);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(inicio);
      osc.stop(inicio + duracion);
    }

    function detenerReproduccion() {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (timerID) clearTimeout(timerID);
      sonando = false;

      document.getElementById('btnPlay').classList.remove('hidden');
      document.getElementById('btnStop').classList.add('hidden');
      document.getElementById('estadoAudio').textContent = "Haz clic en el botón verde para escuchar la música.";
    }
  </script>
</body>
</html>
