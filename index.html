<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - IEP La Salle del Sur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #828e9d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333333;
            overflow-x: hidden;
        }

        /* Barra Superior Institucional */
        header {
            background-color: #0c1e30;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .school-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-info img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .school-text h3 {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .school-text p {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
            font-style: italic;
        }

        .admin-btn {
            background: #152b42;
            border: 2px solid #f1c40f;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #203f61;
        }

        /* Contenedor Principal */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            gap: 40px;
        }

        /* Tarjeta Blanca Principal */
        .portal-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 28px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            border: 3px solid #b2dfdb;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bank-title {
            font-size: 2.2rem;
            color: #00796b;
            font-weight: 800;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .bank-subtitle {
            font-size: 0.9rem;
            color: #00897b;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Botones como imágenes directas con efecto suave al presionar o pasar el mouse */
        .img-btn {
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            flex: 1;
        }

        .img-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        .img-btn:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        /* Fila Superior */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 25px;
        }

        .center-girl-img {
            width: 110px;
            height: auto;
            flex-shrink: 0;
            object-fit: contain;
        }

        /* Fila Inferior */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        /* Ilustración de la derecha (Profesora y Alumna) */
        .right-illustration {
            max-width: 440px;
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.25));
        }

        /* Pie de página */
        footer {
            background-color: #0c1e30;
            text-align: center;
            padding: 12px;
            font-size: 0.82rem;
            color: #ffffff;
            font-weight: 600;
            border-top: 3px solid #f1c40f;
        }

        @media (max-width: 950px) {
            .main-container {
                flex-direction: column;
                padding: 20px 15px;
            }
            .right-illustration {
                max-width: 320px;
            }
        }

        @media (max-width: 600px) {
            .top-row {
                flex-direction: column;
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Audio del Himno institucional -->
    <audio id="bgMusic" loop>
        <source src="assets/himno.mp3" type="audio/mpeg">
    </audio>

    <!-- Header con Insignia Oficial y Administrador -->
    <header>
        <div class="school-info">
            <img src="assets/insignia.png" alt="Insignia La Salle del Sur">
            <div class="school-text">
                <h3>IEP LA SALLE DEL SUR</h3>
                <p>Formamos personas íntegras</p>
            </div>
        </div>
        <a href="admin.html" class="admin-btn">
            🔒 Administrador
        </a>
    </header>

    <!-- Contenedor Principal -->
    <div class="main-container">
        
        <!-- Cuadro Blanco del Banco -->
        <div class="portal-card">
            <h1 class="bank-title">BANCO LDS 360</h1>
            <p class="bank-subtitle">Sistema Financiero Educativo y de Convivencia Escolar</p>

            <!-- Fila Superior: Botón QR | Niña Dinero | Botón Ingreso -->
            <div class="top-row">
                <a href="qr.html" class="img-btn">
                    <img src="assets/qr.png" alt="Escanea QR">
                </a>

                <img src="assets/dinero.png" alt="Niña Banco LDS" class="center-girl-img">

                <a href="codigo.html" class="img-btn">
                    <img src="assets/ingreso.png" alt="Ingresa código">
                </a>
            </div>

            <!-- Fila Inferior: Botón Tienda | Botón Padres | Botón Manual -->
            <div class="bottom-row">
                <a href="tienda.html" class="img-btn">
                    <img src="assets/tienda.png" alt="Tienda escolar">
                </a>

                <a href="padres.html" class="img-btn">
                    <img src="assets/padres.png" alt="Padres">
                </a>

                <a href="manual.html" class="img-btn">
                    <img src="assets/manual.png" alt="Manual de sistema">
                </a>
            </div>
        </div>

        <!-- Ilustración de la Derecha (Profesora y Alumna) -->
        <img src="assets/observando.png" alt="Profesora y Alumna La Salle del Sur" class="right-illustration">

    </div>

    <!-- Footer -->
    <footer>
        Lima - Perú | IEP La Salle del Sur — Todos los derechos reservados
    </footer>

    <!-- Script de Voz de Bienvenida y Reproducción de Música -->
    <script>
        const music = document.getElementById('bgMusic');

        window.addEventListener('load', () => {
            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    window.speechSynthesis.cancel();
                    
                    const textoBienvenida = "¡Bienvenidos al Banco Lasallista 360! Sistema financiero educativo de La Salle del Sur. Escanea tu código QR o ingresa tu número para comenzar.";
                    const utterance = new SpeechSynthesisUtterance(textoBienvenida);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.95;
                    utterance.pitch = 1.05;

                    const voices = window.speechSynthesis.getVoices();
                    const vozEspanol = voices.find(v => v.lang.includes('es') && (v.name.includes('Elena') || v.name.includes('Monica') || v.name.includes('Lucia') || v.name.includes('Google') || v.name.includes('Sabrina')));
                    if (vozEspanol) {
                        utterance.voice = vozEspanol;
                    }

                    utterance.onend = function() {
                        music.play().catch(e => console.log("Himno listo"));
                    };

                    window.speechSynthesis.speak(utterance);
                }, 1000);
            }
        });
    </script>
</body>
</html>
