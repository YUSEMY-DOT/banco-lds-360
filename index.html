<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - IEP La Salle del Sur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* 1. Fondo de toda la página con la imagen del Banco */
        body {
            background: linear-gradient(rgba(12, 30, 48, 0.40), rgba(12, 30, 48, 0.40)), 
                        url('assets/banco.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333333;
            overflow-x: hidden;
        }

        /* Barra Superior Institucional */
        header {
            background-color: #0c1e30;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .school-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-info img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .school-text h3 {
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .school-text p {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
            font-style: italic;
        }

        .admin-btn {
            background: #152b42;
            border: 2px solid #f1c40f;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #203f61;
        }

        /* Contenedor Principal (Alineado al filo inferior) */
        .main-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 10px 20px 0px 20px;
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            gap: 0px;
            z-index: 2;
        }

        /* Tarjeta Principal integrada sobre el fondo */
        .portal-card {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 20px 18px 24px 18px;
            border-radius: 26px;
            max-width: 540px;
            width: 100%;
            box-shadow: none;
            border: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .bank-title {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 121, 107, 0.6);
        }

        .bank-subtitle {
            font-size: 0.88rem;
            color: #f1c40f;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* Fila Superior: Botón QR | Niña Dinero | Botón Ingreso */
        .top-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            margin-top: 18px;
            margin-bottom: 20px;
        }

        .img-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            flex: 1;
            width: 100%;
        }

        .top-row .img-btn img {
            width: 100%;
            height: 92px;
            object-fit: fill;
            border-radius: 16px;
            display: block;
            margin-top: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .img-btn:hover {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .center-girl-img {
            width: 165px;
            height: auto;
            flex-shrink: 0;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
        }

        /* Fila Inferior: Botón Tienda | Botón Padres | Botón Manual */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .bottom-row .img-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-row .img-btn img {
            width: 100%;
            height: auto;
            max-height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
        }

        /* Ilustración de la derecha (Profesora y Alumna) */
        .right-illustration {
            max-width: 360px;
            width: 100%;
            height: auto;
            object-fit: contain;
            margin-bottom: 0px;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.4));
        }

        /* Pie de página */
        footer {
            background-color: #0c1e30;
            text-align: center;
            padding: 12px;
            font-size: 0.82rem;
            color: #ffffff;
            font-weight: 600;
            border-top: 3px solid #f1c40f;
            z-index: 10;
        }

        @media (max-width: 950px) {
            .main-container {
                flex-direction: column;
                padding: 20px 15px 0px 15px;
                gap: 20px;
                align-items: center;
            }
            .portal-card {
                margin-bottom: 0;
            }
            .right-illustration {
                max-width: 280px;
            }
        }

        @media (max-width: 600px) {
            .top-row {
                flex-direction: column;
            }
            .bottom-row {
                flex-direction: column;
            }
            .top-row .img-btn img {
                height: 75px;
                margin-top: 0;
            }
            .center-girl-img {
                width: 140px;
            }
        }
    </style>
</head>
<body>

    <!-- Header con Insignia Oficial y Administrador -->
    <header>
        <div class="school-info">
            <img src="assets/insignia.png" alt="Insignia La Salle del Sur">
            <div class="school-text">
                <h3>IEP LA SALLE DEL SUR</h3>
                <p>Formamos personas íntegras</p>
            </div>
        </div>
        <a href="administrador.html" class="admin-btn">
            🔒 Administrador
        </a>
    </header>

    <!-- Contenedor Principal -->
    <div class="main-container">
        
        <!-- Contenido del Banco LDS 360 -->
        <div class="portal-card">
            <h1 class="bank-title">BANCO LDS 360</h1>
            <p class="bank-subtitle">Sistema Financiero Educativo y de Convivencia Escolar</p>

            <!-- Fila Superior: Botón QR lleva a qr.html | Botón Código lleva a alumno.html -->
            <div class="top-row">
                <a href="qr.html" class="img-btn">
                    <img src="assets/qr.png" alt="Escanea QR">
                </a>

                <img src="assets/dinero.png" alt="Niña Banco LDS" class="center-girl-img">

                <a href="alumno.html" class="img-btn">
                    <img src="assets/ingreso.png" alt="Ingresa código">
                </a>
            </div>

            <!-- Fila Inferior: Botón Tienda | Botón Padres | Botón Manual -->
            <div class="bottom-row">
                <a href="tienda.html" class="img-btn">
                    <img src="assets/tienda.png" alt="Tienda escolar">
                </a>

                <a href="padres.html" class="img-btn">
                    <img src="assets/padres.png" alt="Padres">
                </a>

                <a href="manual.html" class="img-btn">
                    <img src="assets/manual.png" alt="Manual de sistema">
                </a>
            </div>
        </div>

        <!-- Ilustración de la Derecha (Profesora y Alumna) -->
        <img src="assets/observando.png" alt="Profesora y Alumna La Salle del Sur" class="right-illustration">

    </div>

    <!-- Footer -->
    <footer>
        Lima - Perú | IEP La Salle del Sur — Todos los derechos reservados
    </footer>

    <!-- SCRIPT DE BIENVENIDA HABLADA PRIMERO + MÚSICA SUAVE HASTA EL LEMA -->
    <script>
        let audioCtx = null;
        let iniciado = false;

        // FRECUENCIAS LIRA (DO MAYOR)
        const FREQS = {
            "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
            "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
        };

        // MELODÍA HASTA "ENSEÑANZA, DISCIPLINA Y LEALTAD" (SE TOCA UNA SOLA VEZ)
        const notasMelodiaBreve = [
            // "Aprendiendo con metas y valores"
            { n: "C4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.7 },
            { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.7 }, { n: "C4", d: 0.7 },
            // "cual nos diste tú mi gran maestro"
            { n: "D4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "A4", d: 0.7 }, { n: "A4", d: 0.7 },
            { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 }, { n: "D4", d: 0.7 },
            // "Lasallista del Sur es nuestro ejemplo"
            { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "C5", d: 0.7 }, { n: "C5", d: 0.7 },
            { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },
            // "de enseñanza, disciplina y lealtad." (AQUÍ FINALIZA Y CORTA)
            { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.7 },
            { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "C4", d: 1.5 }
        ];

        // SINTETIZADOR DE LIRA CON VOLUMEN TENUE
        function sonarLiraSuave(ctx, freq, t, dur) {
            if (!freq) return;
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(freq, t);
            osc2.frequency.setValueAtTime(freq * 2, t);
            
            // Volumen tenue (0.08) para no molestar
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start(t);
            osc2.start(t);
            osc1.stop(t + 0.9);
            osc2.stop(t + 0.9);
        }

        // TAMBOR MARCIAL SUAVE
        function sonarTamborSuave(ctx, t) {
            const bufferSize = ctx.sampleRate * 0.03;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 2000;
            const gain = ctx.createGain();
            
            // Volumen tenue (0.02)
            gain.gain.setValueAtTime(0.02, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(t);
        }

        // REPRODUCE LA MÚSICA UNA SOLA VEZ HASTA EL LEMA Y CORTA
        async function tocarMelodiaHastaLema() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                let t = audioCtx.currentTime + 0.1;
                notasMelodiaBreve.forEach(item => {
                    const f = FREQS[item.n] || 261.63;
                    sonarLiraSuave(audioCtx, f, t, item.d);
                    sonarTamborSuave(audioCtx, t);
                    t += item.d;
                });
            } catch (e) {
                console.log("Audio no iniciado", e);
            }
        }

        // VOZ FEMENINA DE BIENVENIDA AL INICIO
        function darBienvenidaVoz() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const fraseBienvenida = "¡Bienvenidos a la banca LDS 360 de La Salle del Sur!";
                const mensaje = new SpeechSynthesisUtterance(fraseBienvenida);
                mensaje.lang = 'es-PE';
                mensaje.rate = 0.95;
                mensaje.pitch = 1.1;

                const voices = window.speechSynthesis.getVoices();
                const vozFemenina = voices.find(v => v.lang.includes('es') && 
                    (v.name.includes('Elena') || v.name.includes('Monica') || v.name.includes('Lucia') || 
                     v.name.includes('Sabrina') || v.name.includes('Paulina') || v.name.includes('Francisca') || 
                     v.name.includes('Google español') || v.name.includes('Female')));
                
                if (vozFemenina) {
                    mensaje.voice = vozFemenina;
                }

                mensaje.onend = function() {
                    tocarMelodiaHastaLema();
                };

                window.speechSynthesis.speak(mensaje);
            } else {
                tocarMelodiaHastaLema();
            }
        }

        function iniciarFlujo() {
            if (iniciado) return;
            iniciado = true;
            darBienvenidaVoz();
        }

        window.addEventListener('load', () => {
            setTimeout(iniciarFlujo, 400);
        });

        document.addEventListener('touchstart', iniciarFlujo, { once: true });
        document.addEventListener('click', iniciarFlujo, { once: true });
        document.addEventListener('pointerdown', iniciarFlujo, { once: true });
        
    </script>
</body>
</html>
