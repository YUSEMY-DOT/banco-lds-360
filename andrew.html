<style>
:root {
  --azul: #0c1e30;
  --azul-claro: #1e3a8a;

* {

  padding: 0;
  font-family: 'Poppins', sans-serif;
  text-transform: uppercase;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
  font-size: 13px;
  line-height: 1.4;
  padding: 15px;
}

/* PANTALLA DE ACCESO GERENCIAL CON EL FONDO OFICIAL DEL BANCO LDS 360 */

  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Usamos la URL directa proporcionada en la imagen de referencia */
#pantallaAcceso {
  background: linear-gradient(135deg, rgba(12, 30, 48, 0.4) 0%, rgba(12, 30, 48, 0.6) 100%),

<style>
.acceso-card {

}

.acceso-card h2 {

.btn {

}

.btn-light {

  border: 1px solid var(--dorado);
  color: #ffffff;
}

.btn-gold {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  border: 1px solid #fcd34d;
}

.btn-blue {
  background: linear-gradient(135deg, #0c1e30 0%, #1e3a8a 100%);
  color: #ffffff;
  border: 1px solid var(--dorado);
}

.btn-outline {
  background: #ffffff;
  border: 1.5px solid var(--borde);
  color: var(--azul);
}

.layout-main {

@media (min-width: 1100px) {

.left-stack, .right-stack {

.profile-banner {

.stat-pill {

.stat-pill span {
  display: block;

}

.stat-pill strong {
  font-size: 1.1rem;
  font-weight: 900;

  white-space: nowrap;
}

.pill-inicial {
  background: linear-gradient(135deg, #eff6ff, #dbeafe);
  border: 2px solid #3b82f6;
  color: #1e40af;
}

.pill-actual {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);

}

.pill-actual strong { color: #047857; }

.pill-mov {
  background: #f8fafc;
  border: 1.5px solid var(--borde);
  color: var(--azul);
}

@media (max-width: 992px) {
  .profile-banner { flex-wrap: wrap; }
  .stats-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
}

.alert-status {
  background: #ecfdf5;
  border: 1.5px solid #a7f3d0;
  color: #047857;
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.8rem;
}

.mises-panel {

  border-radius: 14px;
  padding: 15px;
}

.mises-panel h3 {
  color: var(--azul);
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 12px;

.mises-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.mise-card {
  border: 1.5px solid var(--dorado);
  border-radius: 12px;
  padding: 8px 10px;
  background: #fffdf7;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.mise-card img {
  width: 42px;
  height: 42px;

  object-fit: cover;
  flex-shrink: 0;
}

.mise-card-info {
  min-width: 0;
}

.mise-card-info strong {
  display: block;
  font-size: 0.68rem;
  color: var(--azul);
  font-weight: 900;
  line-height: 1.2;
}

.mise-card-info span {
  display: block;
  font-size: 0.6rem;
  color: var(--muted);
  font-weight: 700;
}

.mise-card-info p {
  font-size: 0.95rem;
  color: #047857;
  font-weight: 900;
  margin-top: 2px;
}

@media (max-width: 900px) {
  .mises-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.table-panel {
  background: #ffffff;
  border: 2px solid var(--dorado);
  border-radius: 14px;
  padding: 16px;
}

  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.table-head h3 {
  color: var(--azul);
  font-size: 0.9rem;
  font-weight: 800;
}

}

.table-wrap {
  width: 100%;
  height: 380px;

}

  width: 100%;
  border-collapse: collapse;

}

  padding: 8px 10px;

  vertical-align: middle;
}

  background: #f1f5f9;

}

.col-nowrap { white-space: nowrap; }
.col-monto { white-space: nowrap; font-weight: 800; }

.badge-ingreso { color: #047857; background: #ecfdf5; padding: 2px 6px; border-radius: 4px; font-weight: 800; border: 1px solid #a7f3d0; }
.badge-egreso { color: #b91c1c; background: #fef2f2; padding: 2px 6px; border-radius: 4px; font-weight: 800; border: 1px solid #fecaca; }
