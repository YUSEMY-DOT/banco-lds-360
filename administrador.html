<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BANCO LDS 360 — Panel Administrativo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root {
  --azul-oscuro: #07111e;
  --azul-medio: #0f2340;
  --azul-brillante: #1d4ed8;
  --dorado: #f59e0b;
  --dorado-hover: #d97706;
  --fondo: linear-gradient(135deg, #07111e 0%, #0f2340 50%, #091322 100%);
  --blanco: #ffffff;
  --texto: #1e293b;
  --muted: #64748b;
  --borde: #cbd5e1;
  --verde: #10b981;
  --verde-oscuro: #047857;
  --rojo: #ef4444;
  --rojo-oscuro: #b91c1c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  text-transform: uppercase;
}

html, body {
  width: 100%;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--texto);
  font-size: 13px;
  overflow-x: hidden;
}

/* HEADER PRINCIPAL */
header {
  background: #040a14;
  color: #fff;
  padding: 12px 20px;
  border-bottom: 3.5px solid var(--dorado);
  box-shadow: 0 4px 18px rgba(0,0,0,0.6);
}

.header-inner {
  max-width: 1650px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand img {
  width: 46px;
  height: 46px;
  object-fit: contain;
}

.brand h1 {
  font-size: 1.2rem;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: .02em;
}

.brand p {
  color: var(--dorado);
  font-size: 0.68rem;
  font-weight: 800;
}

.btn-header {
  background: rgba(255, 255, 255, 0.12);
  border: 2px solid var(--dorado);
  color: #ffffff;
  padding: 10px 20px;
  border-radius: 22px;
  font-weight: 900;
  font-size: 0.82rem;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-header:hover {
  background: var(--dorado);
  color: var(--azul-oscuro);
}

/* PANTALLA DE ACCESO */
.login-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 85px);
  padding: 20px 12px;
}

.login-card {
  max-width: 480px;
  width: 100%;
  background: #ffffff;
  border-radius: 20px;
  padding: 30px 22px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  text-align: center;
  border-top: 6px solid var(--dorado);
}

.login-card h2 {
  color: var(--azul-oscuro);
  font-size: 1.3rem;
  font-weight: 900;
  margin-bottom: 4px;
}

.login-card p {
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 18px;
}

.mises-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.mise-btn {
  border: 2px solid var(--borde);
  border-radius: 14px;
  background: #f8fafc;
  padding: 12px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.mise-btn:hover, .mise-btn.activa {
  border-color: var(--dorado);
  background: #fef3c7;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(245, 158, 11, 0.3);
}

.mise-btn img {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  object-fit: cover;
  border: 2.5px solid var(--dorado);
  background: #fff;
}

.mise-btn span {
  font-size: 0.65rem;
  font-weight: 900;
  color: var(--azul-oscuro);
}

.input-field {
  width: 100%;
  height: 48px;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  padding: 0 14px;
  font-size: 0.88rem;
  background: #f8fafc;
  font-weight: 800;
  outline: none;
  margin-bottom: 14px;
}

.input-field:focus {
  border-color: var(--azul-brillante);
  background: #ffffff;
}

.primary-btn {
  width: 100%;
  height: 50px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #0f2340 0%, #1d4ed8 100%);
  color: #ffffff;
  font-size: 0.92rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
  transition: all 0.2s ease;
}

.primary-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

/* PANEL PRINCIPAL */
main {
  max-width: 1650px;
  margin: 0 auto;
  padding: 16px;
  display: none;
}

/* BANNER DE CAJA Y TARJETAS DE SALDO */
.profile-banner {
  background: linear-gradient(145deg, #091628 0%, #030812 100%);
  border: 2.5px solid var(--dorado);
  border-radius: 18px;
  padding: 16px 22px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.profile-info {
  display: flex;
  align-items: center;
  gap: 16px;
}

.avatar-wrap {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 3px solid var(--dorado);
  overflow: hidden;
  background: #ffffff;
  flex-shrink: 0;
}

.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(130px, 1fr));
  gap: 12px;
  flex-grow: 1;
  max-width: 850px;
}

.stat-pill {
  background: rgba(3, 8, 15, 0.92);
  border: 2px solid rgba(245, 158, 11, 0.5);
  border-radius: 14px;
  padding: 12px 14px;
  text-align: center;
}

.stat-pill span {
  display: block;
  font-size: 0.65rem;
  color: #cbd5e1;
  font-weight: 900;
  margin-bottom: 3px;
  letter-spacing: 0.5px;
}

.stat-pill strong {
  font-size: 1.20rem;
  color: #ffffff;
  font-weight: 900;
  display: block;
}

/* ESTRUCTURA GENERAL */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(360px, 0.75fr);
  gap: 16px;
  align-items: start;
}

@media(max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); width: 100%; }
}

.panel {
  background: #ffffff;
  border: 2.5px solid var(--dorado);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  margin-bottom: 16px;
}

.panel-head {
  padding: 16px 20px;
  background: #f8fafc;
  border-bottom: 2px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}

.panel-head h3 {
  color: var(--azul-oscuro);
  font-size: 0.98rem;
  font-weight: 900;
}

.panel.collapsed .panel-body { display: none; }
.toggle-icon { font-size: 0.90rem; color: var(--muted); }

.panel-body { padding: 18px; }

/* BARRA DE 6 BOTONES PRINCIPALES */
.action-buttons-bar {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

@media(max-width: 1200px) {
  .action-buttons-bar { grid-template-columns: repeat(3, 1fr); }
}

@media(max-width: 640px) {
  .action-buttons-bar { grid-template-columns: repeat(2, 1fr); }
}

.icon-btn-large {
  min-height: 56px;
  padding: 10px 14px;
  border-radius: 16px;
  border: 2.5px solid;
  font-weight: 900;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.22s ease;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  text-align: center;
  line-height: 1.1;
}

.icon-btn-large:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  filter: brightness(1.08);
}

.icon-btn-large.btn-escaner {
  background: linear-gradient(135deg, #0f2340 0%, #1e3a8a 100%);
  color: #ffffff;
  border-color: var(--dorado);
}

.icon-btn-large.btn-alumno {
  background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
  color: #ffffff;
  border-color: #0369a1;
}

.icon-btn-large.btn-mises {
  background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
  color: #ffffff;
  border-color: #be123c;
}

.icon-btn-large.btn-prestamo {
  background: linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%);
  color: #ffffff;
  border-color: #5b21b6;
}

.icon-btn-large.btn-actualizar {
  background: linear-gradient(135deg, #fde047 0%, #eab308 100%);
  color: #713f12;
  border-color: #ca8a04;
}

.icon-btn-large.btn-imprimir {
  background: linear-gradient(135deg, #facc15 0%, #d97706 100%);
  color: #451a03;
  border-color: #b45309;
}

/* LISTAS DESPLEGABLES INLINE */
.dropdown-inline {
  margin-bottom: 16px;
  border: 2.5px solid var(--dorado);
  border-radius: 14px;
  background: #ffffff;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

.dropdown-head {
  padding: 12px 16px;
  background: #f8fafc;
  border-bottom: 2px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dropdown-head strong { font-size: 0.85rem; color: var(--azul-oscuro); font-weight: 900; }

.dropdown-list { max-height: 260px; overflow-y: auto; padding: 6px; }

.dropdown-row {
  display: grid;
  grid-template-columns: 40px 120px 1fr 100px;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  font-size: 0.78rem;
  align-items: center;
}

.dropdown-row:hover { background: #eff6ff; }
.dropdown-row .code { font-weight: 900; color: var(--azul-brillante); }
.dropdown-row .name { font-weight: 800; color: var(--texto); }

/* TABLA DE MOVIMIENTOS EN EXCEL */
.table-wrap {
  width: 100%;
  height: 450px;
  overflow: auto;
  border: 2.5px solid var(--borde);
  border-radius: 14px;
  background: #ffffff;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 950px;
}

  padding:
