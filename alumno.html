<script>
  /* =========================================================
     CONFIGURACIÓN
     ========================================================= */

  const ALUMNOS_API_URL = "https://script.google.com/macros/s/AKfycbxZ3ZYzBGAfFUdyJpDpMlAAVOBVrDocj3E3jJ1GTZIWTPjlSv1LjfMECbMmDWVU-H-prQ/exec";


  /* =========================================================
     VARIABLES
     ========================================================= */

  let codigoPendiente = "";
  let noncePendiente = "";
  let saltPendiente = "";
  let lector = null;


  /* =========================================================
     UTILIDADES
     ========================================================= */

  function mostrarMensaje(id, texto, tipo) {
    const elemento = document.getElementById(id);
    elemento.textContent = texto;
    elemento.className = "mensaje " + tipo;
  }

  function ocultarMensaje(id) {
    const elemento = document.getElementById(id);
    elemento.className = "mensaje";
    elemento.textContent = "";
  }

  function numero(valor) {
    const n = Number(valor);
    return Number.isFinite(n) ? n : 0;
  }

  function normalizarCodigo(codigo) {
    return String(codigo == null ? "" : codigo)
      .trim()
      .toUpperCase()
      .replace(/[._\s]+/g, "-")
      .replace(/-+/g, "-");
  }

  function escaparHTML(valor) {
    return String(valor == null ? "" : valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function sha256(texto) {
    const datos = new TextEncoder().encode(texto);
    const hash = await crypto.subtle.digest("SHA-256", datos);
    return Array.from(new Uint8Array(hash))
      .map(byte => byte.toString(16).padStart(2, "0"))
      .join("");
  }


  /* =========================================================
     JSONP
     ========================================================= */

  function llamarAPI(parametros) {
    return new Promise(function(resolve, reject) {

      const callback =
        "callbackAlumnoLDS_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      const query = Object.keys(parametros)
        .map(function(clave) {
          return encodeURIComponent(clave) +
            "=" +
            encodeURIComponent(parametros[clave]);
        })
        .join("&");

      const script = document.createElement("script");

      script.src =
        ALUMNOS_API_URL +
        "?" +
        query +
        "&callback=" +
        encodeURIComponent(callback);

      let terminado = false;

      const limpiar = function() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callback];
        } catch (e) {
          window[callback] = undefined;
        }
      };

      const temporizador = setTimeout(function() {
        if (terminado) return;

        terminado = true;
        limpiar();

        reject(
          new Error(
            "El servicio de acceso no respondió a tiempo."
          )
        );
      }, 15000);

      window[callback] = function(respuesta) {
        if (terminado) return;

        terminado = true;
        clearTimeout(temporizador);
        limpiar();

        resolve(respuesta);
      };

      script.onerror = function() {
        if (terminado) return;

        terminado = true;
        clearTimeout(temporizador);
        limpiar();

        reject(
          new Error(
            "No se pudo conectar con BANCO LDS 360."
          )
        );
      };

      document.body.appendChild(script);
    });
  }


  /* =========================================================
     QR
     ========================================================= */

  function detenerQR() {
    if (!lector) return;

    try {
      lector.stop();
    } catch (e) {}

    lector = null;
  }

  function iniciarQR() {

    ocultarMensaje("mensaje");

    if (lector) {
      try {
        lector.stop();
      } catch (e) {}
      lector = null;
    }

    try {
      lector = new Html5Qrcode("lectorQR");
    } catch (error) {
      mostrarMensaje(
        "mensaje",
        "No fue posible iniciar el lector QR.",
        "error"
      );
      return;
    }

    const configuracion = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    lector.start(
      { facingMode: "environment" },
      configuracion,
      function(codigoQR) {

        detenerQR();

        prepararCodigo(codigoQR);

      },
      function(error) {

        // Errores normales de lectura: no interrumpir.

      }
    ).catch(function(error) {

      mostrarMensaje(
        "mensaje",
        "No fue posible iniciar la cámara. Use el ingreso manual.",
        "error"
      );

    });
  }


  /* =========================================================
     IDENTIFICACIÓN
     ========================================================= */

  function ingresarCodigoManual() {

    const codigo = prompt(
      "Ingrese el código del estudiante:"
    );

    if (!codigo) {
      return;
    }

    prepararCodigo(codigo);

  }


  function prepararCodigo(codigo) {

    codigoPendiente = normalizarCodigo(codigo);

    if (!codigoPendiente) {
      mostrarMensaje(
        "mensaje",
        "Ingrese un código válido.",
        "error"
      );
      return;
    }

    noncePendiente = "";
    saltPendiente = "";

    document.getElementById("accesoClave")
      .classList.add("activo");

    document.getElementById("codigoSeleccionado")
      .textContent =
        "Código identificado: " + codigoPendiente +
        ". Ingrese su clave personal para continuar.";

    document.getElementById("claveAlumno").value = "";
    document.getElementById("claveAlumno").focus();

    mostrarMensaje(
      "mensaje",
      "Código identificado. Ahora ingrese su clave personal.",
      "ok"
    );

    prepararReto();
  }


  async function prepararReto() {

    try {

      const respuesta = await llamarAPI({
        accion: "preloginAlumno",
        codigo: codigoPendiente
      });

      if (!respuesta || respuesta.ok !== true) {
        throw new Error(
          respuesta && respuesta.mensaje
            ? respuesta.mensaje
            : "No fue posible validar el código."
        );
      }

      saltPendiente = respuesta.salt;
      noncePendiente = respuesta.nonce;

    } catch (error) {

      noncePendiente = "";
      saltPendiente = "";

      mostrarMensaje(
        "mensaje",
        error && error.message
          ? error.message
          : "No fue posible preparar el acceso.",
        "error"
      );
    }
  }


  /* =========================================================
     LOGIN DEL ALUMNO
     ========================================================= */

  async function confirmarAcceso() {

    const clave =
      document.getElementById("claveAlumno").value;

    if (!codigoPendiente) {
      mostrarMensaje(
        "mensaje",
        "Primero identifique al estudiante.",
        "error"
      );
      return;
    }

    if (!clave) {
      mostrarMensaje(
        "mensaje",
        "Ingrese su clave personal.",
        "error"
      );
      return;
    }

    if (!saltPendiente || !noncePendiente) {
      mostrarMensaje(
        "mensaje",
        "La solicitud de acceso expiró. Vuelva a ingresar el código.",
        "error"
      );
      return;
    }

    try {

      mostrarMensaje(
        "mensaje",
        "Verificando acceso...",
        "ok"
      );

      const hashClave =
        await sha256(
          clave + "|" + saltPendiente
        );

      const prueba =
        await sha256(
          hashClave + "|" + noncePendiente
        );

      const respuesta =
        await llamarAPI({
          accion: "loginAlumno",
          codigo: codigoPendiente,
          nonce: noncePendiente,
          prueba: prueba
        });

      if (!respuesta || respuesta.ok !== true) {
        throw new Error(
          respuesta && respuesta.mensaje
            ? respuesta.mensaje
            : "Credenciales inválidas."
        );
      }

      mostrarFichaEstudiante(respuesta);

      document.getElementById("accesoClave")
        .classList.remove("activo");

      mostrarMensaje(
        "mensaje",
        "Acceso correcto.",
        "ok"
      );

    } catch (error) {

      mostrarMensaje(
        "mensaje",
        error && error.message
          ? error.message
          : "No fue posible iniciar sesión.",
        "error"
      );
    }
  }


  /* =========================================================
     MOSTRAR ESTUDIANTE
     ========================================================= */

  function obtenerURLsFoto(url) {

    const texto =
      String(url || "").trim();

    if (!texto) return [];

    let id = "";

    const matchArchivo =
      texto.match(/\/d\/([a-zA-Z0-9_-]+)/);

    const matchParametro =
      texto.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    if (matchArchivo) {
      id = matchArchivo[1];
    } else if (matchParametro) {
      id = matchParametro[1];
    }

    if (!id) {
      return [texto];
    }

    return [
      texto,
      "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(id) +
        "&sz=w800",
      "https://drive.google.com/uc?export=view&id=" +
        encodeURIComponent(id),
      "https://lh3.googleusercontent.com/d/" +
        encodeURIComponent(id) +
        "=w800"
    ];
  }


  function cargarFoto(url) {

    const foto =
      document.getElementById("datoFoto");

    const urls =
      obtenerURLsFoto(url);

    foto.style.display = "none";
    foto.removeAttribute("src");

    if (!urls.length) return;

    let indice = 0;

    foto.onload = function() {
      foto.style.display = "block";
    };

    foto.onerror = function() {

      indice++;

      if (indice < urls.length) {
        foto.src = urls[indice];
      } else {
        foto.style.display = "none";
      }
    };

    foto.src = urls[0];
  }


  function mostrarFichaEstudiante(datos) {

    const estudiante =
      datos.estudiante || {};

    const cuenta =
      datos.cuenta || {};

    const movimientos =
      Array.isArray(datos.movimientos)
        ? datos.movimientos
        : [];

    document.getElementById("datoCodigo")
      .textContent =
        estudiante.codigo || "-";

    document.getElementById("datoNombre")
      .textContent =
        estudiante.nombreCompleto || "-";

    document.getElementById("datoGrado")
      .textContent =
        estudiante.grado || "-";

    document.getElementById("datoSeccion")
      .textContent =
        estudiante.seccion || "-";

    document.getElementById("datoDocente")
      .textContent =
        estudiante.docente || "-";

    document.getElementById("datoBase")
      .textContent =
        numero(estudiante.montoBase).toFixed(2) +
        " LDS";

    document.getElementById("datoSaldo")
      .textContent =
        numero(cuenta.saldoActual).toFixed(2) +
        " LDS";

    document.getElementById("seccionEstudiante")
      .style.display = "grid";

    document.getElementById("seccionMovimientos")
      .style.display = "block";

    cargarFoto(
      estudiante.fotoUrl ||
      estudiante.foto ||
      ""
    );

    const tabla =
      document.getElementById("tablaMovimientos");

    tabla.innerHTML = "";

    if (!movimientos.length) {

      tabla.innerHTML =
        '<tr><td colspan="6" style="text-align:center">Sin movimientos registrados.</td></tr>';

      return;
    }

    movimientos.forEach(function(movimiento) {

      const fila =
        document.createElement("tr");

      const tipo =
        movimiento.tipo ||
        movimiento.tipoMovimiento ||
        "";

      const clase =
        tipo === "INGRESO"
          ? "ingreso"
          : tipo === "EGRESO"
            ? "egreso"
            : "";

      const monto =
        numero(
          movimiento.monto ||
          movimiento.montoLDS
        );

      fila.innerHTML =
        "<td>" +
          escaparHTML(
            movimiento.fechaTexto ||
            movimiento.fecha ||
            movimiento.timestamp ||
            ""
          ) +
        "</td>" +

        "<td class='" +
          clase +
        "'>" +
          escaparHTML(tipo) +
        "</td>" +

        "<td>" +
          escaparHTML(
            movimiento.concepto || ""
          ) +
        "</td>" +

        "<td>" +
          monto.toFixed(2) +
          " LDS" +
        "</td>" +

        "<td>" +
          escaparHTML(
            movimiento.responsable || ""
          ) +
        "</td>" +

        "<td>" +
          escaparHTML(
            movimiento.observacion || ""
          ) +
        "</td>";

      tabla.appendChild(fila);

    });
  }


  /* =========================================================
     REINICIAR
     ========================================================= */

  function reiniciarAcceso() {

    detenerQR();

    codigoPendiente = "";
    noncePendiente = "";
    saltPendiente = "";

    document.getElementById("claveAlumno").value = "";

    document.getElementById("accesoClave")
      .classList.remove("activo");

    document.getElementById("codigoSeleccionado")
      .textContent = "";

    document.getElementById("seccionEstudiante")
      .style.display = "none";

    document.getElementById("seccionMovimientos")
      .style.display = "none";

    document.getElementById("datoFoto")
      .style.display = "none";

    document.getElementById("datoFoto")
      .removeAttribute("src");

    document.getElementById("tablaMovimientos")
      .innerHTML = "";

    ocultarMensaje("mensaje");
  }


  document.getElementById("claveAlumno")
    .addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        confirmarAcceso();
      }
    });
</script>
