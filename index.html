  // BANCO LDS 360: mantener la dirección limpia del proyecto.
  // Si se abre /index.html, mostrar solamente /banco-lds-360/ en la barra.
  (function(){
    try{
      if(/\/index\.html$/i.test(window.location.pathname)){
        const rutaLimpia = window.location.pathname.replace(/index\.html$/i, '');
        window.history.replaceState({}, document.title, rutaLimpia + window.location.search + window.location.hash);
      }
    }catch(e){}
  })();
</script>

    <div class="scanner-box">
        <div id="reader"></div>
        <button class="btn-cerrar-camara" onclick="cerrarCamaraQR()">Cerrar</button>
    </div>
</div>
<script>
let html5QrCode = null;
function abrirCamaraQR() {
    const modal = document.getElementById("qrScannerModal");
    modal.style.display = "flex";
    if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
    }
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
            let codigoEncontrado = decodedText;
            try {
                if (decodedText.includes("?")) {
                    const urlObj = new URL(decodedText);
                    codigoEncontrado =
                        urlObj.searchParams.get("codigo") || decodedText;
                }
            } catch (e) {}
            cerrarCamaraQR();
            window.location.href =
                `alumno.html?codigo=${encodeURIComponent(
                    codigoEncontrado.trim().toUpperCase()
                )}`;
        },
        () => {}
    ).catch(() => {
        alert("No se pudo iniciar la cámara. Verifique los permisos.");
        cerrarCamaraQR();
    });
}
function ingresarCodigoManual() {
    const modal = document.getElementById("codigoManualModal");
    const input = document.getElementById("codigoManualInput");
    const clave = document.getElementById("claveManualInput");
    modal.style.display = "flex";
    input.value = "";
    clave.value = "";
    setTimeout(() => input.focus(), 50);
}
async function sha256HexLDS360(texto) {
    const datos = new TextEncoder().encode(texto);
    const hash = await crypto.subtle.digest("SHA-256", datos);
    return Array.from(new Uint8Array(hash))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
}
function pedirJSONPLDS360(parametros, callback) {
    const script = document.createElement("script");
    const nombreCallback =
        "lds360_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    parametros.callback = nombreCallback;
    window[nombreCallback] = function(respuesta) {
        try {
            callback(respuesta);
        } finally {
            delete window[nombreCallback];
            script.remove();
        }
    };
    script.onerror = function() {
        delete window[nombreCallback];
        script.remove();
        callback({
            ok: false,
            mensaje: "No se pudo conectar con el acceso de alumnos."
        });
    };
    const query = Object.keys(parametros)
        .map(clave =>
            encodeURIComponent(clave) + "=" +
            encodeURIComponent(parametros[clave] ?? "")
        )
        .join("&");
    script.src =
        "https://script.google.com/macros/s/AKfycbwHpJOXgHX-_uqZxlI5Pm87I9XmlRBJQ2VY2MJ5F3qQeYA2CIaG2HEOOKZUz4nLJLQLZg/exec?" +
        query;
    document.body.appendChild(script);
}

function restaurarBotonIngresar(boton) {
    if (boton) { boton.disabled = false; boton.textContent = "Ingresar"; }
}

function confirmarCodigoManual() {
    const input = document.getElementById("codigoManualInput");
    const clave = document.getElementById("claveManualInput");
    const boton = document.querySelector(".btn-codigo-aceptar");
    const codigo = input.value.trim().toUpperCase();
    const claveValor = clave.value.trim();
    if (!codigo) {
        input.focus();
        return;
    }
    if (!claveValor) {
        clave.focus();
        return;
    }
    if (boton) {
        boton.disabled = true;
        boton.textContent = "Validando...";
    }
    pedirJSONPLDS360(
        {
            accion: "PRELOGINALUMNO",
            codigo: codigo
        },
        async function(pre) {
            if (!pre || pre.ok !== true || !pre.salt) {
                alert(
                    (pre && pre.mensaje) ||
                    "Código de estudiante no encontrado."
                );
                restaurarBotonIngresar(boton);
                return;
            }
            try {
                const hashClave = await sha256HexLDS360(
                    claveValor + "|" + pre.salt
                );
                pedirJSONPLDS360(
                    {
                        accion: "LOGINALUMNO",
                        codigo: codigo,
                        hashClave: hashClave
                    },
                    function(res) {
                        if (res && res.ok === true) {
                            sessionStorage.setItem(
                                "LDS360_CODIGO_MANUAL",
                                codigo
                            );
                            sessionStorage.setItem(
                                "LDS360_ACCESO_VALIDADO",
                                "1"
                            );
                            // alumno.html detectará acceso=validado y mostrará
                            // directamente saldo + movimientos, sin su segundo login.
                            window.location.replace(
                                "alumno.html?codigo=" +
                                encodeURIComponent(codigo) +
                                "&modo=manual&acceso=validado"
                            );
                        } else {
                            alert(
                                (res && res.mensaje) ||
                                "Código o clave incorrectos."
                            );
                            if (boton) {
                                boton.disabled = false;
                                boton.textContent = "Ingresar";
                            }
                        }
                    }
                );
            } catch (error) {
                alert("No se pudo validar la clave.");
                restaurarBotonIngresar(boton);
            }
        }
    );
}
function cerrarCodigoManual() {
    document.getElementById("codigoManualModal").style.display = "none";
}
function cerrarCodigoManualSiFondo(event) {
    if (event.target.id === "codigoManualModal") {
        cerrarCodigoManual();
    }
}
document.addEventListener("keydown", (event) => {
    const modal = document.getElementById("codigoManualModal");
    if (modal.style.display === "flex") {
        if (event.key === "Escape") cerrarCodigoManual();
        if (event.key === "Enter") confirmarCodigoManual();
    }
});
function cerrarCamaraQR() {
    const modal = document.getElementById("qrScannerModal");
    modal.style.display = "none";
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {}).catch(() => {});
    }
}
</script>


<!-- AUDIO INSTITUCIONAL INTEGRADO: HIMNO + EFECTOS + VOZ -->
<script>
(() => {
  let audioCtx = null;
  let iniciado = false;
  let musicaActiva = false;
  let siguienteMusicaTimer = null;

  const FREQS = {
    C4:261.63, D4:293.66, E4:329.63, F4:349.23,
    G4:392.00, A4:440.00, B4:493.88, C5:523.25
  };

  // Campanilla de atención: se conserva completa.
  const llamadaAtencion = [
    {n:"C4",d:.3},{n:"E4",d:.3},{n:"G4",d:.5},{n:"C5",d:.8}
  ];

  // HIMNO COMPLETO: se conserva toda la melodía original proporcionada.
  const himnoMelodia = [
    {n:"C4",d:.4},{n:"E4",d:.4},{n:"G4",d:.7},{n:"G4",d:.7},
    {n:"A4",d:.4},{n:"G4",d:.4},{n:"F4",d:.4},{n:"E4",d:.4},{n:"D4",d:.7},{n:"C4",d:.7},
    {n:"D4",d:.4},{n:"F4",d:.4},{n:"A4",d:.7},{n:"A4",d:.7},
    {n:"B4",d:.4},{n:"A4",d:.4},{n:"G4",d:.4},{n:"F4",d:.4},{n:"E4",d:.7},{n:"D4",d:.7},
    {n:"E4",d:.4},{n:"F4",d:.4},{n:"G4",d:.7},{n:"G4",d:.4},{n:"C5",d:.7},{n:"C5",d:.7},
    {n:"B4",d:.4},{n:"A4",d:.4},{n:"G4",d:.4},{n:"F4",d:.4},{n:"E4",d:.7},
    {n:"D4",d:.4},{n:"E4",d:.4},{n:"F4",d:.7},{n:"F4",d:.7},
    {n:"F4",d:.4},{n:"E4",d:.4},{n:"D4",d:.4},{n:"D4",d:.4},{n:"C4",d:1.5}
  ];

  // Todo este bloque es adicional: no modifica ni reemplaza el portal.
  function sonarLira(ctx, freq, t, dur) {
    if (!freq) return;
    const a=ctx.createOscillator(), b=ctx.createOscillator(), g=ctx.createGain();
    a.type=b.type="sine";
    a.frequency.setValueAtTime(freq,t);
    b.frequency.setValueAtTime(freq*2,t);
    g.gain.setValueAtTime(.18,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.08,dur*1.5));
    a.connect(g); b.connect(g); g.connect(ctx.destination);
    a.start(t); b.start(t);
    a.stop(t+Math.max(.08,dur*1.5));
    b.stop(t+Math.max(.08,dur*1.5));
  }

  function sonarTambor(ctx,t) {
    const n=Math.max(1,Math.floor(ctx.sampleRate*.04));
    const buf=ctx.createBuffer(1,n,ctx.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=buf;
    f.type="highpass"; f.frequency.value=1800;
    g.gain.setValueAtTime(.05,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.04);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
  }

  function tocarMelodia(ctx, melodia, desde) {
    let t=desde;
    melodia.forEach(x=>{
      const f=FREQS[x.n] || 261.63;
      sonarLira(ctx,f,t,x.d);
      sonarTambor(ctx,t);
      t+=x.d;
    });
    return t;
  }

  function reproducirLlamada(ctx,desde){
    return tocarMelodia(ctx,llamadaAtencion,desde);
  }

  function reproducirHimno(ctx,desde){
    return tocarMelodia(ctx,himnoMelodia,desde);
  }

  function mantenerHimno(ctx,desde){
    if(!musicaActiva) return;
    const fin=reproducirHimno(ctx,desde);
    siguienteMusicaTimer=setTimeout(()=>mantenerHimno(ctx,fin+.04),
      Math.max(20,(fin-ctx.currentTime-.04)*1000));
  }

  function detenerMusica(){
    musicaActiva=false;
    if(siguienteMusicaTimer){
      clearTimeout(siguienteMusicaTimer);
      siguienteMusicaTimer=null;
    }
  }

  function hablar(texto, opciones, onend, onerror){
    if(!('speechSynthesis' in window)){
      if(onerror) onerror();
      return false;
    }
    const u=new SpeechSynthesisUtterance(texto);
    u.lang=opciones?.lang || 'es-PE';
    u.rate=opciones?.rate ?? .88;
    u.pitch=opciones?.pitch ?? .95;
    if(onend) u.onend=onend;
    if(onerror) u.onerror=onerror;
    speechSynthesis.speak(u);
    return true;
  }

  // VOZ AL ABRIR CAJA GENERAL: nace directamente del toque/clic del usuario.
  // La navegación se realiza cuando termina la frase para que el navegador no corte el audio.
  let navegandoCajaGeneral=false;
  function abrirCajaGeneralConVoz(event){
    if(navegandoCajaGeneral) return;
    navegandoCajaGeneral=true;
    if(event) event.preventDefault();

    const destino="andrew.html";
    const mensaje="Ingresando a Caja General. Bienvenido, Mister Andrew.";

    if(!("speechSynthesis" in window)){
      window.location.href=destino;
      return;
    }

    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(mensaje);
      u.lang="es-PE";
      u.rate=.90;
      u.pitch=.95;
      u.volume=1;

      let terminado=false;
      const ir=()=>{
        if(terminado) return;
        terminado=true;
        window.location.href=destino;
      };
      u.onend=ir;
      u.onerror=ir;

      // Chrome puede cargar las voces unos instantes después.
      const voces=speechSynthesis.getVoices();
      const vozES=voces.find(v=>/^es(-|_)/i.test(v.lang));
      if(vozES) u.voice=vozES;

      speechSynthesis.resume();
      speechSynthesis.speak(u);

      // Respaldo: nunca deja al usuario atrapado en la portada.
      setTimeout(ir,1800);
    }catch(_){
      window.location.href=destino;
    }
  }

  async function iniciarSecuenciaInstitucional(){
    if(iniciado) return;
    iniciado=true;

    const AC=window.AudioContext || window.webkitAudioContext;
    if(!AC){
      iniciarSoloVoz();
      return;
    }

    try{
      audioCtx = audioCtx || new AC();
      if(audioCtx.state === 'suspended') await audioCtx.resume();
    }catch(e){
      iniciarSoloVoz();
      return;
    }

    // 1. CAMPANILLA INMEDIATA.
    const ahora=audioCtx.currentTime+.03;
    const finCampana=reproducirLlamada(audioCtx,ahora);

    // 2. Al terminar la campanilla comienza la bienvenida.
    const bienvenidaTexto=
      "Bienvenidos a tu entidad financiera LDS 360, La Salle del Sur. Sencillez, responsabilidad y honor.";

    const comenzarHimno=()=>{
      // 3. SOLO después de la bienvenida comienza la melodía del himno.
      const inicioHimno=audioCtx ? audioCtx.currentTime+.06 : 0;
      musicaActiva=true;
      if(audioCtx) mantenerHimno(audioCtx,inicioHimno);

      // 4. La voz acompaña TODO el himno completo.
      const letraHimno=
        "Aprendiendo con metas y valores, cual nos diste tú mi gran maestro. " +
        "Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad. " +
        "Como siempre un paso adelante. " +
        "Sencillez, responsabilidad y honor. " +
        "Es el lema que tú nos enseñaste, ejemplo puro que nos diste al crecer. " +
        "Sabiduría de grandes mentores, en nuestras aulas se educa con amor. " +
        "Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad.";

      hablar(letraHimno,{rate:.84,pitch:.95},()=>{
        // 5. Cuando termina la voz, termina también el acompañamiento.
        detenerMusica();
        continuarComoAntes();
      },()=>{
        detenerMusica();
        continuarComoAntes();
      });
    };

    const hablarBienvenida=()=>{
      hablar(bienvenidaTexto,{rate:.88,pitch:.95},comenzarHimno,comenzarHimno);
    };

    const espera=Math.max(0,(finCampana-audioCtx.currentTime+.05)*1000);
    setTimeout(hablarBienvenida,espera);
  }

  function iniciarSoloVoz(){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    hablar(
      "Bienvenidos a tu entidad financiera LDS 360, La Salle del Sur. Sencillez, responsabilidad y honor.",
      {rate:.88,pitch:.95},
      ()=>continuarComoAntes(),
      ()=>continuarComoAntes()
    );
  }

  function continuarComoAntes(){
    // No depende de elementos que no existen en el HTML original.
    // El portal simplemente queda disponible y continúa con su funcionamiento normal.
    // La indicación final se conserva como en la versión anterior.
    if('speechSynthesis' in window){
      hablar(
        "Selecciona tu opción en el panel para consultar cuentas, registrar transacciones o atender incidencias.",
        {rate:.95,pitch:.95}
      );
    }
  }
  // La presentación institucional SOLO se inicia al pulsar INSTRUCCIONES.
  // No se activa con clics, toques ni botones de las demás zonas.
  const botonInstrucciones = document.getElementById('ldsInstrucciones');

  function activarInstrucciones(){
    if(iniciado) return;
    if(botonInstrucciones) botonInstrucciones.classList.add('oculto');
    iniciarSecuenciaInstitucional();
  }

  if(botonInstrucciones){
    botonInstrucciones.addEventListener('click', activarInstrucciones);
    botonInstrucciones.addEventListener('keydown', (event)=>{
      if(event.key === 'Enter' || event.key === ' '){
        event.preventDefault();
        activarInstrucciones();
      }
    });
  }
})();
</script>

<script>
  // REGISTRO DEL SERVICE WORKER
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // INSTALACIÓN DE BANCO LDS 360
  let promptInstalacion = null;
  const botonInstalar = document.getElementById('botonInstalar');
  const contenedorInstalacion = document.getElementById('contenedorInstalacion');

  function appYaInstalada() {
    return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true ||
           localStorage.getItem('LDS360_APP_INSTALADA') === '1';
  }

  function actualizarBotonInstalacion() {
    if (!botonInstalar || !contenedorInstalacion) return;
    if (appYaInstalada()) {
      contenedorInstalacion.classList.add('instalada');
    } else {
      contenedorInstalacion.classList.remove('instalada');
    }
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    promptInstalacion = e;
    actualizarBotonInstalacion();
  });

  if (botonInstalar) {
    botonInstalar.addEventListener('click', async () => {
      if (promptInstalacion) {
        promptInstalacion.prompt();
        try {
          const { outcome } = await promptInstalacion.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('LDS360_APP_INSTALADA', '1');
            actualizarBotonInstalacion();
          }
        } catch (_) {}
        promptInstalacion = null;
        return;
      }

      // iPhone/iPad y otros navegadores sin aviso automático.
      const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (esIOS) {
        alert('Para instalar BANCO LDS 360: pulsa Compartir y luego “Añadir a pantalla de inicio”.');
      } else {
        alert('Para instalar BANCO LDS 360, abre el menú del navegador y selecciona “Instalar app” o “Añadir a pantalla de inicio”.');
      }
    });
  }

  window.addEventListener('appinstalled', () => {
    localStorage.setItem('LDS360_APP_INSTALADA', '1');
    promptInstalacion = null;
    actualizarBotonInstalacion();
  });

  actualizarBotonInstalacion();
</script>
