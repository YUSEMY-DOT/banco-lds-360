<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himno Institucional en Lira - IEP La Salle del Sur</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-950 via-slate-900 to-indigo-950 text-white min-h-screen flex flex-col justify-between p-4 font-sans select-none">

  <!-- ENCABEZADO -->
  <header class="text-center py-6">
    <div class="inline-block bg-amber-400/20 border border-amber-400/40 text-amber-300 text-xs px-4 py-1.5 rounded-full font-bold uppercase tracking-widest mb-2 shadow">
      IEP La Salle del Sur
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-amber-300 uppercase tracking-wider drop-shadow-lg">
      Himno Institucional
    </h1>
    <p class="text-xs sm:text-sm text-sky-200 mt-1 font-medium">Arreglo de Lira, Flauta Dulce y Percusión Escolar</p>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-md mx-auto w-full bg-slate-800/90 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-amber-400/30 space-y-6 my-auto text-center">
    
    <div class="w-28 h-28 mx-auto bg-gradient-to-tr from-amber-400 via-yellow-400 to-sky-500 rounded-full p-1 shadow-2xl flex items-center justify-center">
      <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-5xl shadow-inner">
        🔔
      </div>
    </div>

    <div class="space-y-3 pt-2">
      <button 
        id="btnPlay" 
        onclick="reproducirLiraEscolar()" 
        class="w-full bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:from-amber-300 hover:to-yellow-300 text-slate-950 font-black py-4 px-6 rounded-2xl shadow-xl transition transform active:scale-95 text-lg flex items-center justify-center gap-3"
      >
        <span class="text-2xl">▶</span> Escuchar Liras y Flautas
      </button>

      <button 
        id="btnStop" 
        onclick="detenerMusica()" 
        class="w-full bg-gradient-to-r from-rose-600 to-red-700 hover:from-rose-500 hover:to-red-600 text-white font-bold py-3 px-6 rounded-2xl shadow-xl transition transform active:scale-95 text-base hidden flex items-center justify-center gap-2"
      >
        <span>⏹</span> Detener
      </button>
    </div>

    <p id="estadoTexto" class="text-xs text-amber-200 font-medium">
      Tono original cantado en Do Mayor (Lira + Flauta + Tambor).
    </p>

  </main>

  <footer class="text-center py-4 text-xs text-slate-400">
    © IEP La Salle del Sur — "Enseñanza, Disciplina y Lealtad"
  </footer>

  <script>
    let audioCtx = null;
    let sonando = false;
    let timerID = null;

    // Frecuencias exactas en Hertz (Do Mayor)
    const FREQS = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
      "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
    };

    // Melodía transcrita de tu voz
    const notasCanto = [
      // Aprendiendo con metas y valores...
      { n: "C4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.7 },
      { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.7 }, { n: "C4", d: 0.7 },

      // cual nos diste tú mi gran maestro...
      { n: "D4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "A4", d: 0.7 }, { n: "A4", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 }, { n: "D4", d: 0.7 },

      // Lasallista del Sur es nuestro ejemplo...
      { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "C5", d: 0.7 }, { n: "C5", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },

      // de enseñanza, disciplina y lealtad.
      { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.7 },
      { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "C4", d: 1.2 },

      // Como siempre un paso adelante...
      { n: "E4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },

      // sencillez, responsabilidad y honor...
      { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.7 },

      // Es el lema que tú nos enseñaste...
      { n: "E4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },

      // ejemplo puro que nos diste al crecer...
      { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "C4", d: 0.7 },

      // Sabiduría de grandes mentores...
      { n: "E4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },

      // en nuestras aulas se educa con amor...
      { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "C4", d: 0.7 },

      // Lasallista del Sur es nuestro ejemplo de enseñanza, disciplina y lealtad...
      { n: "E4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "G4", d: 0.7 }, { n: "G4", d: 0.4 }, { n: "C5", d: 0.7 }, { n: "C5", d: 0.7 },
      { n: "B4", d: 0.4 }, { n: "A4", d: 0.4 }, { n: "G4", d: 0.4 }, { n: "F4", d: 0.4 }, { n: "E4", d: 0.7 },
      { n: "D4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "F4", d: 0.7 }, { n: "F4", d: 0.7 },
      { n: "F4", d: 0.4 }, { n: "E4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "D4", d: 0.4 }, { n: "C4", d: 1.5 }
    ];

    // SINTETIZADOR DE LIRA METÁLICA / GLOCKENSPIEL
    function sonarLira(ctx, freq, t, dur) {
      if (!freq) return;

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.type = 'sine';
      osc2.type = 'sine';

      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 2, t); // Armónico metálico de placa brillante

      gain.gain.setValueAtTime(0.35, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1); // Resonancia propia de la lira

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 1.1);
      osc2.stop(t + 1.1);
    }

    // SINTETIZADOR DE FLAUTA DULCE
    function sonarFlauta(ctx, freq, t, dur) {
      if (!freq) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.01, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur - 0.02);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(t);
      osc.stop(t + dur);
    }

    // PERCUSIÓN MARCIAL SUAVE
    function sonarRedoblante(ctx, t) {
      const bufferSize = ctx.sampleRate * 0.05;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1600;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.10, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
    }

    async function reproducirLiraEscolar() {
      if (sonando) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        sonando = true;
        document.getElementById('btnPlay').classList.add('hidden');
        document.getElementById('btnStop').classList.remove('hidden');
        document.getElementById('estadoTexto').textContent = "🔔 Reproduciendo Lira Metálica, Flauta Dulce y Tambor...";

        let t = audioCtx.currentTime + 0.1;

        notasCanto.forEach(item => {
          const f = FREQS[item.n] || 261.63;
          
          sonarLira(audioCtx, f, t, item.d);
          sonarFlauta(audioCtx, f, t, item.d);
          sonarRedoblante(audioCtx, t);

          t += item.d;
        });

        const duracionTotal = (t - audioCtx.currentTime) * 1000;
        timerID = setTimeout(() => {
          detenerMusica();
        }, duracionTotal);

      } catch (e) {
        alert("Error de audio: " + e.message);
        detenerMusica();
      }
    }

    function detenerMusica() {
      if (timerID) clearTimeout(timerID);
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      sonando = false;

      document.getElementById('btnPlay').classList.remove('hidden');
      document.getElementById('btnStop').classList.add('hidden');
      document.getElementById('estadoTexto').textContent = "Tono original cantado en Do Mayor (Lira + Flauta + Tambor).";
    }
  </script>
</body>
</html>
