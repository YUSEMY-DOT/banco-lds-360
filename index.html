<script>

  /*
=========================================================

     CONFIGURACIÓN

    
========================================================= */

  const APP_SCRIPT_URL
=
"https://script.google.com/macros/s/AKfycbxnYxKgOh3xPibLHQIsLoCM9JYDj48hnY9OQVT0499MzZbZ1G34XfpPfsT29ieVAhFK/exec";

  const SISTEMA =
"BANCO LDS 360";

  const MONEDA =
"LDS";


  /*
=========================================================

     VARIABLES

    
========================================================= */

  let estudianteActual
= null;

  let tipoOperacion =
"";

  let lector = null;

  let categorias = {};

  let
conceptosCatalogo = {};


  /*
=========================================================

     UTILIDADES

    
========================================================= */

  function
mostrarMensaje(id, texto, tipo) {

    const elemento =
document.getElementById(id);

   
elemento.textContent = texto;

    elemento.className
= "mensaje " + tipo;

  }


  function
ocultarMensaje(id) {

    const elemento =
document.getElementById(id);

    elemento.className
= "mensaje";

   
elemento.textContent = "";

  }


  function
generarRequestId() {

    return
"LDS-" +

      Date.now() +

      "-" +

     
Math.random().toString(36).substring(2, 10);

  }


  function
numero(valor) {

    const n =
Number(valor);

    return
Number.isFinite(n) ? n : 0;

  }


  /*
=========================================================

     JSONP

    
========================================================= */

  function
llamarAPI(parametros, callback) {

    if (

      !APP_SCRIPT_URL
||

      APP_SCRIPT_URL
=== "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT"

    ) {

      mostrarMensaje(

       
"mensaje",

        "Falta
colocar la URL de Apps Script.",

       
"error"

      );

      return;

    }


    const
nombreCallback =

     
"callbackLDS_" +

      Date.now() +

      "_" +

     
Math.floor(Math.random() * 100000);


   
parametros.callback = nombreCallback;


    const query =
Object.keys(parametros)

     
.map(function(clave) {

        return
encodeURIComponent(clave) +

         
"=" +

         
encodeURIComponent(parametros[clave]);

      })

     
.join("&");


    const script =
document.createElement("script");

    script.src =
APP_SCRIPT_URL + "?" + query;


   
window[nombreCallback] = function(respuesta) {

      try {

       
callback(respuesta);

      } finally {

        delete
window[nombreCallback];

       
script.remove();

      }

    };


    script.onerror =
function() {

      delete
window[nombreCallback];

      script.remove();

      mostrarMensaje(

       
"mensaje",

        "No se
pudo conectar con BANCO LDS 360.",

       
"error"

      );

    };


   
document.body.appendChild(script);

  }


  /*
=========================================================

     QR

    
========================================================= */

  function iniciarQR()
{

   
ocultarMensaje("mensaje");


    if (lector) {

      try {

        lector.stop();

      } catch (e) {}

      lector = null;

    }


    lector = new
Html5Qrcode("lectorQR");


    const
configuracion = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    };


    lector.start(

      {

        facingMode:
"environment"

      },

      configuracion,

     
function(codigoQR) {

        detenerQR();

       
buscarEstudiante(codigoQR);

      },

      function(error)
{

        // Errores
normales de lectura:

        // no se
muestran para no interrumpir el escaneo.

      }

   
).catch(function(error) {

      mostrarMensaje(

       
"mensaje",

        "No fue
posible iniciar la cámara. Use el botón de ingreso manual.",

       
"error"

      );

    });

  }


  function detenerQR()
{

    if (!lector) {

      return;

    }


    lector.stop()

      .then(function()
{

       
lector.clear();

        lector = null;

      })

     
.catch(function() {

        lector = null;

      });

  }


  /*
=========================================================

     INGRESO MANUAL

    
========================================================= */

  function
ingresarCodigoManual() {

    const codigo =
prompt(

      "Ingrese el
código del estudiante:"

    );


    if (!codigo) {

      return;

    }


   
buscarEstudiante(codigo.trim());

  }


  /*
=========================================================

     CONSULTAR
ESTUDIANTE

    
========================================================= */

  function
buscarEstudiante(codigo) {

    if (!codigo) {

      mostrarMensaje(

       
"mensaje",

        "Ingrese
un código válido.",

       
"error"

      );

      return;

    }


    mostrarMensaje(

     
"mensaje",

     
"Consultando estudiante...",

      "ok"

    );


    llamarAPI(

      {

        accion:
"estudiante",

        codigo: codigo

      },

     
function(respuesta) {

        if (

          !respuesta
||

          respuesta.ok
=== false ||

         
!respuesta.estudiante

        ) {

         
mostrarMensaje(

           
"mensaje",

            respuesta
&& respuesta.mensaje

              ?
respuesta.mensaje

              :
"Estudiante no encontrado.",

           
"error"

          );

          return;

        }


       
estudianteActual = respuesta.estudiante;


        const
estudianteMostrado = Object.assign(

          {},

         
respuesta.estudiante,

          {

           
saldoActual:

             
respuesta.cuenta

                ?
respuesta.cuenta.saldoActual

                : 0

          }

        );

       
mostrarEstudiante(

estudiante.FOTO_URL ||

0;

  function
cargarOpciones() {

    llamarAPI(

      {

        accion:
"opciones"

      },

     
function(respuesta) {

        if (!respuesta
|| respuesta.ok === false) {

         
mostrarMensaje(

           
"mensajeOperacion",

            "No
se pudieron cargar las opciones.",

           
"error"

          );

          return;

        }

        /*

         *
CONFIG_OPCIONES tiene la estructura REAL:

         * A =
INGRESOS_Y_SUELDOS

         * B =
PREMIOS_Y_BONIFICACIONES

         * C =
AHORROS_E_INVERSIONES

         * D =
PAGOS_Y_GASTOS

         * E =
SANCIONES_Y_MULTAS

         * F =
COSTOS_Y_OTROS

         *

         * Apps Script
devuelve esa misma estructura en

         *
respuesta.opcionesPorCategoria.

         */

        const opciones
=

         
respuesta.opcionesPorCategoria &&

          typeof
respuesta.opcionesPorCategoria === "object"

            ?
respuesta.opcionesPorCategoria

            : {};

        categorias =
{};

       
conceptosCatalogo = {};

       
Object.keys(opciones).forEach(function(categoria) {

          const lista
=

           
Array.isArray(opciones[categoria])

              ?
opciones[categoria]

              : [];

         
categorias[categoria] = [];

         
lista.forEach(function(concepto) {

            const
texto =

             
String(concepto || "").trim();

            if
(!texto) {

              return;

            }

            if
(categorias[categoria].indexOf(texto) === -1) {

             
categorias[categoria].push(texto);

            }

          });

        });

        /* Las
opciones se muestran al presionar COBRAR o PAGAR. */

      }

    );

  function

    return
String(categoria || "")

      .trim()

      .toUpperCase()

     
.normalize("NFD")

     
.replace(/[\u0300-\u036f]/g, "")

     
.replace(/[^A-Z0-9]+/g, "_")

     
.replace(/^_+|_+$/g, "");

  }

  /*
=========================================================

     TIPO DE OPERACIÓN

    
========================================================= */

  function
obtenerURLsFoto(url) {

    let texto =
String(url || "").trim();

    if (!texto) return
[];

    // Si la celda
trae una fórmula IMAGE("URL"), extraemos la URL.

    const
imagenFormula =
texto.match(/IMAGE\s*\(\s*[\"']([^\"']+)[\"']/i);

    if (imagenFormula)
texto = imagenFormula[1];

    const urls = [];

    const agregar =
function(valor) {

      if (valor
&& urls.indexOf(valor) === -1) urls.push(valor);

    };

    // URL directa de
imagen.

    if
(/^https?:\/\//i.test(texto)) agregar(texto);

    let id =
"";

    const matchArchivo
= texto.match(/\/d\/([a-zA-Z0-9_-]+)/);

    const
matchParametro = texto.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    const matchOpen =
texto.match(/open\?id=([a-zA-Z0-9_-]+)/i);

    const matchUc =
texto.match(/uc\?id=([a-zA-Z0-9_-]+)/i);

    if (matchArchivo)
id = matchArchivo[1];

    else if
(matchParametro) id = matchParametro[1];

    else if
(matchOpen) id = matchOpen[1];

    else if (matchUc)
id = matchUc[1];

    if (id) {

      // Probamos
varias formas de Google Drive sin modificar el backend.

     
agregar("https://drive.google.com/thumbnail?id=" +
encodeURIComponent(id) + "&sz=w800");

     
agregar("https://drive.google.com/uc?export=view&id=" +
encodeURIComponent(id));

     
agregar("https://lh3.googleusercontent.com/d/" +
encodeURIComponent(id) + "=w800");

    }

    // Si es un ID
puro de Drive.

    if
(/^[a-zA-Z0-9_-]{15,}$/.test(texto)) {

     
agregar("https://drive.google.com/thumbnail?id=" +
encodeURIComponent(texto) + "&sz=w800");

     
agregar("https://drive.google.com/uc?export=view&id=" +
encodeURIComponent(texto));

     
agregar("https://lh3.googleusercontent.com/d/" +
encodeURIComponent(texto) + "=w800");

    }

    return urls;

  }


  function
convertirURLFotoDrive(url) {

    const urls =
obtenerURLsFoto(url);

    return urls.length
? urls[0] : "";

  }

tipo;

document.getElementById("btnCobrar");

    const btnPagar =

     
document.getElementById("btnPagar");

    const opciones =

     
document.getElementById("opcionesOperacion");

panelOperacion =

     
document.getElementById("panelOperacion");

nuevamente responsables para asegurar que el selector esté actualizado. */

value="">Seleccione un concepto</option>';

  /*
=========================================================

     REGISTRAR
MOVIMIENTO

    
========================================================= */

  function
registrarMovimiento() {

   
ocultarMensaje("mensajeOperacion");


    if
(!estudianteActual) {

      mostrarMensaje(

       
"mensajeOperacion",

        "Primero
debe seleccionar un estudiante.",

       
"error"

      );

      return;

    }


    if
(!tipoOperacion) {

      mostrarMensaje(

       
"mensajeOperacion",

       
"Seleccione COBRAR o PAGAR.",

       
"error"

      );

      return;

    }


    const categoria =

     
document.getElementById("categoria").value;


    const concepto =

     
document.getElementById("concepto").value;


    const monto =

      numero(

       
document.getElementById("monto").value

      );


    const responsable
=

     
document.getElementById("responsable").value.trim();


    const observacion
=

     
document.getElementById("observacion").value.trim();


    if (!categoria) {

      mostrarMensaje(

       
"mensajeOperacion",

       
"Seleccione una categoría.",

       
"error"

      );

      return;

    }


    if (!concepto) {

      mostrarMensaje(

       
"mensajeOperacion",

       
"Seleccione un concepto.",

       
"error"

      );

      return;

    }


    if (monto <= 0)
{

      mostrarMensaje(

       
"mensajeOperacion",

        "Ingrese
un monto mayor que 0.",

       
"error"

      );

      return;

    }


    if (!responsable)
{

      mostrarMensaje(

       
"mensajeOperacion",

        "Ingrese
el responsable.",

       
"error"

      );

      return;

    }


    if (

      tipoOperacion
=== "EGRESO" &&

      monto >
numero(estudianteActual.saldoActual)

    ) {

      mostrarMensaje(

       
"mensajeOperacion",

        "El saldo
disponible no permite realizar este pago.",

       
"error"

      );

      return;

    }


    const datos = {

      accion:
"registrar",

      codigo:
estudianteActual.codigo,

      tipo:
tipoOperacion,

      categoria:
categoria,

      concepto:
concepto,

      monto: monto,

      responsable:
responsable,

      observacion:
observacion,

      requestId:
generarRequestId()

    };


    mostrarMensaje(

     
"mensajeOperacion",

     
"Registrando movimiento...",

      "ok"

    );


    llamarAPI(

      datos,

     
function(respuesta) {

        if (!respuesta
|| respuesta.ok === false) {

         
mostrarMensaje(

           
"mensajeOperacion",

            respuesta
&& respuesta.mensaje

              ?
respuesta.mensaje

              :
"No se pudo registrar el movimiento.",

           
"error"

          );

          return;

        }


       
mostrarMensaje(

         
"mensajeOperacion",

         
"Movimiento registrado correctamente.",

         
"ok"

        );


        if
(respuesta.saldoActual !== undefined) {

         
estudianteActual.saldoActual =

           
numero(respuesta.saldoActual);


         
document.getElementById("datoSaldo").textContent =

           
numero(respuesta.saldoActual).toFixed(2) +

            "
" +

            MONEDA;

        }


       
limpiarCamposOperacion();


       
cargarMovimientos(

         
estudianteActual.codigo

        );

      }

    );

  }


  /*
=========================================================

     MOVIMIENTOS

    
========================================================= */

  function
cargarMovimientos(codigo) {

    llamarAPI(

      {

        accion:
"estudiante",

        codigo: codigo

      },

     
function(respuesta) {

        const tabla =

         
document.getElementById("tablaMovimientos");


       
tabla.innerHTML = "";


        if (

          !respuesta
||

          respuesta.ok
=== false ||

         
!Array.isArray(respuesta.movimientos)

        ) {

          return;

        }


       
respuesta.movimientos.forEach(function(movimiento) {

          const fila =

           
document.createElement("tr");


          const fecha
=

           
movimiento.fechaTexto ||

           
movimiento.fecha ||

           
movimiento.timestamp ||

           
"";


          const tipo =

           
movimiento.tipo ||

           
movimiento.tipoMovimiento ||

           
"";


          const
concepto =

           
movimiento.concepto || "";


          const monto
=

            numero(

             
movimiento.monto ||

             
movimiento.montoLDS

            );


          const
responsable =

           
movimiento.responsable || "";


          const
observacion =

           
movimiento.observacion || "";


         
fila.innerHTML =

           
"<td>" +

             
escaparHTML(fecha) +

           
"</td>" +

           
"<td class='" +

              (tipo
=== "INGRESO"

                ?
"ingreso"

                :
"egreso") +

           
"'>" +

             
escaparHTML(tipo) +

           
"</td>" +

           
"<td>" +

             
escaparHTML(concepto) +

           
"</td>" +

           
"<td>" +

             
monto.toFixed(2) +

              "
" +

              MONEDA +

           
"</td>" +

           
"<td>" +

             
escaparHTML(responsable) +

           
"</td>" +

           
"<td>" +

             
escaparHTML(observacion) +

           
"</td>";


         
tabla.appendChild(fila);

        });

      }

    );

  }


  function
escaparHTML(valor) {

    return
String(valor)

     
.replace(/&/g, "&amp;")

     
.replace(/</g, "&lt;")

     
.replace(/>/g, "&gt;")

     
.replace(/"/g, "&quot;")

      .replace(/'/g,
"&#039;");

  }
