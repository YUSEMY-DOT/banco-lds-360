<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco LDS 360 - IEP La Salle del Sur</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 20, 40, 0.5), rgba(0, 20, 40, 0.5)), 
                        url('https://drive.google.com/uc?export=view&id=1bbOOfI_TVSn_aD4_u825hQe4-LDqjoFd') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }

        /* Barra Superior con la Insignia y Administrador */
        header {
            background-color: #0d233a;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .school-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .school-info img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .school-text h3 {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 700;
        }

        .school-text p {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: 600;
        }

        .admin-btn {
            background: #1b365d;
            border: 2px solid #f1c40f;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: #24487d;
        }

        /* Contenedor Principal */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 30px;
            border-radius: 22px;
            max-width: 680px;
            width: 100%;
            color: #1a237e;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 3px solid #b2dfdb;
            text-align: center;
        }

        .bank-title {
            font-size: 2rem;
            color: #00796b;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .bank-subtitle {
            font-size: 0.9rem;
            color: #00897b;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Botones compactos y organizados */
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Fila Superior: Escanear QR e Ingresar Código juntos */
        .row-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Fila Inferior: Manual, Tienda, Padres */
        .row-bottom {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 1.2rem;
        }

        /* Colores exactos (Sin tonos negros) */
        .btn-qr { background: #e0f2fe; color: #0369a1; }
        .btn-codigo { background: #f3e8ff; color: #6b21a8; }
        .btn-manual { background: #66BB6A; color: #1b5e20; } /* Verde limón */
        .btn-tienda { background: #fee2e2; color: #991b1b; }
        .btn-padres { background: #FFD54F; color: #5d4037; } /* Amarillo intenso */

        footer {
            background-color: #0d233a;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 600;
            border-top: 2px solid #f1c40f;
        }

        @media (max-width: 768px) {
            .row-top, .row-bottom {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Audio del Himno (Reproducción automática tras la voz) -->
    <audio id="bgMusic" loop>
        <source src="himno.mp3" type="audio/mpeg">
    </audio>

    <!-- Barra Superior con la Insignia Institucional -->
    <header>
        <div class="school-info">
            <img src="https://drive.google.com/uc?export=view&id=1JqN7T1eCmqc6ewLvUz4zEzHoaSkxZX_g" alt="Insignia La Salle del Sur">
            <div class="school-text">
                <h3>IEP LA SALLE DEL SUR</h3>
                <p>Formamos personas íntegras</p>
            </div>
        </div>
        <a href="admin.html" class="admin-btn">
            🔒 Administrador
        </a>
    </header>

    <!-- Contenedor Central -->
    <div class="main-container">
        <div class="content-panel">
            <h1 class="bank-title">BANCO LDS 360</h1>
            <p class="bank-subtitle">Sistema Financiero Educativo y de Convivencia Escolar</p>

            <div class="buttons-grid">
                <!-- Fila Superior: Escanear QR e Ingresar Código -->
                <div class="row-top">
                    <a href="qr.html" class="nav-btn btn-qr">
                        <span class="icon">📷</span>
                        <span>Escanear QR</span>
                    </a>
                    <a href="codigo.html" class="nav-btn btn-codigo">
                        <span class="icon">#️⃣</span>
                        <span>Ingresar Código</span>
                    </a>
                </div>

                <!-- Fila Inferior: Manual, Tienda, Padres -->
                <div class="row-bottom">
                    <a href="manual.html" class="nav-btn btn-manual">
                        <span class="icon">📖</span>
                        <span>Manual</span>
                    </a>
                    <a href="tienda.html" class="nav-btn btn-tienda">
                        <span class="icon">🛒</span>
                        <span>Tienda</span>
                    </a>
                    <a href="padres.html" class="nav-btn btn-padres">
                        <span class="icon">👨‍👩‍👧</span>
                        <span>Padres</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Lima - Perú | IEP La Salle del Sur — Todos los derechos reservados
    </footer>

    <script>
        const music = document.getElementById('bgMusic');

        // Bienvenida automática por voz seguida del himno institucional
        window.addEventListener('load', () => {
            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance("¡Bienvenidos al Banco Lasallista 360! Sistema financiero educativo de La Salle del Sur. Iniciamos nuestro recorrido.");
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.95;
                    utterance.pitch = 1.1;

                    utterance.onend = function() {
                        music.play().catch(e => console.log("Himno listo para reproducir"));
                    };

                    window.speechSynthesis.speak(utterance);
                }, 1000);
            }
        });
    </script>
</body>
</html>
