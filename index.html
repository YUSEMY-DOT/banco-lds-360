<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b365d">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow-x: hidden; background-color: #0f172a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .contenedor-portada {
    position: relative; width: 100%; max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: center; align-items: center;
  }
  .contenedor-portada img { width: 100%; height: auto; display: block; }

  /* Banner de instalación colorido, amigable y que solo sale una vez */
  #banner-instalacion {
    position: fixed; bottom: -120px; left: 15px; right: 15px; max-width: 500px; margin: 0 auto;
    background: linear-gradient(135deg, #1b365d, #2563eb); color: white;
    padding: 16px 20px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); border: 2px solid #fbbf24;
    transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; font-size: 14px;
  }
  #banner-instalacion.mostrar { bottom: 20px; }
  .info-app-banner { display: flex; align-items: center; gap: 12px; }
  .info-app-banner img { width: 42px; height: 42px; border-radius: 10px; background: white; padding: 2px; }
  #btn-instalar {
    background: #fbbf24; border: none; color: #1e293b; padding: 10px 18px;
    font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.2s; white-space: nowrap;
  }
  #btn-instalar:active { transform: scale(0.95); }
  #btn-cerrar-banner { background: transparent; border: none; color: #cbd5e1; font-size: 18px; cursor: pointer; padding: 4px; }

  /* Contenedor de notificaciones flotantes con sonido */
  #contenedor-notificaciones {
    position: fixed; top: 20px; right: 20px; z-index: 10000;
    display: flex; flex-direction: column; gap: 10px; max-width: 320px; width: 100%;
  }
  .alerta-movimiento {
    background: #ffffff; border-left: 6px solid #10b981; padding: 14px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2); border-radius: 8px; font-size: 13px; color: #1e293b;
    animation: entrarAlerta 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes entrarAlerta {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
