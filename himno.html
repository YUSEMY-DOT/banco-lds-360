<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEP La Salle del Sur - Banco LDS 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-950 via-slate-900 to-indigo-950 text-white min-h-screen flex flex-col justify-between p-6 font-sans select-none">

  <!-- ENCABEZADO INSTITUCIONAL -->
  <header class="text-center py-6">
    <div class="inline-block bg-amber-400/20 border border-amber-400/40 text-amber-300 text-xs px-4 py-1.5 rounded-full font-bold uppercase tracking-widest mb-2 shadow">
      I.E.P. La Salle del Sur — KIDSWork LS
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-amber-300 uppercase tracking-wider drop-shadow-lg">
      Banco LDS 360
    </h1>
    <p class="text-xs sm:text-sm text-sky-200 mt-1 font-medium">"Sencillez, Responsabilidad y Honor"</p>
  </header>

  <!-- VISTA PRINCIPAL DE PORTADA -->
  <main class="max-w-md mx-auto w-full bg-slate-800/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-amber-400/30 space-y-6 my-auto text-center">
    
    <div class="w-28 h-28 mx-auto bg-gradient-to-tr from-amber-400 via-yellow-400 to-sky-500 rounded-full p-1 shadow-2xl flex items-center justify-center">
      <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-5xl shadow-inner animate-pulse">
        🏛️
      </div>
    </div>

    <div class="space-y-2">
      <h2 id="estadoTexto" class="text-2xl font-black text-amber-300">¡Bienvenidos!</h2>
      <p id="subEstadoTexto" class="text-sm text-slate-200 font-medium">
        Iniciando presentación institucional...
      </p>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-500">
    © IEP La Salle del Sur — Banco LDS 360
  </footer>

  <!-- SCRIPT CON EL HIMNO COMPLETO Y LA SECUENCIA EXACTA -->
  <script>
    let audioCtx = null;
    let iniciado = false;

    // FRECUENCIAS LIRA (DO MAYOR)
    const FREQS = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
      "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
    };

    // Secuencia musical ajustada con la letra del Himno institucional
    const himnoConLetra = [
      { n: "C4", d: 0.4, letra: "Aprendiendo" },
      { n: "E4", d: 0.4, letra: "con metas y" },
      { n: "G4", d: 0.7, letra: "valores" },
      { n: "G4", d: 0.7, letra: "cual nos diste" },
      { n: "A4", d: 0.4, letra: "tú mi gran" },
      { n: "G4", d: 0.4, letra: "maestro." },
      { n: "F4", d: 0.4, letra: "Lasallista" },
      { n: "E4", d: 0.4, letra: "del Sur es" },
      { n: "D4", d: 0.7, letra: "nuestro ejemplo" },
      { n: "C4", d: 0.7, letra: "de enseñanza," },
      { n: "D4", d: 0.4, letra: "disciplina" },
      { n: "F4", d: 0.4, letra: "y lealtad." },
      { n: "A4", d: 0.7, letra: "Como siempre" },
      { n: "A4", d: 0.7, letra: "un paso adelante" },
      { n: "B4", d: 0.4, letra: "Sencillez," },
      { n: "A4", d: 0.4, letra: "responsabilidad" },
      { n: "G4", d: 0.4, letra: "y honor." },
      { n: "F4", d: 0.4, letra: "Es el lema" },
      { n: "E4", d: 0.7, letra: "que nos enseñaste" },
      { n: "D4", d: 0.7, letra: "al crecer." },
      { n: "E4", d: 0.4, letra: "Sabiduría" },
      { n: "F4", d: 0.4, letra: "de grandes" },
      { n: "G4", d: 0.7, letra: "mentores" },
      { n: "G4", d: 0.4, letra: "en nuestras" },
      { n: "C5", d: 0.7, letra: "aulas" },
      { n: "C5", d: 0.7, letra: "se educa con amor." },
      { n: "B4", d: 0.4, letra: "Lasallista" },
      { n: "A4", d: 0.4, letra: "del Sur es" },
      { n: "G4", d: 0.4, letra: "nuestro ejemplo" },
      { n: "F4", d: 0.4, letra: "de enseñanza," },
      { n: "E4", d: 0.7, letra: "disciplina" },
      { n: "D4", d: 0.4, letra: "y lealtad." },
      { n: "E4", d: 0.4, letra: "Lealtad." },
      { n: "F4", d: 1.5, letra: "¡La Salle del Sur!" }
    ];

    function sonarLira(ctx, freq, t, dur) {
      if (!freq) return;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 2, t);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.5);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + dur * 1.5);
      osc2.stop(t + dur * 1.5);
    }

    function sonarTambor(ctx, t) {
      const bufferSize = ctx.sampleRate * 0.04;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
    }

    function reproducirHimnoConVisual(ctx) {
      let t = ctx.currentTime + 0.1;
      let duracionTotal = 0;

      himnoConLetra.forEach(item => {
        const f = FREQS[item.n] || 261.63;
        sonarLira(ctx, f, t, item.d);
        sonarTambor(ctx, t);

        // Actualiza el texto en la pantalla conforme va sonando cada parte del himno
        setTimeout(() => {
          document.getElementById("estadoTexto").textContent = "Himno Institucional";
          document.getElementById("subEstadoTexto").textContent = `🎵 "${item.letra}"`;
        }, (t - ctx.currentTime) * 1000);

        t += item.d;
        duracionTotal = t - ctx.currentTime;
      });

      return duracionTotal;
    }

    async function iniciarSecuenciaInstitucional() {
      if (iniciado) return;
      iniciado = true;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        // PASO 1: Locución exacta de bienvenida
        document.getElementById("estadoTexto").textContent = "¡Bienvenidos!";
        document.getElementById("subEstadoTexto").textContent = "Bienvenidos a tu entidad financiera...";

        const textoBienvenida = "Bienvenidos a tu entidad financiera LDS 360, La Salle del Sur. Sencillez, responsabilidad y honor.";
        const mensajeBienvenida = new SpeechSynthesisUtterance(textoBienvenida);
        mensajeBienvenida.lang = 'es-PE';
        mensajeBienvenida.rate = 0.9;
        mensajeBienvenida.pitch = 1.0;

        // PASO 2: Al terminar la bienvenida, se canta el himno institucional completo
        mensajeBienvenida.onend = function() {
          let duracionHimnoSegundos = reproducirHimnoConVisual(audioCtx);

          // PASO 3: Al terminar el himno, se explican las opciones de los botones
          setTimeout(() => {
            document.getElementById("estadoTexto").textContent = "Panel Principal";
            document.getElementById("subEstadoTexto").textContent = "Listo para iniciar operaciones...";

            const textoBotones = "Selecciona tu opción en el panel para consultar cuentas, registrar transacciones o atender incidencias.";
            const mensajeBotones = new SpeechSynthesisUtterance(textoBotones);
            mensajeBotones.lang = 'es-PE';
            mensajeBotones.rate = 0.95;
            mensajeBotones.pitch = 1.0;
            window.speechSynthesis.speak(mensajeBotones);

          }, duracionHimnoSegundos * 1000);
        };

        window.speechSynthesis.speak(mensajeBienvenida);
      }
    }

    // Activación automática al cargar o ante cualquier interacción
    window.addEventListener('load', () => {
      setTimeout(iniciarSecuenciaInstitucional, 400);
    });
    document.addEventListener('touchstart', iniciarSecuenciaInstitucional, { once: true });
    document.addEventListener('click', iniciarSecuenciaInstitucional, { once: true });
    document.addEventListener('pointerdown', iniciarSecuenciaInstitucional, { once: true });
  </script>
</body>
</html>
