<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCO LDS 360 - Panel de Administración</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script defer src="https://unpkg.com/html5-qrcode"></script>
  <script defer src="app.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <header class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold">IEP La Salle del Sur - BANCO LDS 360</h1>
    <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Panel Administración</span>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">Consulta de Estudiante</h2>
      
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="codigoEstudiante" 
          placeholder="Ej: LDS-EST-001" 
          class="flex-1 border rounded-lg px-4 py-2 text-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button 
          onclick="buscarEstudiante()" 
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition"
        >
          Buscar
        </button>
        <button 
          onclick="toggleEscaner()" 
          class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center justify-center gap-2"
        >
          📷 Escanear QR
        </button>
      </div>

      <div id="reader" class="hidden w-full max-w-sm mx-auto overflow-hidden rounded-lg border"></div>
    </section>

    <section id="fichaAlumno" class="hidden bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex items-center gap-4">
        <img 
          id="fotoAlumno" 
          src="https://via.placeholder.com/150" 
          alt="Foto Estudiante" 
          class="w-24 h-24 rounded-full object-cover border-2 border-blue-500 shadow"
        />
        <div>
          <h3 id="nombreAlumno" class="text-xl font-bold text-gray-800">---</h3>
          <p id="gradoAlumno" class="text-gray-500">---</p>
          <div class="mt-2 text-2xl font-extrabold text-blue-900">
            Saldo: <span id="saldoAlumno">0.00</span> LDS
          </div>
        </div>
      </div>

      <div class="border-t pt-4 space-y-3">
        <h4 class="font-semibold text-gray-700">Registrar Atenciones e Incidencias</h4>
        <textarea 
          id="observacion" 
          rows="3" 
          placeholder="Escriba aquí la incidencia o detalle de atención..." 
          class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-blue-500"
        ></textarea>
        <button 
          onclick="guardarIncidenciaLocal()" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition"
        >
          Guardar Incidencia
        </button>
      </div>

      <div class="border-t pt-4">
        <h4 class="font-semibold text-gray-700 mb-2">Historial de Incidencias Guardadas</h4>
        <ul id="listaIncidencias" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto">
          <li class="italic text-gray-400">Sin incidencias registradas hoy.</li>
        </ul>
      </div>
    </section>

  </main>

  <script>
    let html5QrCode = null;
    let escanerActivo = false;

    function toggleEscaner() {
      const readerDiv = document.getElementById('reader');
      if (escanerActivo) {
        detenerEscaner();
      } else {
        readerDiv.classList.remove('hidden');
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        
        // Detección inteligente: Compatible con PC y Celular
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length > 0) {
            let cameraId = devices[0].id; // Por defecto la primera cámara (PC Webcam)
            
            // Si hay varias cámaras, buscar la trasera (para celulares)
            for (let i = 0; i < devices.length; i++) {
              if (devices[i].label.toLowerCase().includes('back') || devices[i].label.toLowerCase().includes('trasera')) {
                cameraId = devices[i].id;
                break;
              }
            }
            
            html5QrCode.start(
              cameraId, 
              { fps: 10, qrbox: { width: 250, height: 250 } },
              onScanSuccess,
              onScanError
            ).then(() => {
              escanerActivo = true;
            }).catch(err => {
              alert("Error al acceder a la cámara. Revise si otorgó los permisos.");
            });
          } else {
            alert("No se detectó ninguna cámara instalada en este dispositivo.");
          }
        }).catch(err => {
          alert("Permiso de cámara denegado. Por favor, acéptelo en la barra de direcciones de su navegador.");
        });
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('codigoEstudiante').value = decodedText;
      detenerEscaner();
      buscarEstudiante();
    }

    function onScanError(error) {
      // Ignorar errores por fotogramas vacíos
    }

    function detenerEscaner() {
      if (html5QrCode && escanerActivo) {
        html5QrCode.stop().then(() => {
          document.getElementById('reader').classList.add('hidden');
          escanerActivo = false;
        }).catch(e => console.error(e));
      }
    }

    function buscarEstudiante() {
      const codigo = document.getElementById('codigoEstudiante').value.trim();
      if (!codigo) return alert("Ingrese un código válido.");

      if (typeof consultarDatosEstudiante === 'function') {
        consultarDatosEstudiante(codigo, actualizarVistaAdmin);
      }
    }

    function actualizarVistaAdmin(data) {
      if (!data || !data.success) {
        alert("No se encontraron datos para el estudiante.");
        return;
      }
      document.getElementById('fichaAlumno').classList.remove('hidden');
      document.getElementById('nombreAlumno').textContent = data.nombre || 'Estudiante';
      document.getElementById('gradoAlumno').textContent = data.grado || 'Primaria';
      document.getElementById('saldoAlumno').textContent = data.saldo || '0.00';

      if (data.foto) {
        document.getElementById('fotoAlumno').src = optimizarUrlFotoDrive(data.foto);
      }

      cargarIncidenciasLocales(data.codigo);
    }

    function guardarIncidenciaLocal() {
      const codigo = document.getElementById('codigoEstudiante').value.trim();
      const obs = document.getElementById('observacion').value.trim();
      if (!obs || !codigo) return alert("Escriba una observación.");

      const key = 'INCIDENCIAS_' + codigo;
      const registros = JSON.parse(localStorage.getItem(key) || '[]');
      registros.push({ fecha: new Date().toLocaleString(), detalle: obs });
      localStorage.setItem(key, JSON.stringify(registros));
      
      document.getElementById('observacion').value = '';
      cargarIncidenciasLocales(codigo);
    }

    function cargarIncidenciasLocales(codigo) {
      const key = 'INCIDENCIAS_' + codigo;
      const registros = JSON.parse(localStorage.getItem(key) || '[]');
      const ul = document.getElementById('listaIncidencias');
      ul.innerHTML = '';

      if (registros.length === 0) {
        ul.innerHTML = '<li class="italic text-gray-400">Sin incidencias registradas hoy.</li>';
        return;
      }

      registros.forEach(item => {
        const li = document.createElement('li');
        li.className = 'bg-gray-50 p-2 rounded border';
        li.innerHTML = `<strong>${item.fecha}:</strong> ${item.detalle}`;
        ul.appendChild(li);
      });
    }

    function optimizarUrlFotoDrive(url) {
      if (!url) return 'https://via.placeholder.com/150';
      if (url.includes('googleusercontent.com') || url.includes('drive.google.com')) {
        return url.split('=')[0] + '=s150';
      }
      return url;
    }
  </script>
</body>
</html>
