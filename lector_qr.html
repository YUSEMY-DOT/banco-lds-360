<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142744">

  <title>Banco LDS 360 · Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    :root{
      --azul:#142744;
      --rojo:#a7192e;
      --gris:#eef1f5;
      --texto:#18243b;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:#0d1a30;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(720px,100%);
      background:#fff;
      color:var(--texto);
      border-radius:28px;
      padding:28px;
      box-shadow:0 25px 80px rgba(0,0,0,.35);
    }

    .head{
      text-align:center;
    }

    .head h1{
      margin:0;
      color:var(--azul);
      font-size:32px;
      line-height:1.15;
    }

    .head p{
      color:#667085;
      font-size:17px;
      line-height:1.4;
      margin:12px auto 22px;
      max-width:580px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:20px;
      background:#081427;
      min-height:280px;
    }

    /*
     * Ocultamos cualquier elemento de control
     * que la librería pudiera generar.
     */
    #reader__dashboard{
      display:none !important;
    }

    #reader__dashboard_section{
      display:none !important;
    }

    #reader__dashboard_section_csr{
      display:none !important;
    }

    #reader__dashboard_section_swaplink{
      display:none !important;
    }

    #status{
      text-align:center;
      color:#667085;
      font-size:15px;
      line-height:1.4;
      margin:16px 0 0;
      min-height:24px;
    }

    .error{
      color:var(--rojo) !important;
    }

    .success{
      color:#15803d !important;
      font-weight:700;
    }

    .mini{
      margin-top:18px;
      text-align:center;
      color:#7b8494;
      font-size:13px;
    }

    @media (max-width:600px){

      body{
        padding:12px;
      }

      .card{
        width:100%;
        border-radius:22px;
        padding:20px;
      }

      .head h1{
        font-size:26px;
      }

      .head p{
        font-size:15px;
      }

      #reader{
        min-height:280px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="head">

      <h1>
        Escanear código QR
      </h1>

      <p>
        Apunta la cámara al código QR del estudiante.
        Al leerlo, volverás automáticamente a Banco LDS 360 Online.
      </p>

    </div>


    <!--
      ÚNICO lector.
      No hay botón para escanear fotos.
      No hay selector de archivos.
    -->
    <div id="reader"></div>


    <div id="status">
      Preparando cámara…
    </div>


    <div class="mini">
      Lector QR externo seguro · HTTPS
    </div>

  </div>


<script>

  let scanner = null;
  let scannerActivo = false;
  let codigoProcesado = false;


  /*
   * Obtiene la dirección de Banco LDS 360
   * a la que debemos regresar.
   */
  function getReturnUrl(){

    const params =
      new URLSearchParams(window.location.search);

    const retorno =
      params.get('return');

    if(!retorno){
      return '';
    }

    try{

      return decodeURIComponent(retorno);

    }catch(error){

      return retorno;

    }

  }


  /*
   * Limpia el código recibido.
   *
   * Ejemplo:
   * LDS-EST-005
   * LDS_EST_005
   * lds est 005
   *
   * Todo termina como:
   * LDS-EST-005
   */
  function extractCode(raw){

    const text =
      String(raw || '').trim();

    if(!text){
      return '';
    }


    const match =
      text.match(/LDS[-_ ]EST[-_ ]\d+/i);


    if(match){

      return match[0]
        .replace(/_/g,'-')
        .replace(/ /g,'-')
        .toUpperCase();

    }


    return text.toUpperCase();

  }


  /*
   * Muestra un mensaje.
   */
  function setStatus(text, clase=''){

    const status =
      document.getElementById('status');

    status.textContent = text;
    status.className = clase;

  }


  /*
   * Detiene la cámara.
   */
  async function stopScanner(){

    scannerActivo = false;

    if(!scanner){
      return;
    }

    try{

      await scanner.stop();

    }catch(error){

      console.log(
        'La cámara ya estaba detenida.'
      );

    }

    try{

      await scanner.clear();

    }catch(error){

      console.log(
        'No fue necesario limpiar el lector.'
      );

    }

  }


  /*
   * Envía el código nuevamente
   * a Banco LDS 360.
   */
  function sendCode(raw){

    if(codigoProcesado){
      return;
    }


    const code =
      extractCode(raw);


    if(!code){
      return;
    }


    codigoProcesado = true;


    const returnUrl =
      getReturnUrl();


    /*
     * Si no existe dirección de regreso,
     * mostramos el código.
     */
    if(!returnUrl){

      setStatus(
        'Código leído: ' + code,
        'success'
      );

      stopScanner();

      return;

    }


    let target =
      returnUrl;


    const separator =
      target.includes('?')
        ? '&'
        : '?';


    target +=
      separator +
      'codigo=' +
      encodeURIComponent(code);


    setStatus(
      'Código leído. Regresando al sistema…',
      'success'
    );


    stopScanner();


    /*
     * Pequeña pausa para que se vea
     * que el código fue reconocido.
     */
    setTimeout(function(){

      window.location.replace(target);

    },450);

  }


  /*
   * Inicia directamente la cámara.
   *
   * IMPORTANTE:
   * facingMode: environment
   * solicita la cámara trasera
   * del celular.
   */
  async function startScanner(){

    if(scannerActivo){
      return;
    }


    /*
     * Esperamos a que html5-qrcode
     * haya terminado de cargar.
     */
    if(typeof Html5Qrcode === 'undefined'){

      setStatus(
        'Preparando el lector QR…'
      );


      setTimeout(
        startScanner,
        300
      );


      return;

    }


    try{

      scanner =
        new Html5Qrcode('reader');


      scannerActivo = true;


      await scanner.start(

        {
          facingMode: {
            ideal: 'environment'
          }
        },

        {
          fps:10,

          qrbox:{
            width:250,
            height:250
          },

          aspectRatio:1.0,

          disableFlip:false

        },


        function(decodedText){

          sendCode(decodedText);

        },


        function(errorMessage){

          /*
           * No mostramos errores de búsqueda.
           * Es normal que aparezcan mientras
           * la cámara está buscando un QR.
           */

        }

      );


      setStatus(
        'Cámara activa. Apunta al código QR.'
      );


    }catch(error){

      console.error(
        'ERROR DE CÁMARA:',
        error
      );


      scannerActivo = false;


      setStatus(
        'No se pudo abrir la cámara. Verifica el permiso del navegador.',
        'error'
      );

    }

  }


  /*
   * Iniciar automáticamente.
   *
   * NO hay botones.
   * NO hay selector de fotos.
   * NO hay selección manual.
   */
  window.addEventListener(
    'load',
    function(){

      setTimeout(
        startScanner,
        500
      );

    }
  );

</script>

</body>
</html>
