<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142744">

  <title>Banco LDS 360 · Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --azul:#142744;
      --rojo:#a7192e;
      --texto:#18243b;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:#0d1a30;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(720px,100%);
      background:#fff;
      color:var(--texto);
      border-radius:28px;
      padding:28px;
      box-shadow:0 25px 80px rgba(0,0,0,.35);
    }

    .head{
      text-align:center;
    }

    .head h1{
      margin:0;
      color:var(--azul);
      font-size:32px;
      line-height:1.15;
    }

    .head p{
      color:#667085;
      font-size:17px;
      line-height:1.4;
      margin:12px auto 22px;
      max-width:580px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:20px;
      background:#081427;
      min-height:300px;
    }

    #reader video{
      width:100% !important;
      height:auto !important;
      display:block;
      border-radius:20px;
    }

    #reader__dashboard{
      display:none !important;
    }

    #reader__dashboard_section{
      display:none !important;
    }

    #reader__dashboard_section_csr{
      display:none !important;
    }

    #reader__dashboard_section_swaplink{
      display:none !important;
    }

    #status{
      text-align:center;
      color:#667085;
      font-size:15px;
      line-height:1.4;
      margin:16px 0 0;
      min-height:24px;
    }

    .error{
      color:var(--rojo) !important;
    }

    .success{
      color:#15803d !important;
      font-weight:700;
    }

    .mini{
      margin-top:18px;
      text-align:center;
      color:#7b8494;
      font-size:13px;
    }

    @media(max-width:600px){

      body{
        padding:12px;
      }

      .card{
        width:100%;
        border-radius:22px;
        padding:20px;
      }

      .head h1{
        font-size:26px;
      }

      .head p{
        font-size:15px;
      }

      #reader{
        min-height:280px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="head">

      <h1>Escanear código QR</h1>

      <p>
        Apunta la cámara al código QR del estudiante.
        Al leerlo, volverás automáticamente a Banco LDS 360 Online.
      </p>

    </div>

    <div id="reader"></div>

    <div id="status">
      Preparando cámara…
    </div>

    <div class="mini">
      Lector QR externo seguro · HTTPS
    </div>

  </div>

<script>

  const BANCO_URL =
    "https://script.google.com/macros/s/AKfycbxgU6tJk-lwidPRobpgO2fsPj4UJsv5hHoqEy9uxgq6w1EsorQETDSkPtGu7AM2qFQAwA/exec";


  let scanner = null;
  let procesando = false;


  function setStatus(text, clase = "") {

    const elemento =
      document.getElementById("status");

    elemento.textContent = text;
    elemento.className = clase;

  }


  function limpiarCodigo(valor) {

    const texto =
      String(valor || "").trim();

    if (!texto) {
      return "";
    }


    const encontrado =
      texto.match(/LDS[-_ ]EST[-_ ]\d+/i);


    if (encontrado) {

      return encontrado[0]
        .replace(/_/g, "-")
        .replace(/ /g, "-")
        .toUpperCase();

    }


    return texto.toUpperCase();

  }


  function volverAlBanco(codigo) {

    if (procesando) {
      return;
    }

    procesando = true;


    setStatus(
      "Código leído. Regresando al sistema…",
      "success"
    );


    if (scanner) {

      scanner.stop()
        .catch(function(){})
        .finally(function(){

          scanner.clear()
            .catch(function(){})
            .finally(function(){

              irAlBanco(codigo);

            });

        });

    } else {

      irAlBanco(codigo);

    }

  }


  function irAlBanco(codigo) {

    const destino =
      BANCO_URL +
      "?codigo=" +
      encodeURIComponent(codigo);

    setTimeout(function(){

      window.location.replace(destino);

    }, 500);

  }


  function iniciarCamara() {

    if (typeof Html5Qrcode === "undefined") {

      setStatus(
        "No se pudo cargar el lector QR.",
        "error"
      );

      return;

    }


    scanner =
      new Html5Qrcode("reader");


    const configuracion = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      configuracion,

      function(decodedText) {

        const codigo =
          limpiarCodigo(decodedText);


        if (!codigo) {
          return;
        }


        volverAlBanco(codigo);

      },

      function(errorMessage) {

        /*
         * No mostramos los errores normales
         * mientras busca el código QR.
         */

      }

    )
    .then(function(){

      setStatus(
        "Cámara activa. Apunta al código QR."
      );

    })
    .catch(function(error){

      console.error(
        "ERROR AL ABRIR LA CÁMARA:",
        error
      );


      setStatus(
        "No se pudo abrir la cámara. Permite el acceso a la cámara del navegador y vuelve a abrir esta página.",
        "error"
      );

    });

  }


  window.addEventListener(
    "load",
    function(){

      iniciarCamara();

    }
  );

</script>

</body>
</html>
