<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCO LDS 360 - IEP La Salle del Sur</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 text-white font-sans min-h-screen flex flex-col justify-between p-4">

  <header class="text-center py-6">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">BANCO LDS 360</h1>
    <p class="text-blue-300 text-sm mt-1">IEP La Salle del Sur — KIDSWork LS</p>
  </header>

  <main class="max-w-md mx-auto w-full space-y-6 flex-1 flex flex-col justify-center">
    
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 shadow-2xl text-center space-y-6">
      <h2 class="text-xl font-bold text-blue-100">Bienvenido al Portal Bancario Escolar</h2>
      <p class="text-xs text-gray-300">Seleccione su tipo de acceso para ingresar al sistema:</p>

      <div class="space-y-4">
        <!-- ACCESO ALUMNO -->
        <a href="alumno.html" class="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg transition transform hover:-translate-y-0.5 text-lg">
          🎓 Portal Estudiante
        </a>

        <!-- ACCESO ADMINISTRATIVO CON VALIDACIÓN DE CLAVE -->
        <div class="border-t border-white/10 pt-4 space-y-3">
          <label class="block text-xs text-blue-200 font-medium">Acceso Administrativo Mises</label>
          <div class="flex gap-2">
            <input 
              type="password" 
              id="adminPin" 
              placeholder="Clave Administrador" 
              class="w-full bg-white/20 border border-white/30 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-emerald-400 text-center tracking-widest"
              onkeydown="if(event.key==='Enter') validarAdmin()"
            />
            <button onclick="validarAdmin()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
              Ingresar
            </button>
          </div>
          <p id="adminError" class="text-rose-400 text-xs font-bold min-h-[16px]"></p>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-gray-400">
    IEP La Salle del Sur — Todos los derechos reservados
  </footer>

  <script>
    function validarAdmin() {
      const input = document.getElementById('adminPin');
      const error = document.getElementById('adminError');
      const pin = (input ? input.value : '').trim();

      if (!pin) {
        error.textContent = 'Ingresa la clave de administrador.';
        return;
      }

      if (pin.toUpperCase() !== '360LDS') {
        error.textContent = 'Clave de administrador incorrecta.';
        return;
      }

      error.textContent = '';
      window.location.href = 'administrador.html';
    }
  </script>
</body>
</html>
