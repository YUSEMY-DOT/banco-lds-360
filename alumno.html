<!-- LOGIN ESTUDIANTE (Cuadradito Bonito Institucional) -->
<div id="vistaLogin" class="bg-[#0c1e30]/95 backdrop-blur-md p-7 rounded-3xl shadow-2xl space-y-4 border-2 border-[#f1c40f]">
  <div class="text-center space-y-1">
    <h2 class="text-xl font-extrabold text-white">Acceso del Estudiante</h2>
    <p class="text-xs text-[#f1c40f] font-semibold">Sistema Financiero Educativo y de Convivencia</p>
  </div>
  
  <!-- Insignia QR Detectado (Oculto por defecto, aparece si escaneó QR) -->
  <div id="qrBadgeContainer" class="hidden bg-[#152b42] border border-[#f1c40f]/70 p-3 rounded-2xl text-center space-y-1 shadow-inner">
    <p class="text-[11px] text-[#f1c40f] font-bold uppercase tracking-wider">✓ Código QR Escaneado</p>
    <p id="qrCodigoTexto" class="text-lg font-extrabold text-white tracking-widest">—</p>
    <button type="button" onclick="resetearCodigoQR()" class="text-xs text-blue-300 underline hover:text-white font-medium">Ingresar código manualmente</button>
  </div>

  <!-- Campo de Código (Se oculta si vino por QR) -->
  <div id="grupoCodigoInput">
    <label class="block text-xs font-semibold text-gray-200 mb-1">Código de Estudiante</label>
    <input type="text" id="loginCodigo" placeholder="Ej: LDS-EST-001" class="w-full bg-white text-gray-900 border-2 border-[#1e3a5f] rounded-xl p-3 uppercase font-bold outline-none focus:ring-2 focus:ring-[#f1c40f]" />
  </div>

  <!-- Campo de Clave -->
  <div>
    <label class="block text-xs font-semibold text-gray-200 mb-1">Clave (6 dígitos)</label>
    <input type="password" id="loginClave" maxlength="6" inputmode="numeric" placeholder="••••••" class="w-full bg-white text-gray-900 border-2 border-[#1e3a5f] rounded-xl p-3 text-center text-2xl tracking-widest font-bold outline-none focus:ring-2 focus:ring-[#f1c40f]" />
  </div>

  <button onclick="procesarLoginAlumno()" class="w-full bg-gradient-to-r from-[#f1c40f] to-[#d4ac0d] hover:brightness-110 text-[#0c1e30] font-extrabold py-3.5 rounded-xl transition shadow-lg text-base">
    Ingresar
  </button>

  <div id="loginError" class="text-rose-400 text-xs text-center min-h-[20px] font-semibold"></div>
</div>

<!-- VISTA PRINCIPAL -->
<div id="vistaPrincipal" class="hidden space-y-4">
  
  <!-- CARD DE SALDO Y FOTO -->
  <div class="bg-gradient-to-r from-[#0c1e30] to-[#152b42] text-white p-6 rounded-3xl shadow-xl relative overflow-hidden border-2 border-[#f1c40f]">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-xs text-[#f1c40f] uppercase font-bold tracking-wider">Saldo Disponible</p>
        <h3 class="text-3xl font-extrabold mt-1"><span id="saldoLDS">0.00</span> <span class="text-sm font-normal text-[#f1c40f]">LDS</span></h3>
      </div>
      <img id="alumnoFoto" src="https://via.placeholder.com/100" alt="Foto del Estudiante" class="w-16 h-16 rounded-full border-2 border-[#f1c40f] object-cover shadow-lg bg-[#152b42]" />
    </div>
    <p id="alumnoNombre" class="mt-4 font-bold text-sm text-white">Cargando...</p>
    <p id="alumnoGrado" class="text-xs text-[#f1c40f] mt-0.5 font-semibold">---</p>
  </div>

  <!-- BOTONES DE ACCIÓN -->
  <div class="grid grid-cols-2 gap-3">
    <button onclick="accionBotonPagar()" class="text-white p-4 rounded-2xl font-bold shadow-lg text-center transition text-sm flex items-center justify-center gap-2 hover:scale-[1.02] border border-rose-500/50" style="background-color: #e11d48 !important;">
      💸 PAGAR / GASTOS
    </button>
    <button onclick="accionBotonMovimientos()" class="text-white p-4 rounded-2xl font-bold shadow-lg text-center transition text-sm flex items-center justify-center gap-2 hover:scale-[1.02] border border-purple-500/50" style="background-color: #9333ea !important;">
      📋 MOVIMIENTOS
    </button>
  </div>

  <!-- FORMULARIO DE REGISTRO DE GASTO -->
  <div id="seccionOperacion" class="hidden bg-[#0c1e30]/95 backdrop-blur-md p-5 rounded-3xl shadow-xl space-y-3 border-2 border-[#f1c40f] text-white">
    <h4 id="tituloOperacion" class="font-extrabold text-[#f1c40f] text-sm">Registrar Pago o Gasto</h4>
    
    <div>
      <label class="block text-xs font-medium text-gray-200 mb-1">Categoría</label>
      <select id="selectCategoria" onchange="alCambiarCategoria()" class="w-full bg-white text-gray-900 border rounded-xl p-2.5 text-sm outline-none font-semibold">
        <option value="">Seleccione categoría</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-200 mb-1">Concepto</label>
      <select id="selectConcepto" class="w-full bg-white text-gray-900 border rounded-xl p-2.5 text-sm outline-none font-semibold">
        <option value="">Seleccione concepto</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-200 mb-1">Monto LDS</label>
      <input type="number" id="inputMonto" min="0" step="0.01" placeholder="0.00" class="w-full bg-white text-gray-900 border rounded-xl p-2.5 text-sm outline-none font-semibold" />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-200 mb-1">Responsable del Registro</label>
      <select id="selectResponsable" class="w-full bg-white text-gray-900 border rounded-xl p-2.5 text-sm outline-none font-semibold">
        <option value="">Seleccione responsable</option>
        <option value="MISS LILY MELO AZAÑERO">MISS LILY MELO AZAÑERO</option>
        <option value="MISS KIARA MORALES ELGUERA">MISS KIARA MORALES ELGUERA</option>
        <option value="MISS ANGHY REYES MELO">MISS ANGHY REYES MELO</option>
        <option value="MISS KARIN MOLERO ROMANI">MISS KARIN MOLERO ROMANI</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-200 mb-1">Observación</label>
      <textarea id="inputObservacion" rows="2" placeholder="Detalle opcional..." class="w-full bg-white text-gray-900 border rounded-xl p-2.5 text-sm outline-none font-semibold"></textarea>
    </div>

    <button onclick="registrarMovimientoOperacion()" class="w-full bg-gradient-to-r from-[#f1c40f] to-[#d4ac0d] hover:brightness-110 text-[#0c1e30] font-extrabold py-2.5 rounded-xl text-sm transition shadow-lg">
      Confirmar y Registrar Pago
    </button>
    <div id="mensajeOperacion" class="text-xs text-center min-h-[18px] font-semibold"></div>
  </div>

  <!-- HISTORIAL -->
  <div id="seccionMovimientos" class="bg-[#0c1e30]/95 backdrop-blur-md p-4 rounded-3xl shadow-xl space-y-3 border-2 border-[#f1c40f] text-white">
    <h4 class="font-extrabold text-[#f1c40f] text-sm">Historial de Movimientos</h4>
    <div id="listaMovimientos" class="space-y-2 max-h-48 overflow-y-auto text-sm">
      <p class="text-gray-400 text-center italic py-2">Sin movimientos recientes.</p>
    </div>
  </div>

  <button onclick="cerrarSesionAlumno()" class="w-full bg-[#152b42] hover:bg-[#203f61] border border-[#f1c40f] text-white font-bold py-2.5 rounded-xl transition text-sm shadow">
    Cerrar Sesión
  </button>
</div>
